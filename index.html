function QuizLiveHost({ quizQuestions, settings, onExit, embed = false }) {
  const [game, setGame] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [qDuration, setQDuration] = useState(20);

  // polling
  useEffect(() => {
    let alive = true;
    const load = async () => { const g = await qlRead(); if (alive && g) setGame(g); };
    load();
    const t = setInterval(load, 1500);
    const tick = setInterval(() => setNow(Date.now()), 250);
    return () => { alive = false; clearInterval(t); clearInterval(tick); };
  }, []);

  const save = (g) => { setGame(g); qlWrite(g); };

  const newGame = () => {
    // 需要：有題目 + 有正確答案 + 至少 2 個選項
    const pool = quizQuestions.filter(q => q.liveShow !== false && q.question && q.question.trim() && (q.answer || '').trim() && Array.isArray(q.options) && q.options.filter(o => o && o.trim()).length >= 2);
    if (pool.length === 0) { alert('沒有可用題目。\n互動競答需要：勾選「顯示在現場」+ 題目 + 正確答案 + 至少 2 個選項。\n請到後台「現場活動 → 趣味競答」確認。'); return; }
    const qList = pool.map(q => {
      const ans = (q.answer || '').trim();
      // 正解 = 與「正確答案」欄相符的選項（不是固定第一個）
      let opts = (q.options || []).filter(o => o && o.trim()).map(text => ({ text: text.trim(), correct: text.trim() === ans }));
      // 若正確答案沒出現在選項裡，把它補進選項，確保一定有正解可選
      if (!opts.some(o => o.correct)) opts.push({ text: ans, correct: true });
      // 洗牌（位置隨機）
      for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
      return { qid: q.id, question: q.question, category: q.category || '', answer: ans, options: opts };
    });
    const room = String(Math.floor(1000 + Math.random() * 9000));
    save({ active: true, room, phase: 'lobby', players: {}, qList, qIdx: -1, qStartTs: 0, qDuration: qDuration * 1000, answers: {}, lastScores: {} });
    _sfx.go();
  };

  const startQuestion = (i) => {
    _sfx.tick();
    save({ ...game, phase: 'question', qIdx: i, qStartTs: Date.now(), answers: {}, lastScores: {} });
  };

  const endQuestion = () => {
    const q = game.qList[game.qIdx];
    const correctIdx = q.options.findIndex(o => o.correct);
    const players = { ...game.players };
    const lastScores = {};
    Object.entries(game.answers || {}).forEach(([pid, a]) => {
      if (a.opt === correctIdx) {
        const pts = qlScore(a.ts - game.qStartTs, game.qDuration);
        players[pid] = { ...(players[pid] || { name: '?', score: 0 }), score: (players[pid]?.score || 0) + pts };
        lastScores[pid] = pts;
      } else {
        lastScores[pid] = 0;
      }
    });
    _sfx.reveal();
    save({ ...game, phase: 'reveal', players, lastScores });
  };

  const SUSPENSE_MS = 7000; // 公布最終排名前的緊張過場
  const nextStep = () => {
    if (game.qIdx + 1 < game.qList.length) startQuestion(game.qIdx + 1);
    else { _sfx.drumroll(SUSPENSE_MS); save({ ...game, phase: 'suspense', suspenseStart: Date.now() }); }
  };

  // 緊張過場結束 → 自動公布最終排名
  useEffect(() => {
    if (game?.phase === 'suspense' && game.suspenseStart) {
      const elapsed = Date.now() - game.suspenseStart;
      const wait = Math.max(0, SUSPENSE_MS - elapsed);
      const t = setTimeout(() => { _sfx.fanfare(); save({ ...game, phase: 'final' }); }, wait);
      return () => clearTimeout(t);
    }
  }, [game?.phase, game?.suspenseStart]);

  const endGame = () => { if (confirm('結束這場競答遊戲？')) save({ active: false, phase: null }); };

  const playUrl = (typeof window !== 'undefined' ? window.location.origin + window.location.pathname : '') + '#quiz-play';
  const players = game?.players || {};
  const playerArr = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => b.score - a.score);
  const answeredCount = Object.keys(game?.answers || {}).length;
  const curQ = game && game.qIdx >= 0 ? game.qList[game.qIdx] : null;
  const remainMs = game && game.phase === 'question' ? Math.max(0, game.qStartTs + game.qDuration - now) : 0;
  const remainSec = Math.ceil(remainMs / 1000);

  // 時間到自動結束

  const Header = () => (

      </div>
    </header>
  );

  return (
    <div className="min-h-screen flex flex-col live-big" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)', fontFamily: '"Noto Sans TC", sans-serif' }}>
      <Header />
      <main className="flex-1 flex flex-col items-center justify-center p-4 text-white text-center overflow-hidden" style={{ minHeight: 0 }}>

        {(!game || !game.active) && (
          <div className="flex flex-col items-center gap-5">
            <div className="text-5xl font-black">🎮 趣味競答</div>
            <div className="text-xl opacity-80">參加者用手機掃 QR 加入，答對又快分數越高</div>
            <div className="flex items-center gap-3">
              <span className="text-lg">每題秒數</span>
              <button onClick={() => setQDuration(d => Math.max(5, d - 5))} className="w-10 h-10 rounded-full bg-white/20 font-bold text-2xl">−</button>
              <span className="text-3xl font-bold" style={{ color: '#F5B800' }}>{qDuration}</span>
              <button onClick={() => setQDuration(d => d + 5)} className="w-10 h-10 rounded-full bg-white/20 font-bold text-2xl">＋</button>
            </div>
            <button onClick={newGame} className="px-12 py-5 rounded-2xl text-3xl font-black shadow-2xl active:scale-95" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>🚀 開新遊戲</button>
          </div>
        )}

        {game?.active && game.phase === 'lobby' && (
          <div className="flex flex-col items-center gap-4 w-full">

        {game?.active && game.phase === 'question' && curQ && (
          <div className="flex flex-col items-center gap-3 w-full max-w-5xl">
            <div className="flex items-center justify-between w-full">

            </div>
            <div className="rounded-full font-black flex items-center justify-center" style={{ width: 90, height: 90, background: remainSec <= 5 ? '#DC2626' : '#F5B800', color: 'white', fontSize: '3rem', animation: remainSec <= 5 ? 'pulse 0.6s infinite' : 'none' }}>{remainSec}</div>
            <div className="rounded-2xl p-5 w-full" style={{ background: 'rgba(255,255,255,0.1)', border: '3px solid rgba(255,255,255,0.2)' }}>

        )}
        <input ref={nameInputRef} defaultValue={name} onKeyDown={e => e.key === 'Enter' && join()} placeholder="輸入你的暱稱" maxLength={12}
          className="w-full max-w-xs px-4 py-3 rounded-xl text-center text-xl outline-none mb-3" style={{ color: '#1F2937' }} autoFocus />
        <button onClick={join} className="w-full max-w-xs py-4 rounded-xl text-xl font-black active:scale-95" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>加入遊戲</button>
        <HomeFAB />
      </QLWrap>
    );
  }

  if (game.phase === 'lobby') return (
    <QLWrap>
      <div className="text-4xl mb-2">✅</div>
      <div className="text-2xl font-bold mb-1">{name}</div>
      <div className="text-lg opacity-80 mb-4">已加入！等待主持人開始…</div>
      <div className="text-sm opacity-60 mb-2">目前 {playerArr.length} 人</div>
      <div className="flex flex-wrap gap-2 justify-center max-w-md">
        {playerArr.map(p => (
          <span key={p.id} className="px-3 py-1.5 rounded-full text-base font-bold" style={{ background: p.id === pid ? '#F5B800' : 'rgba(255,255,255,0.15)', color: p.id === pid ? '#1F2937' : 'white' }}>{p.name}</span>
        ))}
      </div>
    </QLWrap>
  );

  if (game.phase === 'question' && curQ) {
    if (myAnswer !== null || remainSec <= 0) {
      return <QLWrap><div className="text-5xl mb-3">{myAnswer !== null ? '✅' : '⏱'}</div><div className="text-2xl font-bold">{myAnswer !== null ? '已作答！' : '時間到'}</div><div className="text-lg opacity-70 mt-1">等待其他人 / 揭曉</div></QLWrap>;
    }
    return (
      <div className="min-h-screen flex flex-col p-3" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)', color: 'white' }}>
        <div className="flex items-center justify-between mb-2 shrink-0">
          <span className="text-base opacity-70">第 {game.qIdx + 1} / {game.qList.length} 題</span>
          <span className="text-3xl font-black" style={{ color: remainSec <= 5 ? '#FCA5A5' : '#F5B800' }}>{remainSec}s</span>
        </div>
        {/* 題目（滿版顯示）*/}
        <div className="rounded-2xl p-4 mb-3 text-center shrink-0" style={{ background: 'rgba(255,255,255,0.12)' }}>
          <div className="text-2xl font-bold leading-snug">{curQ.question}</div>
        </div>
        {/* 選項：按鈕高度適中、選項文字大、符號小 */}
        <div className="grid grid-cols-2 gap-2.5">
          {curQ.options.map((o, i) => (
            <button key={i} onClick={() => answer(i)} className="rounded-2xl flex items-center gap-2 active:scale-95 transition px-3 py-4" style={{ background: QL_OPT_COLORS[i], minHeight: '15vh' }}>
              <span className="text-2xl shrink-0 opacity-90">{QL_OPT_SHAPES[i]}</span>
              <span className="text-2xl font-black leading-tight text-left flex-1">{o.text}</span>
            </button>
          ))}
        </div>
        <div className="text-center text-sm opacity-60 mt-3 shrink-0">點選你的答案</div>
      </div>
    );
  }

  if (game.phase === 'reveal' && curQ) {
    const correctIdx = curQ.options.findIndex(o => o.correct);
    const gotIt = myAnswer === correctIdx;
    const earned = game.lastScores?.[pid] || 0;
    return <QLWrap bg={gotIt ? 'linear-gradient(135deg,#065F46,#10B981)' : 'linear-gradient(135deg,#7F1D1D,#DC2626)'}>
      <div className="text-6xl mb-2">{gotIt ? '🎉' : '😢'}</div>
      <div className="text-3xl font-black mb-1">{gotIt ? `答對！+${earned} 分` : '答錯了'}</div>
      <div className="text-base opacity-80 mb-3">正確答案：{curQ.options[correctIdx]?.text}</div>
      <div className="px-5 py-2 rounded-xl mb-4" style={{ background: 'rgba(0,0,0,0.3)' }}>
        <span className="text-sm opacity-70">你目前 </span><span className="text-2xl font-black">第 {myRank} 名 · {myScore} 分</span>
      </div>
      {/* 完整排行榜（與主畫面同步）*/}
      <div className="w-full max-w-sm space-y-1.5">
        <div className="text-sm opacity-70 mb-1">🏆 即時排行榜</div>
        {playerArr.slice(0, 8).map((p, i) => (
          <div key={p.id} className="flex items-center justify-between px-4 py-2 rounded-lg" style={{ background: p.id === pid ? 'rgba(245,184,0,0.35)' : 'rgba(0,0,0,0.2)' }}>
            <span className="font-bold text-lg">{['🥇','🥈','🥉'][i] || (i + 1)} {p.name}</span>
            <span className="font-black text-lg">{p.score}</span>
          </div>
        ))}
      </div>
    </QLWrap>;
  }

  if (game.phase === 'suspense') {
    return <QLWrap bg="linear-gradient(135deg,#111827,#1E1B4B)">
      <div className="text-7xl mb-4" style={{ animation: 'bigZoom 0.8s ease-in-out infinite alternate' }}>🥁</div>
      <div className="text-3xl font-black mb-2" style={{ animation: 'pulse 0.8s infinite' }}>緊張時刻…</div>
      <div className="text-lg opacity-80">即將公布最終排名</div>
      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes bigZoom{from{transform:scale(0.9)}to{transform:scale(1.15)}}`}</style>
    </QLWrap>;
  }

  if (game.phase === 'final') {
    return <QLWrap bg={myRank <= 3 ? 'linear-gradient(135deg,#B45309,#F5B800)' : undefined}>
      <div className="text-6xl mb-3">{myRank === 1 ? '👑' : myRank <= 3 ? '🏆' : '🎮'}</div>
      <div className="text-2xl font-bold mb-1">{name}</div>
      <div className="text-5xl font-black mb-2" style={{ color: '#FCD34D' }}>第 {myRank} 名</div>
      <div className="text-2xl">{myScore} 分</div>
      <div className="text-base opacity-70 mt-4">感謝參與！</div>
    </QLWrap>;
  }

  return <QLWrap><div className="text-xl">⌛ 準備中…</div></QLWrap>;
}

// ============== 幸運大抽獎 ==============
function LotteryGame({ registrations = [], sponsorships = [], lotteryWinners = [], setLotteryWinners, settings, onExit, embed = false }) {
  const [selectedPrizeId, setSelectedPrizeId] = useState(null);
  const [drawCount, setDrawCount] = useState(1);
  const [rolling, setRolling] = useState(false);
  const [rollNames, setRollNames] = useState([]); // 滾動中顯示的名字
  const [results, setResults] = useState(null);   // 抽出的得主
  const [showConfetti, setShowConfetti] = useState(false);
  const [showList, setShowList] = useState(false);
  const rollTimerRef = useRef(null);

  // 抽獎票券：每位報名者產生 (1 + 攜伴數) 張票
  // 本人 1 張 + 每位家屬 1 張，帶越多人抽中機會越多
  const tickets = useMemo(() => {
    const list = [];
    registrations.filter(r => r.name && r.name.trim()).forEach(r => {
      const comp = Math.max(0, Number(r.companions) || 0);
      const name = r.name.trim();
      list.push({ ticketId: `${r.id}-0`, regId: r.id, name, group: r.group || '', label: name, isGuest: false });
      for (let i = 1; i <= comp; i++) {
        list.push({ ticketId: `${r.id}-${i}`, regId: r.id, name, group: r.group || '', label: `${name} 的家屬${comp > 1 ? i : ''}`, isGuest: true });
      }
    });
    return list;
  }, [registrations]);

  // 已中獎的票券（用 ticketId 記錄；舊資料沒有 ticketId 則退回用 name 比對）
  const wonTicketIds = useMemo(() => new Set(lotteryWinners.map(w => w.ticketId).filter(Boolean)), [lotteryWinners]);
  const wonNamesLegacy = useMemo(() => new Set(lotteryWinners.filter(w => !w.ticketId).map(w => w.name)), [lotteryWinners]);

  // 抽獎池：扣掉已中的票
  const pool = useMemo(() => tickets.filter(t => !wonTicketIds.has(t.ticketId) && !wonNamesLegacy.has(t.name)), [tickets, wonTicketIds, wonNamesLegacy]);
  const totalPeople = useMemo(() => registrations.filter(r => r.name && r.name.trim()).reduce((s, r) => s + 1 + Math.max(0, Number(r.companions) || 0), 0), [registrations]);

  const lotteryPrizes = useMemo(() => sponsorships.filter(s => s.forLottery && s.name && s.name.trim()), [sponsorships]);
  const selectedPrize = sponsorships.find(s => String(s.id) === String(selectedPrizeId));

  const doDraw = () => {
    if (rolling) return;
    if (pool.length === 0) { alert('沒有可抽的票了（都抽完或名單是空的）'); return; }
    const n = Math.min(drawCount, pool.length);

    setResults(null);
    setRolling(true);
    _sfx.tick();

    let ticks = 0;
    const totalTicks = 30; // 約 2.4 秒
    rollTimerRef.current = setInterval(() => {
      ticks++;
      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
      setRollNames(shuffled.map(p => p.label));
      if (ticks % 3 === 0) _sfx.tick();
      if (ticks >= totalTicks) {
        clearInterval(rollTimerRef.current);
        const winners = [...pool].sort(() => Math.random() - 0.5).slice(0, n);
        const records = winners.map(w => ({
          ticketId: w.ticketId,
          name: w.label,
          baseName: w.name,
          group: w.group || '',
          prize: selectedPrize ? selectedPrize.name : '',
          prizeId: selectedPrize ? selectedPrize.id : null,
          ts: Date.now() + Math.random(),
        }));
        setResults(records);
        setRollNames(winners.map(w => w.label));
        setRolling(false);
        setShowConfetti(true);
        _sfx.fanfare();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
        setTimeout(() => setShowConfetti(false), 4000);
        setLotteryWinners([...lotteryWinners, ...records]);
      }
    }, 80);
  };

  useEffect(() => () => { if (rollTimerRef.current) clearInterval(rollTimerRef.current); }, []);

  const resetCurrent = () => { setResults(null); setRollNames([]); };

  // 撤銷某筆中獎（放回池子）
  const undoWinner = (ts) => {
    if (!confirm('確定撤銷這筆中獎？該員會放回抽獎池')) return;
    setLotteryWinners(lotteryWinners.filter(w => w.ts !== ts));
  };

  return (
    <div className="min-h-screen flex flex-col live-big" style={{ background: 'linear-gradient(135deg, #1A0F0F 0%, #2A1505 100%)', fontFamily: '"Noto Sans TC", sans-serif' }}>
      <header className="flex items-center justify-between px-4 md:px-6 py-3 border-b shrink-0" style={{ borderColor: '#F5B800' }}>
        <button onClick={() => setShowList(v => !v)} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
          📋 中獎名單 ({lotteryWinners.length})
        </button>
        <div className="text-white font-bold text-lg">🎁 幸運大抽獎</div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場
          </button>
        </div>
      </header>

      {showList ? (
        // 中獎名單檢視
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-3xl mx-auto w-full">
          <div className="text-white text-2xl font-bold mb-4 text-center">🏆 已中獎名單（{lotteryWinners.length} 位）</div>
          {lotteryWinners.length === 0 ? (
            <div className="text-center text-white/50 py-10">尚未抽出任何得主</div>
          ) : (
            <div className="space-y-2">
              {lotteryWinners.map((w, i) => (
                <div key={w.ts} className="flex items-center justify-between px-4 py-3 rounded-xl" style={{ background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(245,184,0,0.3)' }}>
                  <div className="flex items-center gap-3">
                    <div className="text-xl">🎉</div>
                    <div>
                      <div className="text-white font-bold text-lg">{w.name}{w.group ? <span className="text-sm text-white/50 ml-2">第{w.group}組</span> : null}</div>
                      {w.prize && <div className="text-sm" style={{ color: '#F5B800' }}>🎁 {w.prize}</div>}
                    </div>
                  </div>
                  <button onClick={() => undoWinner(w.ts)} className="text-xs px-2 py-1 rounded" style={{ color: '#FCA5A5', border: '1px solid rgba(252,165,165,0.4)' }}>撤銷</button>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <main className="flex-1 overflow-hidden p-4 flex flex-col items-center justify-center text-center text-white gap-4" style={{ minHeight: 0 }}>
          {/* 設定列 */}
          <div className="flex flex-wrap items-center justify-center gap-3 shrink-0">
            {/* 選獎品 */}
            <select value={selectedPrizeId || ''} onChange={e => setSelectedPrizeId(e.target.value || null)}
              className="px-4 py-2.5 rounded-xl text-base font-bold outline-none" style={{ background: 'rgba(255,255,255,0.1)', color: 'white', border: '2px solid rgba(245,184,0,0.5)' }}>
              <option value="" style={{ color: 'black' }}>🎁 選擇獎品（可不選）</option>
              {lotteryPrizes.map(s => (
                <option key={s.id} value={s.id} style={{ color: 'black' }}>{s.name}{s.qty ? `（${s.qty}份）` : ''}</option>
              ))}
            </select>
            {/* 抽幾位 */}
            <div className="flex items-center gap-2 px-3 py-2 rounded-xl" style={{ background: 'rgba(255,255,255,0.1)', border: '2px solid rgba(245,184,0,0.5)' }}>
              <span className="text-sm">一次抽</span>
              <button onClick={() => setDrawCount(c => Math.max(1, c - 1))} className="w-7 h-7 rounded-full bg-white/20 font-bold">−</button>
              <span className="text-xl font-bold w-8" style={{ color: '#F5B800' }}>{drawCount}</span>
              <button onClick={() => setDrawCount(c => c + 1)} className="w-7 h-7 rounded-full bg-white/20 font-bold">＋</button>
              <span className="text-sm">位</span>
            </div>
          </div>

          {selectedPrize && (
            <div className="text-lg shrink-0" style={{ color: '#F5B800' }}>本回合獎品：🎁 {selectedPrize.name}</div>
          )}
          {lotteryPrizes.length === 0 && (
            <div className="text-sm shrink-0" style={{ color: 'rgba(255,255,255,0.5)' }}>（贊助禮品還沒勾「列入抽獎」，可純抽人或回後台勾選）</div>
          )}

          {/* 滾動 / 結果區 */}
          <div className="flex-1 flex flex-col items-center justify-center w-full min-h-0 overflow-hidden px-2">
            {results ? (() => {
              const n = results.length;
              const cols = n === 1 ? 1 : n <= 6 ? 2 : 3;
              const rows = Math.ceil(n / cols);
              const nameFs = `${Math.max(4, Math.min(13, Math.floor(44 / rows)))}vh`;
              const groupFs = `${Math.max(1, Math.min(2.4, 12 / rows))}vh`;
              return (
                <div className="w-full h-full flex flex-col" style={{ animation: 'bigZoom 0.6s ease' }}>
                  <div className="text-center shrink-0 mb-2" style={{ color: '#F5B800', fontSize: 'clamp(1.2rem, 3.2vh, 2.2rem)' }}>🎉 恭喜中獎 🎉</div>
                  <div className="flex-1 min-h-0 grid gap-2 content-center justify-center" style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))`, overflow: 'hidden' }}>
                    {results.map((r, i) => (
                      <div key={i} className="rounded-2xl flex flex-col items-center justify-center text-center px-3 py-2 min-w-0" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', boxShadow: '0 0 30px rgba(245,184,0,0.4)', animation: `slideUpBounce 0.5s ease ${i * 0.1}s both` }}>
                        <div className="font-black text-white leading-none" style={{ fontSize: nameFs, wordBreak: 'break-word' }}>{r.name}</div>
                        {r.group && <div className="text-white/80 mt-1" style={{ fontSize: groupFs }}>第 {r.group} 組</div>}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })() : (() => {
              const n = Math.max(1, rollNames.length || drawCount || 1);
              const cols = n === 1 ? 1 : n <= 6 ? 2 : 3;
              const rows = Math.ceil(n / cols);
              const nameFs = `${Math.max(4, Math.min(14, Math.floor(50 / rows)))}vh`;
              return (
                <div className="w-full h-full flex items-center justify-center py-2">
                  <div className="rounded-3xl w-full h-full p-4 flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.3)', border: '4px solid #F5B800', animation: rolling ? 'glowPulse 0.6s ease-in-out infinite' : 'none' }}>
                    {rollNames.length > 0 ? (
                      <div className="grid gap-x-6 gap-y-2 content-center justify-center w-full" style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}>
                        {rollNames.map((nm, i) => (
                          <div key={i} className="font-black text-center leading-none min-w-0" style={{ color: '#F5B800', textShadow: '0 0 30px rgba(245,184,0,0.6)', fontSize: nameFs, wordBreak: 'break-word' }}>{nm}</div>
                        ))}
                      </div>
                    ) : (
                      <div className="text-white/40" style={{ fontSize: 'clamp(1.5rem, 5vh, 3rem)' }}>準備開始抽獎</div>
                    )}
                  </div>
                </div>
              );
            })()}
          </div>

          {/* 池子資訊 + 按鈕 */}
          <div className="shrink-0 flex flex-col items-center gap-3">
            <div className="text-sm text-white/60">抽獎池剩 {pool.length} 籤 · 已中 {lotteryWinners.length} 籤 · 總名額 {totalPeople}（含攜伴）</div>
            <div className="flex gap-3">
              {results && (
                <button onClick={resetCurrent} className="px-6 py-4 rounded-2xl text-lg font-bold text-white" style={{ border: '2px solid rgba(255,255,255,0.3)' }}>
                  繼續抽下一輪
                </button>
              )}
              <button onClick={doDraw} disabled={rolling || pool.length === 0}
                className="px-10 md:px-16 py-4 md:py-5 rounded-2xl text-2xl md:text-3xl font-black text-white shadow-2xl active:scale-95 transition"
                style={{ background: pool.length === 0 ? '#666' : 'linear-gradient(135deg, #DC2626, #F5B800)', opacity: rolling ? 0.7 : 1, animation: !rolling && pool.length > 0 && !results ? 'pulse 1.2s ease-in-out infinite' : 'none' }}>
                {rolling ? '🎰 抽獎中…' : results ? '🎲 再抽一次' : '🎲 開始抽獎'}
              </button>
            </div>
          </div>
        </main>
      )}

      <style>{`
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      `}</style>
      <Confetti show={showConfetti} count={100} />
    </div>
  );
}

// ============== 現場模式（V6 升級版） ==============
function LiveMode({ flow, awards, staff, contestants, contestantVotes, votingOpen, showVoteResults, setVotingOpen, setShowVoteResults, songs, setSongs, quizQuestions, setQuizQuestions, registrations = [], sponsorships = [], settings, onExit }) {
  const [now, setNow] = useState(Date.now());
  const [gameMode, setGameMode] = useState(null); // null | 'runway' | 'song' | 'quiz'

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const timeNow = new Date(now).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

  // ===== 遊戲模式（全螢幕） =====
  if (gameMode === 'runway') {
    return <RunwayGame contestants={contestants} contestantVotes={contestantVotes} votingOpen={votingOpen} showVoteResults={showVoteResults} setVotingOpen={setVotingOpen} setShowVoteResults={setShowVoteResults} onExit={() => setGameMode(null)} />;
  }
  if (gameMode === 'song') {
    return <SongGame songs={songs} setSongs={setSongs} onExit={() => setGameMode(null)} />;
  }
  if (gameMode === 'quiz') {
    return <QuizGame quizQuestions={quizQuestions} setQuizQuestions={setQuizQuestions} onExit={() => setGameMode(null)} />;
  }

  const games = [
    { id: 'lottery', emoji: '🎁', label: '幸運大抽獎', desc: '從報名名單抽出幸運得主', grad: 'linear-gradient(135deg, #F5B800, #DC2626)' },
    { id: 'runway', emoji: '🗳️', label: '走秀即時票數', desc: '參賽者得票即時顯示', grad: 'linear-gradient(135deg, #EC4899, #BE185D)' },
    { id: 'song', emoji: '🎵', label: '百萬大歌星', desc: '聽前奏猜歌名', grad: 'linear-gradient(135deg, #8B5CF6, #6D28D9)' },
    { id: 'quiz', emoji: '❓', label: '趣味競答', desc: '掃 QR 一起搶分答題', grad: 'linear-gradient(135deg, #10B981, #059669)' },
  ];

  return (
    <div className="min-h-screen flex flex-col live-big" style={{ background: 'linear-gradient(135deg, #0F0F0F 0%, #1F1509 100%)', fontFamily: '"Noto Sans TC", sans-serif' }}>
      <header className="flex items-center justify-between px-4 md:px-6 py-3 border-b" style={{ borderColor: '#F5B800' }}>
        <div className="flex items-center gap-2">
          <div className="w-10 h-10 rounded-lg flex items-center justify-center animate-pulse" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            <Radio className="w-5 h-5 text-white" />
          </div>
          <div>
            <div className="text-[10px]" style={{ color: '#F5B800' }}>現場模式</div>
            <div className="text-white font-bold text-base">{settings?.eventTheme || settings?.eventName || '活動'}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="text-right">
            <div className="text-[10px] leading-none" style={{ color: '#94A3B8' }}>🕒 現在時間</div>
            <div className="text-xl md:text-2xl font-mono font-bold tabular-nums leading-tight" style={{ color: '#F5B800' }}>{timeNow}</div>
          </div>
          <FullscreenButton />

// ============== 可嵌入搶答面板（猜歌/競答現場共用） ==============
function InlineBuzzer({ fill = false, topic = '' }) {
  const [buzzer, setBuzzer] = useState({ open: false, locked: false, buzzes: [], roundId: 0 });

  useEffect(() => {
    const load = async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) {
          const fresh = JSON.parse(r.value);
          if (fresh.buzzer) {
            setBuzzer(prev => {
              const a = JSON.stringify(prev), b = JSON.stringify(fresh.buzzer);
              if (a !== b) {
                const oldN = (prev.buzzes || []).length;
                const newN = (fresh.buzzer.buzzes || []).length;
                if (newN > oldN) _sfx.buzz();
                return fresh.buzzer;
              }
              return prev;
            });
          }
        }
      } catch (e) {}
    };
    load();
    const t = setInterval(load, 1000);
    return () => clearInterval(t);
  }, []);

  const writeBuzzer = async (next) => {
    setBuzzer(next);
    try {
      const r = await window.storage.get('fule_yellow_party_v7', true);
      const fresh = r?.value ? JSON.parse(r.value) : {};
      fresh.buzzer = next;
      await window.storage.set('fule_yellow_party_v7', JSON.stringify(fresh), true);
    } catch (e) {}
  };

  const openRound = () => { _sfx.go(); writeBuzzer({ open: true, locked: false, buzzes: [], roundId: Date.now(), passed: [], correct: null, question: topic || '' }); };
  const lockRound = () => writeBuzzer({ ...buzzer, open: false, locked: true });

  const buzzes = buzzer.buzzes || [];
  const passed = buzzer.passed || [];      // 已答錯的名字
  const correct = buzzer.correct || null;  // 答對者名字

  // 目前該答題的人 = 第一個還沒答錯、也還沒判定答對的人
  const activeIdx = buzzes.findIndex(b => !passed.includes(b.name));
  const activeBuzz = activeIdx >= 0 ? buzzes[activeIdx] : null;

  // 答對：鎖定 + 慶祝
  const markCorrect = () => {
    if (!activeBuzz) return;
    _sfx.fanfare();
    writeBuzzer({ ...buzzer, correct: activeBuzz.name, open: false, locked: true });
  };
  // 答錯：換下一位
  const markWrong = () => {
    if (!activeBuzz) return;
    _sfx.buzz();
    writeBuzzer({ ...buzzer, passed: [...passed, activeBuzz.name] });
  };

  return (
    <div className={fill ? "w-full h-full flex flex-col rounded-2xl p-4 overflow-hidden" : "w-full max-w-3xl mx-auto rounded-2xl p-4 mt-4"} style={{ background: 'rgba(0,0,0,0.35)', border: '2px solid rgba(245,184,0,0.4)', backdropFilter: 'blur(4px)' }}>
      <div className="flex items-center justify-between mb-3 gap-2 shrink-0">
        <div className="text-white font-bold text-lg flex items-center gap-2">
          🔔 搶答
          {buzzer.open && !buzzer.locked && <span className="text-xs px-2 py-0.5 rounded-full animate-pulse" style={{ background: '#10B981', color: 'white' }}>開放中</span>}
          {buzzer.locked && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: '#DC2626', color: 'white' }}>已鎖定</span>}
        </div>
        <div className="flex gap-2">
          {(!buzzer.open || buzzer.locked) ? (
            <button onClick={openRound} className="px-4 py-2 rounded-lg text-white font-bold text-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              🎯 開放搶答
            </button>
          ) : (
            <button onClick={lockRound} className="px-4 py-2 rounded-lg text-white font-bold text-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #DC2626, #991B1B)' }}>
              🔒 鎖定
            </button>
          )}
          {(buzzer.open || buzzes.length > 0) && (
            <button onClick={openRound} className="px-4 py-2 rounded-lg text-white font-bold text-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              🔄 重開
            </button>
          )}
        </div>
      </div>

      {buzzes.length === 0 ? (
        <div className={fill ? "flex-1 flex items-center justify-center text-base" : "text-center py-3 text-sm"} style={{ color: 'rgba(255,255,255,0.5)' }}>
          {buzzer.open ? '等待搶答中…' : '尚未開放搶答'}
        </div>
      ) : (
        <div className={fill ? "flex-1 flex flex-col justify-center space-y-2 overflow-y-auto" : "space-y-2"}>
          {/* 已答對 */}
          {correct && (
            <div className="px-4 py-3 rounded-xl text-center" style={{ background: 'linear-gradient(135deg, #10B981, #059669)', animation: 'flashPop 0.5s ease' }}>
              <div className="text-white font-bold text-2xl">🎉 {correct} 答對了！</div>
            </div>
          )}
          {buzzes.map((b, i) => {
            const diff = b.ts - buzzes[0].ts;
            const isPassed = passed.includes(b.name);
            const isActive = !correct && activeBuzz && b.name === activeBuzz.name;
            const isWinner = correct === b.name;
            return (
              <div key={i} className="flex items-center justify-between px-4 py-2.5 rounded-xl" style={{
                background: isWinner ? 'linear-gradient(135deg, #10B981, #059669)' : isActive ? 'linear-gradient(135deg, #F5B800, #FF9F1C)' : 'rgba(255,255,255,0.1)',
                opacity: isPassed ? 0.4 : 1,
                animation: isActive ? 'flashPop 0.4s ease' : 'none',
              }}>
                <div className="flex items-center gap-3 min-w-0">
                  <div className="text-2xl shrink-0">{isWinner ? '✅' : isPassed ? '❌' : (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`)}</div>
                  <div className="font-bold text-xl text-white truncate" style={{ textDecoration: isPassed ? 'line-through' : 'none' }}>{b.name}</div>
                </div>
                <div className="text-xs shrink-0" style={{ color: 'rgba(255,255,255,0.7)' }}>
                  {i === 0 ? '最快' : `+${diff}ms`}
                </div>
              </div>
            );
          })}

          {/* 答對 / 答錯換人 控制 */}
          {!correct && activeBuzz && (
            <div className="flex gap-2 pt-1">
              <button onClick={markCorrect} className="flex-1 py-3 rounded-xl text-white font-bold active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ {activeBuzz.name} 答對
              </button>
              <button onClick={markWrong} className="flex-1 py-3 rounded-xl text-white font-bold active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #DC2626, #991B1B)' }}>
                ✗ 答錯，換下一位
              </button>
            </div>
          )}
          {!correct && !activeBuzz && buzzes.length > 0 && (
            <div className="text-center py-2 text-sm" style={{ color: 'rgba(255,255,255,0.6)' }}>
              都答錯了，可按「🔄 重開」讓大家再搶
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ============== 百萬大歌星遊戲 ==============
function SongGame({ songs, setSongs, onExit, embed = false }) {
  const [selectedId, setSelectedId] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [playMode, setPlayMode] = useState('hint'); // hint | audio | list
  const audioRef = useRef(null);
  const ytIframeRef = useRef(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const [ytPlaying, setYtPlaying] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [countdown, setCountdown] = useState(null);

  const current = songs.find(s => s.id === selectedId);
  const unplayed = songs.filter(s => !s.played && s.liveShow !== false);

  const selectSong = (s) => {
    _sfx.click();
    setSelectedId(s.id);
    setRevealed(false);
    setIsPlaying(false);
    setYtPlaying(false);
  };

  // YouTube iframe API 控制（透過 postMessage）
  const sendYtCommand = (command) => {
    if (!ytIframeRef.current || !ytIframeRef.current.contentWindow) return;
    ytIframeRef.current.contentWindow.postMessage(
      JSON.stringify({ event: 'command', func: command, args: [] }),
      '*'
    );
  };
  const playYoutube = () => { _sfx.click(); sendYtCommand('playVideo'); setYtPlaying(true); };
  const pauseYoutube = () => { sendYtCommand('pauseVideo'); setYtPlaying(false); };

  const doReveal = () => {
    _sfx.reveal();
    setRevealed(true);
    setShowConfetti(true);
    setTimeout(() => _sfx.fanfare(), 400);
    setTimeout(() => setShowConfetti(false), 3000);
  };

  // 3-2-1 倒數後揭曉
  const reveal = () => {
    let n = 3;
    setCountdown(3);
    _sfx.tick();
    const iv = setInterval(() => {
      n -= 1;
      if (n > 0) {
        setCountdown(n);
        _sfx.tick();
      } else {
        clearInterval(iv);
        setCountdown(null);
        doReveal();
      }
    }, 800);
  };

  const markPlayed = () => {
    if (!current) return;
    setSongs(songs.map(s => s.id === current.id ? { ...s, played: true } : s));
    setSelectedId(null);
    setRevealed(false);
  };

  const playAudio = () => {
    if (audioRef.current) {
      audioRef.current.currentTime = current.startAt || 0;
      audioRef.current.play().catch(err => {
        alert('音檔播放失敗：' + err.message + '\n\n請確認網址是直接的音檔連結（.mp3/.wav），或改用 YouTube 連結。');
        setIsPlaying(false);
      });
      setIsPlaying(true);
    }
  };

  const stopAudio = () => {
    if (audioRef.current) {
      audioRef.current.pause();
      setIsPlaying(false);
    }
  };

  // #5 判斷音樂連結類型
  const getMusicType = (url) => {
    if (!url) return null;
    if (/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
    if (/\.(mp3|wav|ogg|m4a|aac)(\?|$)/i.test(url)) return 'audio';
    return 'link'; // 其他連結就顯示為超連結
  };

  // 轉 YouTube URL 為 embed 格式（手動觸發播放，支援 JS API 控制）
  const getYoutubeEmbed = (url) => {
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    if (!match) return null;
    const videoId = match[1];
    const startAt = current.startAt || 0;
    // enablejsapi=1 讓 postMessage 控制生效
    // 不自動播放（iOS 需使用者手動觸發）
    return `https://www.youtube.com/embed/${videoId}?enablejsapi=1&start=${startAt}&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&playsinline=1`;
  };

  // 選擇清單畫面
  if (!selectedId) {
    return (
      <div className="min-h-screen live-big" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)' }}>
        <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #8B5CF6, #EC4899)' }}>
              <Music2 className="w-5 h-5 text-white" />
            </div>
            <div>
              <div className="text-[10px] text-purple-200">百萬大歌星</div>
              <div className="text-white font-bold">隨機出題</div>
            </div>
          </div>
          <button onClick={onExit} className="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場主畫面
          </button>
        </header>

        <div className="max-w-3xl mx-auto p-4 md:p-6 flex flex-col items-center justify-center text-center text-white" style={{ minHeight: '60vh' }}>
          <div className="text-6xl mb-4">🎤</div>
          <div className="text-2xl md:text-3xl font-bold mb-2">百萬大歌星</div>
          <div className="text-base md:text-lg opacity-80 mb-6">剩餘 {unplayed.length} / {songs.filter(s => s.liveShow !== false).length} 首未出</div>

          {unplayed.length > 0 ? (
            <button onClick={() => { const pick = unplayed[Math.floor(Math.random() * unplayed.length)]; _sfx.go(); selectSong(pick); }}
              className="px-12 py-6 rounded-3xl text-3xl md:text-4xl font-black text-white shadow-2xl active:scale-95 transition"
              style={{ background: 'linear-gradient(135deg, #8B5CF6, #EC4899)', animation: 'pulse 1.4s ease-in-out infinite' }}>
              🎲 隨機出下一首
            </button>
          ) : (
            <div className="text-xl opacity-80">🎉 所有歌曲都出過了！</div>
          )}

          <div className="text-sm opacity-50 mt-6">每次隨機抽一首未出過的歌，觀眾不會預先看到題目</div>

          {songs.some(s => s.played) && (
            <button onClick={() => { if (confirm('重置所有歌曲為「未出過」？')) setSongs(songs.map(s => ({ ...s, played: false }))); }}
              className="mt-4 px-4 py-2 rounded-lg text-sm hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
              🔄 重置出題紀錄
            </button>
          )}
        </div>
        <style>{`@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}`}</style>
      </div>
    );
  }

  // 題目進行畫面
  return (
    <div className="min-h-screen flex flex-col live-mid" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)' }}>
      <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
        <button onClick={() => { stopAudio(); setSelectedId(null); setRevealed(false); }} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
          🎲 再抽一首
        </button>
        <div className="text-white font-bold text-lg">百萬大歌星</div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場
          </button>
        </div>
      </header>

      <main className="flex-1 overflow-hidden p-3 md:p-4 text-white" style={{ minHeight: 0 }}>
        {!revealed ? (
          <div className="h-full flex flex-col">
            {/* 題目區（滿版，無搶答） */}
            <div className="flex-1 flex flex-col items-center justify-center text-center min-h-0 overflow-hidden gap-3">
              <div key={`q-${current.id}`} className="text-lg md:text-xl opacity-70 font-bold shrink-0" style={{ animation: 'bigZoom 0.5s ease' }}>第 {songs.findIndex(s => s.id === current.id) + 1} 題</div>

              {/* 提示詞區（如果有） */}
              {current.hint && (
                <div key={`h-${current.id}`} className="rounded-2xl p-3 md:p-5 max-w-3xl w-full shrink-0" style={{ background: 'rgba(245, 184, 0, 0.2)', border: '3px solid #F5B800', animation: 'slideUpBounce 0.6s ease' }}>
                  <div className="text-sm md:text-base font-bold mb-1" style={{ color: '#F5B800' }}>💡 提示</div>
                  <div className="text-3xl md:text-5xl font-bold leading-tight">{current.hint}</div>
                  {current.lyrics && (
                    <div className="mt-3 text-base md:text-lg opacity-80 pt-2 border-t font-medium" style={{ borderColor: 'rgba(245, 184, 0, 0.3)' }}>
                      歌詞開頭：「{current.lyrics}」
                    </div>
                  )}
                </div>
              )}

              {/* 音檔播放區 */}
              {current.audioUrl ? (
                (() => {
                  const musicType = getMusicType(current.audioUrl);
                  if (musicType === 'youtube') {
                    const embedUrl = getYoutubeEmbed(current.audioUrl);
                    return embedUrl ? (
                      <div className="w-full max-w-2xl flex flex-col items-center gap-2 min-h-0">
                        <button
                          onClick={ytPlaying ? pauseYoutube : playYoutube}
                          className="rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition"
                          style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', width: 'min(28vw, 18vh, 180px)', height: 'min(28vw, 18vh, 180px)', animation: ytPlaying ? 'glowPulse 1.2s ease-in-out infinite' : 'none' }}>
                          {ytPlaying
                            ? <Pause style={{ width: '45%', height: '45%' }} className="text-white" />
                            : <Play style={{ width: '45%', height: '45%' }} className="text-white ml-2" />
                          }
                        </button>
                        {ytPlaying && (
                          <div className="flex items-end gap-1.5 h-8">
                            {[0,1,2,3,4,5,6].map(i => (
                              <div key={i} style={{ width: 5, height: '100%', background: 'linear-gradient(to top, #F5B800, #FF9F1C)', borderRadius: 3, transformOrigin: 'bottom', animation: `soundBar ${0.4 + (i % 3) * 0.2}s ease-in-out ${i * 0.1}s infinite` }} />
                            ))}
                          </div>
                        )}
                        <div className="text-base md:text-lg font-bold opacity-90">
                          {ytPlaying ? '🎵 前奏播放中...' : `點按播放（從 ${current.startAt || 0} 秒開始）`}
                        </div>
                        <iframe ref={ytIframeRef} src={embedUrl} style={{ position: 'fixed', left: '-9999px', top: '-9999px', width: '1px', height: '1px', border: 0, opacity: 0 }} allow="autoplay; encrypted-media" title="music player" />
                      </div>
                    ) : (
                      <div className="text-red-400">無法解析 YouTube 網址</div>
                    );
                  } else if (musicType === 'audio') {
                    return (
                      <div className="flex flex-col items-center gap-2">
                        <audio ref={audioRef} src={current.audioUrl} onEnded={() => setIsPlaying(false)} />
                        <button onClick={isPlaying ? stopAudio : playAudio} className="rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition"
                          style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', width: 'min(24vw, 16vh, 130px)', height: 'min(24vw, 16vh, 130px)' }}>
                          {isPlaying ? <Pause className="w-14 h-14 text-white" /> : <Play className="w-14 h-14 text-white ml-2" />}
                        </button>
                        <div className="text-sm opacity-70">
                          {isPlaying ? '🎵 播放中' : `點按播放（從 ${current.startAt || 0} 秒開始）`}
                        </div>
                      </div>
                    );
                  } else {
                    return (
                      <div className="flex flex-col items-center gap-2">
                        <a href={current.audioUrl} target="_blank" rel="noopener noreferrer"
                          className="px-6 py-4 rounded-xl text-white font-bold shadow-2xl active:scale-95 transition"
                          style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
                          🔗 點此開啟音樂連結
                        </a>
                        <div className="text-xs opacity-70 max-w-md break-all">{current.audioUrl}</div>
                      </div>
                    );
                  }
                })()
              ) : (
                !current.hint && (
                  <div className="rounded-2xl p-6 max-w-2xl" style={{ background: 'rgba(239, 68, 68, 0.2)', border: '2px solid #EF4444' }}>
                    <div className="text-lg mb-2">⚠ 此題尚未設定音檔或提示</div>
                    <div className="text-sm opacity-70">請回到「現場活動 → 百萬大歌星」填入資料</div>
                  </div>
                )
              )}

              <button onClick={reveal} className="px-8 md:px-14 py-3 md:py-4 rounded-2xl text-xl md:text-2xl font-bold text-white shadow-2xl active:scale-95 transition shrink-0"
                style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 揭曉答案
              </button>
            </div>
          </div>
        ) : (
          // 揭曉答案
          <div className="h-full flex flex-col items-center justify-center text-center overflow-y-auto">
          <div className="max-w-4xl w-full">
            <div className="text-xl md:text-2xl opacity-70 mb-3 font-bold" style={{ animation: 'slideUpBounce 0.5s ease' }}>答案揭曉</div>
            <div className="text-7xl md:text-9xl mb-8" style={{ animation: 'bigZoom 0.6s ease' }}>🎉</div>
            <div className="rounded-3xl p-10 md:p-14 shadow-2xl mb-8" style={{ background: 'linear-gradient(135deg, rgba(245, 184, 0, 0.3), rgba(236, 72, 153, 0.2))', border: '4px solid #F5B800', animation: 'bigZoom 0.6s ease 0.1s both, glowPulse 2s ease-in-out 0.7s infinite' }}>
              <div className="text-lg md:text-xl font-bold mb-3" style={{ color: '#F5B800' }}>🎵 歌曲名稱</div>
              <div className="text-6xl md:text-8xl font-bold mb-4 leading-tight">{current.title}</div>
              {current.artist && <div className="text-3xl md:text-4xl opacity-80">— {current.artist}</div>}
            </div>
            <div className="flex gap-3" style={{ animation: 'slideUpBounce 0.5s ease 0.3s both' }}>
              <button onClick={() => setRevealed(false)} className="flex-1 py-4 md:py-5 rounded-xl text-white hover:bg-white/10 font-bold text-xl md:text-2xl" style={{ border: '2px solid rgba(255,255,255,0.3)' }}>
                重看題目
              </button>
              <button onClick={markPlayed} className="flex-1 py-4 md:py-5 rounded-xl text-white font-bold text-xl md:text-2xl shadow-lg active:scale-95" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 下一題
              </button>
            </div>
          </div>
          </div>
        )}
      </main>
      <Confetti show={showConfetti} />
      {countdown !== null && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 70, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.8)' }}>
          <div key={countdown} style={{ fontSize: 'clamp(8rem, 40vw, 22rem)', fontWeight: 900, color: '#F5B800', textShadow: '0 0 60px rgba(245,184,0,0.8)', animation: 'countPulse 0.8s ease' }}>
            {countdown}
          </div>
        </div>
      )}
    </div>
  );
}

// ============== 趣味競答遊戲 ==============
function QuizGame({ quizQuestions, setQuizQuestions, onExit }) {
  const [selectedId, setSelectedId] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [countdown, setCountdown] = useState(null);
  const [filterCat, setFilterCat] = useState('all');
  const [shuffledOpts, setShuffledOpts] = useState([]); // [{text, correct}]
  const [wrongOpts, setWrongOpts] = useState([]);        // 已猜錯的選項文字
  const [gotCorrect, setGotCorrect] = useState(false);   // 已猜對
  const [showConfetti, setShowConfetti] = useState(false);

  const current = quizQuestions.find(q => q.id === selectedId);
  const unused = quizQuestions.filter(q => !q.used);

  const categories = useMemo(() => ['all', ...new Set(quizQuestions.map(q => q.category))], [quizQuestions]);

  const filtered = useMemo(() => {
    if (filterCat === 'all') return quizQuestions;
    return quizQuestions.filter(q => q.category === filterCat);
  }, [quizQuestions, filterCat]);

  const categoryColors = {
    '黃色主題': '#F5B800',
    '富樂知識': '#3B82F6',
    '一般常識': '#10B981',
  };

  const selectQ = (q) => {
    setSelectedId(q.id);
    setRevealed(false);
    setWrongOpts([]);
    setGotCorrect(false);
    // 洗牌選項：原本 options[0] 是正確答案
    const opts = (q.options || []).map((text, i) => ({ text, correct: i === 0 }));
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    setShuffledOpts(opts);
  };

  // 推進搶答佇列：把目前作答者標記答錯、換下一位（直接寫 storage，InlineBuzzer 會同步）
  const advanceBuzzer = async () => {
    try {
      const r = await window.storage.get('fule_yellow_party_v7', true);
      const cur = r?.value ? JSON.parse(r.value) : {};
      const bz = cur.buzzer || { open: false, locked: false, buzzes: [], roundId: 0, passed: [] };
      const passed = bz.passed || [];
      const active = (bz.buzzes || []).find(b => !passed.includes(b.name));
      if (active) {
        bz.passed = [...passed, active.name];
        cur.buzzer = bz;
        await window.storage.set('fule_yellow_party_v7', JSON.stringify(cur), true);
      }
    } catch (e) {}
  };

  // 點選一個選項
  const pickOption = (opt) => {
    if (gotCorrect || wrongOpts.includes(opt.text)) return;
    if (opt.correct) {
      setGotCorrect(true);
      _sfx.success();
      setShowConfetti(true);
      setTimeout(() => _sfx.fanfare(), 300);
      setTimeout(() => setShowConfetti(false), 3000);
      // 標記搶答佇列為答對
      (async () => {
        try {
          const r = await window.storage.get('fule_yellow_party_v7', true);
          const cur = r?.value ? JSON.parse(r.value) : {};
          const bz = cur.buzzer || { open: false, locked: false, buzzes: [], roundId: 0, passed: [] };
          const active = (bz.buzzes || []).find(b => !(bz.passed || []).includes(b.name));
          if (active) { bz.correct = active.name; bz.open = false; bz.locked = true; cur.buzzer = bz; await window.storage.set('fule_yellow_party_v7', JSON.stringify(cur), true); }
        } catch (e) {}
      })();
    } else {
      _sfx.buzz();
      setWrongOpts(prev => [...prev, opt.text]);
      advanceBuzzer(); // 換下一位搶答者
    }
  };

  // 3-2-1 倒數後揭曉
  const quizReveal = () => {
    let n = 3;
    setCountdown(3);
    _sfx.tick();
    const iv = setInterval(() => {
      n -= 1;
      if (n > 0) {
        setCountdown(n);
        _sfx.tick();
      } else {
        clearInterval(iv);
        setCountdown(null);
        _sfx.reveal();
        setRevealed(true);
      }
    }, 800);
  };

  const markUsed = () => {
    if (!current) return;
    setQuizQuestions(quizQuestions.map(q => q.id === current.id ? { ...q, used: true } : q));
    setSelectedId(null);
    setRevealed(false);
  };

  // #6 隨機跳題：根據當前類別從未使用題目中隨機抽一題
  const randomPick = () => {
    const pool = quizQuestions.filter(q => !q.used && (filterCat === 'all' || q.category === filterCat));
    if (pool.length === 0) {
      alert(filterCat === 'all' ? '沒有剩餘題目了' : `「${filterCat}」類沒有剩餘題目`);
      return;
    }
    const random = pool[Math.floor(Math.random() * pool.length)];
    selectQ(random);
  };

  // 選擇畫面
  if (!selectedId) {
    return (
      <div className="min-h-screen live-big" style={{ background: 'linear-gradient(135deg, #064E3B 0%, #065F46 100%)' }}>
        <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              <HelpCircle className="w-5 h-5 text-white" />
            </div>
            <div>
              <div className="text-[10px] text-green-200">趣味競答</div>
              <div className="text-white font-bold">選擇題目</div>
            </div>
          </div>
          <button onClick={onExit} className="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場主畫面
          </button>
        </header>

        <div className="max-w-4xl mx-auto p-4 md:p-6">
          <div className="text-center text-white mb-4 flex items-center justify-center gap-3">
            <div className="text-sm opacity-80">剩餘 {unused.length} / {quizQuestions.length} 題可選</div>
            {unused.length < quizQuestions.length && (
              <button onClick={() => {
                if (confirm('重新開始？所有題目會變回可選狀態')) {
                  setQuizQuestions(quizQuestions.map(q => ({ ...q, used: false })));
                }
              }} className="text-xs px-2 py-1 rounded" style={{ background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.3)', color: 'white' }}>
                🔄 重新開始
              </button>
            )}
          </div>

          {/* 類別過濾 + 隨機跳題 */}
          <div className="flex gap-1.5 mb-2 overflow-x-auto">
            {categories.map(cat => {
              const count = cat === 'all' ? quizQuestions.length : quizQuestions.filter(q => q.category === cat).length;
              return (
                <button key={cat} onClick={() => setFilterCat(cat)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition"
                  style={{ background: filterCat === cat ? '#F5B800' : 'rgba(255,255,255,0.1)', color: filterCat === cat ? '#1F2937' : 'white' }}>
                  {cat === 'all' ? '全部' : cat} ({count})
                </button>
              );
            })}
          </div>

          {/* #6 大類隨機跳題 */}
          <button onClick={randomPick}
            className="w-full py-3 mb-4 rounded-xl text-white font-bold shadow-2xl active:scale-95 transition flex items-center justify-center gap-2"
            style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            🎲 從「{filterCat === 'all' ? '全部類別' : filterCat}」隨機抽一題
          </button>

          {/* 題目格（與百萬大歌星一致的數字格） */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            {filtered.map((q) => {
              const color = categoryColors[q.category] || '#10B981';
              const num = quizQuestions.findIndex(x => x.id === q.id) + 1;
              return (
                <button key={q.id} onClick={() => !q.used && selectQ(q)} disabled={q.used} className="rounded-xl p-4 text-center transition active:scale-95"
                  style={{ background: q.used ? 'rgba(107, 114, 128, 0.3)' : 'linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.2))', border: `2px solid ${q.used ? 'rgba(107, 114, 128, 0.4)' : '#F5B800'}`, opacity: q.used ? 0.5 : 1, cursor: q.used ? 'not-allowed' : 'pointer' }}>
                  <div className="text-2xl md:text-3xl font-bold mb-1" style={{ color: '#F5B800' }}>#{num}</div>
                  <div className="text-[10px] mb-0.5 px-1.5 py-0.5 rounded-full inline-block font-bold text-white" style={{ background: color }}>{q.category}</div>
                  {q.used ? <div className="text-[10px] text-gray-300 mt-0.5">已用過</div> : <div className="text-[10px] text-green-200 mt-0.5">未開始</div>}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // 題目進行畫面
  const catColor = categoryColors[current.category] || '#9CA3AF';
  return (
    <div className="min-h-screen flex flex-col live-mid" style={{ background: 'linear-gradient(135deg, #064E3B 0%, #065F46 100%)' }}>
      <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
        <button onClick={() => { setSelectedId(null); setRevealed(false); }} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
          📋 題目列表
        </button>
        <div className="text-white font-bold text-lg">趣味競答</div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場
          </button>
        </div>
      </header>

      <main className="flex-1 overflow-hidden p-3 md:p-4 text-white" style={{ minHeight: 0 }}>
        {!revealed ? (
          <div className="h-full flex flex-col md:flex-row gap-3 md:gap-4">
            {/* 左：題目區 */}
            <div className="flex-1 flex flex-col items-center justify-center text-center min-h-0 overflow-hidden gap-3 w-full">
              <div className="flex items-center justify-center gap-3 shrink-0">
                <div className="px-4 py-1.5 rounded-full text-sm md:text-base font-bold text-white" style={{ background: catColor }}>{current.category}</div>
                <div className="px-4 py-1.5 rounded-full text-sm md:text-base" style={{ background: 'rgba(255,255,255,0.15)', color: 'white' }}>
                  {current.difficulty === 'easy' ? '🟢 簡單' : current.difficulty === 'medium' ? '🟡 中等' : '🔴 困難'}
                </div>
              </div>
              <div className="text-lg md:text-xl opacity-70 font-bold shrink-0">第 {quizQuestions.findIndex(q => q.id === current.id) + 1} 題</div>
              <div key={`qe-${current.id}`} className="text-3xl md:text-4xl shrink-0" style={{ animation: 'bigZoom 0.5s ease' }}>❓</div>
              <div key={`qq-${current.id}`} className="rounded-2xl p-4 md:p-6 shadow-2xl max-w-3xl w-full shrink-0" style={{ background: 'rgba(255,255,255,0.1)', border: '3px solid rgba(255,255,255,0.2)', animation: 'slideUpBounce 0.6s ease' }}>
                <div className="text-3xl md:text-4xl font-bold leading-snug">{current.question}</div>
              </div>

              {shuffledOpts.length > 0 && (
                <div className="w-full max-w-3xl shrink-0">
                  <div className="text-sm mb-2" style={{ color: gotCorrect ? '#86EFAC' : '#FCD34D' }}>
                    {gotCorrect ? '✅ 答對了！' : `點選答案 · 還有 ${shuffledOpts.length - wrongOpts.length} 個選項可猜`}
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {shuffledOpts.map((opt, i) => {
                      const isWrong = wrongOpts.includes(opt.text);
                      const isRight = gotCorrect && opt.correct;
                      return (
                        <button key={i} onClick={() => pickOption(opt)} disabled={gotCorrect || isWrong}
                          className="rounded-xl p-3 md:p-4 text-lg md:text-xl text-left transition active:scale-95 flex items-center gap-3"
                          style={{
                            background: isRight ? 'linear-gradient(135deg, #10B981, #059669)' : isWrong ? 'rgba(220,38,38,0.25)' : 'rgba(255,255,255,0.1)',
                            border: `2px solid ${isRight ? '#10B981' : isWrong ? '#DC2626' : 'rgba(255,255,255,0.25)'}`,
                            opacity: isWrong ? 0.5 : 1,
                            cursor: gotCorrect || isWrong ? 'not-allowed' : 'pointer',
                            textDecoration: isWrong ? 'line-through' : 'none',
                          }}>
                          <span className="font-bold shrink-0" style={{ color: isRight ? 'white' : '#F5B800' }}>{String.fromCharCode(65 + i)}.</span>
                          <span className="flex-1">{opt.text}</span>
                          {isRight && <span className="text-2xl">✅</span>}
                          {isWrong && <span className="text-xl">❌</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              <button onClick={quizReveal} className="px-8 md:px-14 py-3 md:py-4 rounded-2xl text-xl md:text-2xl font-bold text-white shadow-2xl active:scale-95 transition shrink-0"
                style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 直接揭曉答案
              </button>
            </div>

            {/* 右：搶答面板 */}
            <div className="md:w-[380px] shrink-0 min-h-0 flex flex-col" style={{ maxHeight: '100%' }}>
              <InlineBuzzer fill topic={current.question + (shuffledOpts.length ? ("\n" + shuffledOpts.map((o,i)=>String.fromCharCode(65+i)+". "+o.text).join("　")) : "")} />
            </div>
          </div>
        ) : (
          <div className="h-full flex flex-col items-center justify-center text-center overflow-y-auto">
          <div className="max-w-4xl w-full">
            <div className="text-xl md:text-2xl opacity-70 mb-3 font-bold">答案揭曉</div>
            <div className="text-7xl md:text-9xl mb-8">🎉</div>
            <div className="rounded-3xl p-10 md:p-14 shadow-2xl mb-8" style={{ background: 'linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.2))', border: '4px solid #10B981' }}>
              <div className="text-lg md:text-xl font-bold mb-3" style={{ color: '#86EFAC' }}>✓ 正確答案</div>
              <div className="text-6xl md:text-8xl font-bold leading-tight">{current.answer}</div>
            </div>

            <div className="flex gap-3">
              <button onClick={() => setRevealed(false)} className="flex-1 py-4 md:py-5 rounded-xl text-white hover:bg-white/10 font-bold text-xl md:text-2xl" style={{ border: '2px solid rgba(255,255,255,0.3)' }}>
                重看題目
              </button>
              <button onClick={markUsed} className="flex-1 py-4 md:py-5 rounded-xl text-white font-bold text-xl md:text-2xl shadow-lg active:scale-95" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 下一題
              </button>
            </div>
          </div>
          </div>
        )}
      </main>
      {countdown !== null && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 70, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.8)' }}>
          <div key={countdown} style={{ fontSize: 'clamp(8rem, 40vw, 22rem)', fontWeight: 900, color: '#10B981', textShadow: '0 0 60px rgba(16,185,129,0.8)', animation: 'countPulse 0.8s ease' }}>
            {countdown}
          </div>
        </div>
      )}
      <Confetti show={showConfetti} count={100} />
    </div>
  );
}


  // ========================================
  // 掛載到 DOM
  // ========================================
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));

  // 移除 loading 畫面
  setTimeout(() => {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  }, 100);
</script>

</body>
</html>

const ADMIN_PASSWORD = '888';      // 檢視（唯讀）
const ADMIN_EDIT_PASSWORD = '666'; // 可修改
function AdminGate({ children }) {
  const [role, setRole] = useState(() => {
    try { return sessionStorage.getItem('fule_admin_role') || ''; } catch (e) { return ''; }
  });
  const [input, setInput] = useState('');
  const [error, setError] = useState(false);

  const grant = (r) => { try { sessionStorage.setItem('fule_admin_role', r); } catch (e) {} setRole(r); };
  const submit = () => {
    if (input === ADMIN_EDIT_PASSWORD) { grant('edit'); setError(false); }
    else if (input === ADMIN_PASSWORD) { grant('view'); setError(false); }
    else { setError(true); setInput(''); }
  };
  // 由檢視升級為修改
  const requestEdit = () => {
    const p = window.prompt('請輸入「修改權限」密碼');
    if (p == null) return;
    if (p === ADMIN_EDIT_PASSWORD) grant('edit');
    else alert('密碼錯誤');
  };

  if (role === 'view' || role === 'edit') return React.cloneElement(children, { role, requestEdit });

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ background: 'linear-gradient(135deg, #1F2937 0%, #111827 100%)' }}>
      <div className="w-full max-w-xs rounded-2xl p-6 shadow-2xl" style={{ background: 'white' }}>
        <div className="text-center mb-5">
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            <Lock className="w-7 h-7 text-white" />
          </div>
          <div className="font-bold text-lg" style={{ color: '#1F2937' }}>工作人員後台</div>
          <div className="text-xs text-gray-500 mt-1">請輸入密碼</div>
        </div>
        <input
          type="password"
          inputMode="numeric"
          value={input}
          autoFocus
          onChange={e => { setInput(e.target.value); setError(false); }}
          onKeyDown={e => { if (e.key === 'Enter') submit(); }}
          placeholder="密碼"
          className="w-full px-4 py-3 rounded-xl border text-center text-lg outline-none focus:border-yellow-400"
          style={{ borderColor: error ? '#DC2626' : '#FCD34D' }}
        />
        {error && <div className="text-xs text-center mt-2" style={{ color: '#DC2626' }}>密碼錯誤，請再試一次</div>}
        <button onClick={submit} className="w-full mt-3 py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
          進入後台
        </button>
        <div className="text-[11px] text-center text-gray-400 mt-3">檢視用與修改用密碼不同，請輸入您被授權的密碼</div>
        <button onClick={() => { window.location.hash = ''; }} className="w-full mt-2 py-2 rounded-xl text-sm hover:bg-gray-50" style={{ color: '#6B7280' }}>
          ← 回首頁
        </button>
      </div>
    </div>
  );
}

function AdminApp({ onLogout, role, requestEdit }) {
  const readOnly = role !== 'edit';
  const readOnlyRef = useRef(readOnly); readOnlyRef.current = readOnly;
  const _noop = () => {};
  const lock = (fn) => (readOnly ? _noop : fn); // 檢視模式：所有編輯 setter 變成無效
  const [tab, setTabState] = useState(() => {
    try { return sessionStorage.getItem('fule_admin_tab') || 'overview'; } catch (e) { return 'overview'; }
  });
  const setTab = (t) => {
    try { sessionStorage.setItem('fule_admin_tab', t); } catch (e) {}
    setTabState(t);
  };
  const [flow, setFlow] = useState(DEFAULT_FLOW);
  const [budget, setBudget] = useState(DEFAULT_BUDGET);
  const [awards, setAwards] = useState(DEFAULT_AWARDS);
  const [staff, setStaff] = useState(DEFAULT_STAFF);
  const [registrations, setRegistrations] = useState([]);
  // 現場活動新增狀態
  const [contestants, setContestants] = useState(DEFAULT_CONTESTANTS);
  const [contestantVotes, setContestantVotes] = useState({});
  const [votingOpen, setVotingOpen] = useState(false);
  const [showVoteResults, setShowVoteResults] = useState(true);
  const [signupClosed, setSignupClosed] = useState(false);
  const [songs, setSongs] = useState(DEFAULT_SONGS);
  const [quizQuestions, setQuizQuestions] = useState(DEFAULT_QUIZ);
  const [sponsorships, setSponsorships] = useState([]);
  // 搶答系統：{ open: bool, locked: bool, buzzes: [{name, ts}] }
  const [buzzer, setBuzzer] = useState({ open: false, locked: false, buzzes: [] });
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState('idle');
  // const [showResetConfirm, setShowResetConfirm] = useState(false); // 已移除：改用 showUndoConfirm
  const [liveMode, setLiveMode] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  // 載入資料
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY, true);
        if (r?.value) {
          const d = JSON.parse(r.value);
          if (d.flow) setFlow(ensureIds(d.flow));
          if (d.budget) setBudget(d.budget);
          if (d.awards) setAwards(d.awards);
          if (d.staff) setStaff(d.staff);
          if (d.registrations) setRegistrations(ensureIds(d.registrations));
          if (d.contestants) setContestants(ensureIds(d.contestants));
          if (d.contestantVotes) setContestantVotes(d.contestantVotes);
          if (typeof d.votingOpen === 'boolean') setVotingOpen(d.votingOpen);
          if (typeof d.showVoteResults === 'boolean') setShowVoteResults(d.showVoteResults);
          if (typeof d.signupClosed === 'boolean') setSignupClosed(d.signupClosed);
          if (d.songs) setSongs(ensureIds(d.songs));
          if (d.quizQuestions) setQuizQuestions(ensureIds(d.quizQuestions));
          if (d.sponsorships) setSponsorships(ensureIds(d.sponsorships));
          if (d.buzzer) setBuzzer(d.buzzer);
          if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
        }
      } catch (e) {}
      setLoading(false);
    })();
  }, []);

  // 即時同步：監聽 storage-updated 事件（由 polling 觸發）
  useEffect(() => {
    if (loading) return;

    // 用 ref 記錄目前是否正在儲存中，避免把自己的寫入又讀回來
    let recentlySaved = false;
    const markRecentlySaved = () => {
      recentlySaved = true;
      setTimeout(() => { recentlySaved = false; }, 3000);
    };
    window.__markRecentlySaved = markRecentlySaved;

    const handler = (e) => {
      try {
        const d = JSON.parse(e.detail.value);
        // 報名名單/投票/搶答由前台擁有，永遠接受最新值（即使剛存過也要更新，避免後台抱著舊名單）
        if (d.contestants) setContestants(ensureIds(d.contestants));
        if (d.contestantVotes) setContestantVotes(d.contestantVotes);
        if (d.buzzer) setBuzzer(d.buzzer);
        if (recentlySaved) return; // 其餘欄位：剛存完的跳過（避免覆蓋使用者正在編輯的內容）
        if (d.flow) setFlow(ensureIds(d.flow));
        if (d.budget) setBudget(d.budget);
        if (d.awards) setAwards(d.awards);
        if (d.staff) setStaff(d.staff);
        if (d.registrations) setRegistrations(ensureIds(d.registrations));
        if (typeof d.votingOpen === 'boolean') setVotingOpen(d.votingOpen);
        if (typeof d.showVoteResults === 'boolean') setShowVoteResults(d.showVoteResults);
        if (typeof d.signupClosed === 'boolean') setSignupClosed(d.signupClosed);
        if (d.songs) setSongs(ensureIds(d.songs));
        if (d.quizQuestions) setQuizQuestions(ensureIds(d.quizQuestions));
        if (d.sponsorships) setSponsorships(ensureIds(d.sponsorships));
        if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
      } catch (err) {
        console.warn('同步解析失敗:', err);
      }
    };
    window.addEventListener('storage-updated', handler);
    return () => window.removeEventListener('storage-updated', handler);
  }, [loading]);

  // 歷史快照（最多保留 20 步），用來做「還原上一步」
  const historyRef = useRef([]);
  const lastSavedJsonRef = useRef(null);

  const saveData = useCallback(async (data) => {
    if (readOnlyRef.current) return; // 檢視模式不儲存
    setSaveStatus('saving');
    try {
      // 合併保護：報名名單(contestants)、投票(contestantVotes)、搶答(buzzer) 由前台擁有，
      // 後台自動儲存時一律以 storage 最新值為準，不可被後台舊狀態覆蓋。
      // 除非後台明確要覆蓋（清空 / 手動編輯），會帶 __override 旗標。
      let merged = { ...data };
      if (!data.__override) {
        try {
          const r = await window.storage.get(STORAGE_KEY, true);
          if (r?.value) {
            const cur = JSON.parse(r.value);
            if (cur.contestants) merged.contestants = cur.contestants;
            if (cur.contestantVotes) merged.contestantVotes = cur.contestantVotes;
            if (cur.buzzer) merged.buzzer = cur.buzzer;
            if (cur.lotteryWinners) merged.lotteryWinners = cur.lotteryWinners;
          }
        } catch (e) {}
      }
      delete merged.__override;
      const json = JSON.stringify(merged);
      // 存入歷史（和上次不同才存）
      if (lastSavedJsonRef.current && lastSavedJsonRef.current !== json) {
        historyRef.current.push(lastSavedJsonRef.current);
        if (historyRef.current.length > 20) historyRef.current.shift();
      }
      lastSavedJsonRef.current = json;
      if (window.__markRecentlySaved) window.__markRecentlySaved();
      await window.storage.set(STORAGE_KEY, json, true);
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus('idle'), 1500);
    } catch (e) { setSaveStatus('idle'); }
  }, []);

  // 後台明確編輯/清空 報名名單 或 投票 時，直接覆寫 storage（帶 __override 旗標）
  const commitContestants = useCallback(async (nextContestants) => {
    if (readOnlyRef.current) return;
    setContestants(nextContestants);
    try {
      const r = await window.storage.get(STORAGE_KEY, true);
      const cur = r?.value ? JSON.parse(r.value) : {};
      cur.contestants = nextContestants;
      if (window.__markRecentlySaved) window.__markRecentlySaved();
      await window.storage.set(STORAGE_KEY, JSON.stringify(cur), true);
    } catch (e) {}
  }, []);
  const commitVotes = useCallback(async (nextVotes) => {
    if (readOnlyRef.current) return;
    setContestantVotes(nextVotes);
    try {
      const r = await window.storage.get(STORAGE_KEY, true);
      const cur = r?.value ? JSON.parse(r.value) : {};
      cur.contestantVotes = nextVotes;
      if (window.__markRecentlySaved) window.__markRecentlySaved();
      await window.storage.set(STORAGE_KEY, JSON.stringify(cur), true);
    } catch (e) {}
  }, []);

  // 還原上一步
  const handleUndo = () => {
    if (historyRef.current.length === 0) {
      alert('沒有可以還原的歷史紀錄（剛載入的狀態無法還原）');
      return;
    }
    const prevJson = historyRef.current.pop();
    try {
      const d = JSON.parse(prevJson);
      if (d.flow) setFlow(ensureIds(d.flow));
      if (d.budget) setBudget(d.budget);
      if (d.awards) setAwards(d.awards);
      if (d.staff) setStaff(d.staff);
      if (d.registrations) setRegistrations(ensureIds(d.registrations));
      if (d.contestants) setContestants(ensureIds(d.contestants));
      if (d.contestantVotes) setContestantVotes(d.contestantVotes);
      if (typeof d.votingOpen === 'boolean') setVotingOpen(d.votingOpen);
      if (typeof d.showVoteResults === 'boolean') setShowVoteResults(d.showVoteResults);
      if (d.songs) setSongs(ensureIds(d.songs));
      if (d.quizQuestions) setQuizQuestions(ensureIds(d.quizQuestions));
      if (d.sponsorships) setSponsorships(ensureIds(d.sponsorships));
          if (d.buzzer) setBuzzer(d.buzzer);
      if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
      lastSavedJsonRef.current = prevJson; // 更新當前快照
      setShowUndoConfirm(false);
    } catch (e) {
      alert('還原失敗：' + e.message);
    }
  };
  const [showUndoConfirm, setShowUndoConfirm] = useState(false);

  // 延遲啟用自動儲存（避免載入後立刻又把舊資料存回去）
  const [autoSaveReady, setAutoSaveReady] = useState(false);
  useEffect(() => {
    if (loading) return;
    const t = setTimeout(() => setAutoSaveReady(true), 1500);
    return () => clearTimeout(t);
  }, [loading]);

  useEffect(() => {
    if (loading || !autoSaveReady) return;
    const t = setTimeout(() => saveData({ flow, budget, awards, staff, registrations, contestants, contestantVotes, votingOpen, showVoteResults, signupClosed, songs, quizQuestions, sponsorships, buzzer, settings }), 800);
    return () => clearTimeout(t);
  }, [flow, budget, awards, staff, registrations, contestants, contestantVotes, votingOpen, showVoteResults, signupClosed, songs, quizQuestions, sponsorships, buzzer, settings, loading, autoSaveReady, saveData]);

  const calc = useMemo(() => {
    const ctx = budget.assumptions;
    const exp = budget.expenses.map(e => {
      const q = evalFormula(e.qty, ctx);
      const p = evalFormula(e.price, ctx);
      return { ...e, _qty: q, _price: p, _total: q * p };
    });
    const expTotal = exp.reduce((a, b) => a + b._total, 0);
    const income = ctx.tables * ctx.perTable * ctx.perPerson;
    return { expensesWithTotal: exp, expTotal, income, gap: expTotal - income, balance: income + ctx.subsidyCap - expTotal };
  }, [budget]);

  // #14 以「人數」為主，自動換算所需桌數（基準、+10人、+20人 三情境）
  const scenarios = useMemo(() => {
    const ctx = budget.assumptions;
    const basePeople = ctx.tables * ctx.perTable;  // 目前假設的總人數
    const v = ctx.tableCost + 30 + 0.8 * 480;
    const MIN_TABLES = 8; // 最低消費 8 桌
    // 產生 3 個人數情境：基準、+10、+20（可以在 UI 上自訂）
    const peopleList = ctx.scenarioPeople || [basePeople, basePeople + 10, basePeople + 20];
    return peopleList.map(people => {
      // 根據人數算所需桌數（無條件進位），但不能少於 8 桌
      const calcTables = Math.ceil(people / ctx.perTable);
      const tables = Math.max(MIN_TABLES, calcTables);
      const inc = people * ctx.perPerson;
      const exp = calc.expTotal + (tables - ctx.tables) * v;
      return { tables, persons: people, income: inc, expense: exp, need: exp - inc, withinCap: (exp - inc) <= ctx.subsidyCap, isMin: tables === MIN_TABLES && calcTables < MIN_TABLES };
    });
  }, [budget, calc.expTotal]);

  const todos = useMemo(() => {
    const list = [];
    awards.forEach((a, i) => { if (!a.winner.trim()) list.push({ id: `a-${i}`, category: '得獎', priority: 'medium', task: `填寫「${a.category} — ${a.name}」`, goTo: 'awards' }); });
    staff.forEach((s, i) => { if (!s.name.trim()) list.push({ id: `s-${i}`, category: '分工', priority: 'high', task: `指派「${s.role}」`, goTo: 'staff' }); });
    registrations.forEach((r) => { if (r.name.trim() && !r.paid) list.push({ id: `r-${r.id}`, category: '繳費', priority: 'medium', task: `催繳：${r.name}`, goTo: 'registration' }); });
    if (calc.balance < 0) list.push({ id: 'budget-over', category: '預算', priority: 'high', task: `預算超支 $${fmt(Math.abs(calc.balance))}`, goTo: 'budget' });
    if (registrations.length === 0) list.push({ id: 'reg-empty', category: '報名', priority: 'high', task: '尚未建立報名名單', goTo: 'registration' });
    if (contestants.length === 0) list.push({ id: 'contest-empty', category: '走秀', priority: 'medium', task: '尚未登錄走秀參賽者', goTo: 'activities' });
    return list;
  }, [awards, staff, registrations, calc.balance, contestants]);

  // 註：已移除「還原為預設」「清空所有資料」等危險動作
  // 現在只提供「還原上一步」（handleUndo）



  if (loading) return <div className="min-h-screen flex items-center justify-center" style={{ background: '#FFFBEA' }}><Loader2 className="w-8 h-8 animate-spin" style={{ color: '#F5B800' }} /></div>;

  if (liveMode) return <LiveMode
    flow={flow} awards={awards} staff={staff}
    contestants={contestants} contestantVotes={contestantVotes} votingOpen={votingOpen} showVoteResults={showVoteResults}
    setVotingOpen={setVotingOpen} setShowVoteResults={setShowVoteResults}
    songs={songs} setSongs={setSongs}
    quizQuestions={quizQuestions} setQuizQuestions={setQuizQuestions}
    settings={settings}
    onExit={() => setLiveMode(false)}
  />;

  const tabs = [
    { id: 'overview', label: '總覽', icon: Home },
    { id: 'flow', label: '流程', icon: Calendar },
    { id: 'activities', label: '現場活動', icon: Gamepad2 },
    { id: 'slides', label: '活動簡報', icon: Presentation },
    { id: 'registration', label: '報名', icon: ClipboardList },
    { id: 'awards', label: '得獎', icon: Award },
    { id: 'sponsorships', label: '贊助禮品', icon: Gift },
    { id: 'staff', label: '分工', icon: UserCheck },
    { id: 'budget', label: '預算', icon: DollarSign },
    { id: 'stats', label: '統計', icon: BarChart3 },
    { id: 'todos', label: '待辦', icon: ListChecks },
    { id: 'settings', label: '活動設定', icon: Settings },
  ];

  const currentTab = tabs.find(t => t.id === tab);

  return (
    <div className="min-h-screen" style={{ background: 'linear-gradient(135deg, #FFFBEA 0%, #FFF4CC 100%)', fontFamily: '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' }}>
      <style>{`
        @media print { body { background: white !important; } .no-print { display: none !important; } }
        input, textarea { -webkit-appearance: none; }
      `}</style>

      <header className="sticky top-0 z-30 backdrop-blur-md border-b no-print" style={{ background: 'rgba(255, 251, 234, 0.95)', borderColor: '#F5B800' }}>
        <div className="max-w-4xl mx-auto px-3 py-2.5">
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <button onClick={() => setMenuOpen(true)} className="p-2 -ml-1 rounded-lg active:bg-yellow-100 transition md:hidden">
                <Menu className="w-5 h-5" style={{ color: '#92400E' }} />
              </button>
              <div className="min-w-0">
                <div className="text-base md:text-lg font-bold leading-tight truncate" style={{ color: '#1F2937' }}>{settings?.eventName || '活動籌備工具'}</div>
                <div className="text-[10px] md:text-xs truncate" style={{ color: '#92400E' }}>{settings.eventTheme} · {formatShortDate(settings)} · {settings.eventLocation}</div>
              </div>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <CountdownBadgeMini target={getEventDateTime(settings)} />
              <SaveDot status={saveStatus} />
              <button onClick={() => { window.location.hash = ''; }} className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition" style={{ color: '#92400E', border: '1px solid #FCD34D' }} title="回到前台">
                🏠<span className="hidden sm:inline">前台</span>
              </button>
              <button onClick={() => { window.open(window.location.pathname + '#live', '_blank'); }} className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-white text-xs font-bold shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #DC2626, #EA580C)' }}>
                <Radio className="w-3.5 h-3.5" /><span className="hidden sm:inline">現場</span>
              </button>
              <button onClick={() => { window.open(window.location.pathname + '#present', '_blank'); }} className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-white text-xs font-bold shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }} title="播放活動簡報">
                <Presentation className="w-3.5 h-3.5" /><span className="hidden sm:inline">簡報</span>
              </button>
            </div>
          </div>
          <nav className="hidden md:flex gap-1 mt-2 -mb-px overflow-x-auto">
            {tabs.map(({ id, label, icon: Icon }) => {
              const count = id === 'todos' ? todos.length : null;
              return (
                <button key={id} onClick={() => setTab(id)} className="flex items-center gap-2 px-3 py-2 rounded-t-lg text-sm font-medium transition whitespace-nowrap"
                  style={{ background: tab === id ? '#F5B800' : 'transparent', color: tab === id ? 'white' : '#78350F', borderBottom: tab === id ? '3px solid #B45309' : '3px solid transparent' }}>
                  <Icon className="w-4 h-4" />{label}
                  {count > 0 && <span className="px-1.5 py-0.5 rounded-full text-[10px] font-bold" style={{ background: tab === id ? 'white' : '#DC2626', color: tab === id ? '#DC2626' : 'white' }}>{count}</span>}
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      {menuOpen && (
        <div className="fixed inset-0 z-40 md:hidden" onClick={() => setMenuOpen(false)}>
          <div className="absolute inset-0" style={{ background: 'rgba(0,0,0,0.5)' }}></div>
          <div className="absolute left-0 top-0 bottom-0 w-72 bg-white shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b" style={{ borderColor: '#FCD34D', background: '#FFFBEA' }}>
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: `linear-gradient(135deg, ${settings.primaryColor}, ${settings.secondaryColor})` }}>
                  <Sparkles className="w-5 h-5 text-white" />
                </div>
                <div>
                  <div className="font-bold text-sm">{settings.eventName}</div>
                  <div className="text-[10px]" style={{ color: '#92400E' }}>{settings.eventTheme}</div>
                </div>
              </div>
              <button onClick={() => setMenuOpen(false)} className="p-2 rounded-lg active:bg-yellow-100"><X className="w-4 h-4" style={{ color: '#92400E' }} /></button>
            </div>
            <nav className="flex-1 overflow-y-auto py-2">
              {tabs.map(({ id, label, icon: Icon }) => {
                const count = id === 'todos' ? todos.length : null;
                return (
                  <button key={id} onClick={() => { setTab(id); setMenuOpen(false); }} className="w-full flex items-center justify-between px-4 py-3 text-left"
                    style={{ background: tab === id ? '#FEF3C7' : 'transparent', color: tab === id ? '#92400E' : '#1F2937', borderLeft: tab === id ? '4px solid #F5B800' : '4px solid transparent' }}>
                    <div className="flex items-center gap-3"><Icon className="w-5 h-5" /><span className="font-medium">{label}</span></div>
                    <div className="flex items-center gap-2">
                      {count > 0 && <span className="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{ background: '#DC2626' }}>{count}</span>}
                      <ChevronRight className="w-4 h-4 opacity-40" />
                    </div>
                  </button>
                );
              })}
            </nav>
            <div className="p-3 border-t" style={{ borderColor: '#FEF3C7' }}>
              <button onClick={() => { setShowUndoConfirm(true); setMenuOpen(false); }} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-yellow-50 mb-1" style={{ color: '#92400E' }}>
                <RotateCcw className="w-4 h-4" />↶ 還原上一步
              </button>
              {onLogout && (
                <button onClick={() => { setMenuOpen(false); onLogout(); }} className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-yellow-50" style={{ color: '#92400E' }}>
                  <span>🏠</span>回到前台
                </button>
              )}
              <div className="text-center text-[10px] mt-2" style={{ color: '#92400E', opacity: 0.5 }}>工具 {APP_VERSION}</div>
            </div>
          </div>
        </div>
      )}

      <main className={`max-w-4xl mx-auto px-3 md:px-4 py-4 md:py-6 pb-24 md:pb-8 ${readOnly ? 'admin-readonly' : ''}`}>
        {readOnly && (
          <div className="mb-4 rounded-xl p-3 flex items-center gap-3 flex-wrap" style={{ background: '#FEF3C7', border: '1px solid #F5B800' }}>
            <span className="text-xl">👁</span>
            <div className="flex-1 min-w-0 text-sm" style={{ color: '#92400E' }}>
              <b>檢視模式</b>：目前為唯讀，所有欄位與按鈕已鎖定。如需修改，請以具修改權限的密碼重新登入。
            </div>
            <button onClick={() => { try { sessionStorage.removeItem('fule_admin_role'); } catch (e) {} window.location.reload(); }} className="px-3 py-1.5 rounded-lg text-sm font-bold shrink-0" style={{ color: '#92400E', border: '1px solid #F5B800', background: '#fff' }}>重新登入</button>
          </div>
        )}
        {tab === 'overview' && <OverviewTab flow={flow} calc={calc} registrations={registrations} awards={awards} staff={staff} todos={todos} contestants={contestants} sponsorships={sponsorships} budget={budget} onNavigate={setTab} settings={settings} />}
        {tab === 'flow' && <FlowTab flow={flow} setFlow={lock(setFlow)} settings={settings} staff={staff} />}
        {tab === 'activities' && <ActivitiesTab
          contestants={contestants} setContestants={lock(setContestants)} commitContestants={commitContestants}
          contestantVotes={contestantVotes} setContestantVotes={lock(setContestantVotes)} commitVotes={commitVotes}
          votingOpen={votingOpen} setVotingOpen={lock(setVotingOpen)}
          showVoteResults={showVoteResults} setShowVoteResults={lock(setShowVoteResults)}
          songs={songs} setSongs={lock(setSongs)}
          quizQuestions={quizQuestions} setQuizQuestions={lock(setQuizQuestions)}
          buzzer={buzzer} setBuzzer={lock(setBuzzer)}
          signupClosed={signupClosed} setSignupClosed={lock(setSignupClosed)}
        />}
        {tab === 'slides' && <SlidesTab readOnly={readOnly} />}
        {tab === 'registration' && <RegistrationTab registrations={registrations} setRegistrations={lock(setRegistrations)} budget={budget} calc={calc} settings={settings} />}
        {tab === 'awards' && <AwardsTab awards={awards} setAwards={lock(setAwards)} />}
        {tab === 'sponsorships' && <SponsorshipsTab sponsorships={sponsorships} setSponsorships={lock(setSponsorships)} />}
        {tab === 'staff' && <StaffTab staff={staff} setStaff={lock(setStaff)} />}
        {tab === 'budget' && <BudgetTab budget={budget} setBudget={lock(setBudget)} calc={calc} settings={settings} />}
        {tab === 'stats' && <StatsTab budget={budget} setBudget={lock(setBudget)} calc={calc} scenarios={scenarios} flow={flow} awards={awards} staff={staff} registrations={registrations} settings={settings} />}
        {tab === 'todos' && <TodosTab todos={todos} onNavigate={setTab} />}
        {tab === 'settings' && <SettingsTab settings={settings} setSettings={lock(setSettings)} />}
      </main>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-20 bg-white border-t shadow-lg no-print" style={{ borderColor: '#FCD34D', paddingBottom: 'env(safe-area-inset-bottom)' }}>
        <div className="grid grid-cols-6">
          {[
            { id: 'overview', label: '總覽', icon: Home },
            { id: 'flow', label: '流程', icon: Calendar },
            { id: 'activities', label: '現場', icon: Gamepad2 },
            { id: 'registration', label: '報名', icon: ClipboardList },
            { id: 'budget', label: '預算', icon: DollarSign },
            { id: 'todos', label: '待辦', icon: ListChecks, badge: todos.length },
          ].map(({ id, label, icon: Icon, badge }) => (
            <button key={id} onClick={() => setTab(id)} className="flex flex-col items-center gap-0.5 py-2 relative active:bg-yellow-50"
              style={{ color: tab === id ? '#F5B800' : '#92400E' }}>
              <Icon className="w-5 h-5" strokeWidth={tab === id ? 2.5 : 2} />
              <span className="text-[10px] font-medium">{label}</span>
              {tab === id && <div className="absolute top-0 left-1/4 right-1/4 h-0.5 rounded-full" style={{ background: '#F5B800' }}></div>}
              {badge > 0 && <span className="absolute top-1 right-1/4 px-1 min-w-[16px] h-4 rounded-full text-[9px] font-bold text-white flex items-center justify-center" style={{ background: '#DC2626' }}>{badge}</span>}
            </button>
          ))}
        </div>
      </nav>

      {showUndoConfirm && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(0,0,0,0.5)' }} onClick={() => setShowUndoConfirm(false)}>
          <div className="bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl" onClick={e => e.stopPropagation()}>
            <h3 className="text-lg font-bold mb-2">↶ 還原上一步？</h3>
            <p className="text-sm text-gray-600 mb-4">
              把所有資料恢復到上一次變更前的狀態。
              <br/><br/>
              目前可還原的步數：<span className="font-bold" style={{ color: '#F5B800' }}>{historyRef.current.length}</span> 步
            </p>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowUndoConfirm(false)} className="px-4 py-2 rounded-lg border">取消</button>
              <button onClick={handleUndo} className="px-4 py-2 rounded-lg text-white" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>確認還原</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CountdownBadgeMini({ target }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 60000); return () => clearInterval(t); }, []);
  const diff = target - now;
  if (diff <= 0) return <div className="hidden xs:flex items-center gap-1 text-[10px] px-2 py-1 rounded-md font-bold" style={{ background: '#F5B800', color: 'white' }}>進行中</div>;
  const days = Math.floor(diff / 86400000);
  return <div className="flex items-center gap-1 text-[10px] md:text-xs px-2 py-1 rounded-md font-bold shadow-sm" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', color: 'white' }}>
    <Clock className="w-3 h-3" />{days}天
  </div>;
}

function SaveDot({ status }) {
  const color = status === 'saving' ? '#F5B800' : status === 'saved' ? '#10B981' : '#9CA3AF';
  const text = status === 'saving' ? '儲存中' : status === 'saved' ? '已儲存' : '已連線';
  return <div className="hidden sm:flex items-center gap-1 text-[10px] px-2 py-1 rounded-md" style={{ background: '#F9FAFB', color }}>
    <div className="w-1.5 h-1.5 rounded-full animate-pulse" style={{ background: color }}></div>{text}
  </div>;
}

// ============== 現場活動分頁 ==============

      </div>

      {/* 子分頁切換 */}
      <div className="bg-white rounded-xl p-1 shadow-sm border grid grid-cols-3 gap-1" style={{ borderColor: '#FCD34D' }}>
        {[
          { id: 'runway', label: '走秀投票', icon: Vote },
          { id: 'songs', label: '百萬大歌星', icon: Music2 },

// ============== 走秀管理 ==============
function RunwaySection({ contestants, setContestants, commitContestants, contestantVotes, setContestantVotes, commitVotes, votingOpen, setVotingOpen, showVoteResults, setShowVoteResults, signupClosed, setSignupClosed }) {
  const [showQR, setShowQR] = useState(false);
  const [showSignupQR, setShowSignupQR] = useState(false);

  // 後台手動編輯名單一律直寫 storage（避免被前台報名同步蓋掉，也避免蓋掉前台報名）
  const commit = commitContestants || setContestants;
  const commitV = commitVotes || setContestantVotes;

  const addContestant = () => {
    const nextNumber = contestants.length > 0 ? Math.max(...contestants.map(c => Number(c.number) || 0)) + 1 : 1;
    commit([...contestants, { id: Date.now(), number: nextNumber, name: "", style: "", note: "" }]);
  };
  const updateContestant = (id, f, v) => commit(contestants.map(c => c.id === id ? { ...c, [f]: v } : c));
  const removeContestant = (id) => {
    commit(contestants.filter(c => c.id !== id));
    const newVotes = { ...contestantVotes };
    delete newVotes[id];
    commitV(newVotes);
  };

  const clearVotes = () => {
    if (confirm('確定清空所有投票？此動作不可復原')) {
      commitV({});
    }
  };

  const clearContestants = () => {
    if (confirm('確定清空所有走秀報名名單？此動作不可復原')) {
      commit([]);
      commitV({});
    }
  };

  // 取得投票頁 URL
  const getVoteUrl = () => {
    if (typeof window === 'undefined') return '';
    const base = window.location.href.split('#')[0];
    return base + '#vote';
  };

  const copyVoteUrl = () => {
    const url = getVoteUrl();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => alert('投票連結已複製！')).catch(() => {
        prompt('複製以下連結：', url);
      });
    } else {
      prompt('複製以下連結：', url);
    }
  };

  // #3 取得報名頁 URL
  const getSignupUrl = () => {
    if (typeof window === 'undefined') return '';
    const base = window.location.href.split('#')[0];
    return base + '#signup';
  };

  const copySignupUrl = () => {
    const url = getSignupUrl();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => alert('報名連結已複製！')).catch(() => {
        prompt('複製以下連結：', url);
      });
    } else {
      prompt('複製以下連結：', url);
    }
  };

  // 計算投票統計
  const voteStats = useMemo(() => {
    const stats = contestants.map(c => ({ ...c, votes: (contestantVotes[c.id] || []).length }));
    stats.sort((a, b) => b.votes - a.votes);
    const total = stats.reduce((s, c) => s + c.votes, 0);
    return { stats, total };
  }, [contestants, contestantVotes]);

  return (
    <div className="space-y-3">
      {/* 投票控制面板 */}
      <section className="bg-white rounded-2xl shadow-sm border p-4" style={{ borderColor: '#FCD34D' }}>
        <h3 className="font-bold text-base mb-3 flex items-center gap-2" style={{ color: '#1F2937' }}>
          <Vote className="w-5 h-5" style={{ color: '#F5B800' }} />走秀投票控制
        </h3>

        {/* 當前大狀態 */}
        <div className="rounded-2xl p-5 mb-4 text-center shadow-lg" style={{ background: votingOpen ? 'linear-gradient(135deg, #10B981, #059669)' : 'linear-gradient(135deg, #6B7280, #4B5563)', color: 'white' }}>
          <div className="text-4xl mb-2">{votingOpen ? '🟢' : '⏸️'}</div>
          <div className="text-2xl font-bold mb-1">
            {votingOpen ? '投票進行中' : '尚未開放投票'}
          </div>
          <div className="text-sm opacity-90">
            {votingOpen ? `已收 ${voteStats.total} 票` : '按下方「開放投票」即可開始'}
          </div>
        </div>

        {/* 主控按鈕 — 開放/關閉投票 */}
        <button onClick={() => setVotingOpen(!votingOpen)} className="w-full py-5 rounded-2xl text-white font-bold text-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-3 mb-3"
          style={{ background: votingOpen ? 'linear-gradient(135deg, #DC2626, #EA580C)' : 'linear-gradient(135deg, #10B981, #059669)' }}>
          {votingOpen ? <><Lock className="w-6 h-6" />🔒 關閉投票（結算）</> : <><Unlock className="w-6 h-6" />🚀 開放投票</>}
        </button>

        {/* 次要按鈕 */}
        <button onClick={() => setShowVoteResults(!showVoteResults)} className="w-full py-3 rounded-xl font-bold text-sm active:scale-95 transition flex items-center justify-center gap-2 border-2"
          style={{ borderColor: '#F5B800', color: '#92400E', background: showVoteResults ? '#FEF3C7' : 'white' }}>
          {showVoteResults ? <><Eye className="w-4 h-4" />即時結果公開中</> : <><EyeOff className="w-4 h-4" />結果隱藏中</>}
        </button>

        {/* QR Code / 連結 */}
        <div className="mt-4 pt-4 border-t" style={{ borderColor: '#FEF3C7' }}>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-bold flex items-center gap-1" style={{ color: '#92400E' }}>
              📱 會員投票入口
            </div>
            <button onClick={() => setShowQR(!showQR)} className="text-xs px-3 py-1 rounded font-bold" style={{ color: '#92400E', background: '#FEF3C7' }}>
              {showQR ? '隱藏 QR' : '顯示 QR'}
            </button>
          </div>
          <div className="flex gap-2">
            <div className="flex-1 px-3 py-2 rounded-lg text-xs font-mono truncate" style={{ background: '#F9FAFB', color: '#6B7280' }}>
              {typeof window !== 'undefined' ? getVoteUrl() : ''}
            </div>
            <button onClick={copyVoteUrl} className="px-3 py-2 rounded-lg text-xs font-bold text-white active:scale-95" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              複製
            </button>
          </div>
          {showQR && typeof window !== 'undefined' && (
            <div className="mt-3 flex justify-center">
              <div className="p-3 rounded-xl" style={{ background: 'white', border: '2px solid #F5B800' }}>
                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(getVoteUrl())}`} alt="投票 QR Code" style={{ width: 180, height: 180 }} onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} />
                <div style={{ display: 'none' }} className="text-xs text-center text-gray-500 w-[180px]">無法生成 QR Code<br/>請使用上方連結</div>
                <div className="text-center text-[10px] mt-2" style={{ color: '#92400E' }}>伙伴掃碼即可投票</div>
              </div>
            </div>
          )}
        </div>

        {voteStats.total > 0 && (
          <button onClick={clearVotes} className="w-full mt-3 py-2 rounded-lg text-xs font-medium border-2 border-dashed hover:bg-red-50" style={{ borderColor: '#FCA5A5', color: '#DC2626' }}>
            <RefreshCw className="w-3 h-3 inline mr-1" />清空所有投票
          </button>
        )}
      </section>

      {/* #3 自助報名連結 */}
      <section className="bg-white rounded-2xl shadow-sm border overflow-hidden" style={{ borderColor: '#FCD34D' }}>
        <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: '#FEF3C7', background: 'linear-gradient(90deg, #FEF3C7, #FFFBEA)' }}>
          <h3 className="font-bold text-sm flex items-center gap-2">
            <Shirt className="w-4 h-4" style={{ color: '#F5B800' }} />
            走秀自助報名連結
          </h3>
          <button onClick={() => setShowSignupQR(!showSignupQR)} className="flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium text-white" style={{ background: '#F5B800' }}>
            <QrCode className="w-3.5 h-3.5" />{showSignupQR ? '隱藏' : '顯示'} QR
          </button>
        </div>
        <div className="p-4">
          <div className="text-xs mb-2 text-gray-600">會員掃 QR Code 即可自行填姓名報名走秀，系統會自動分配號碼（限 {RUNWAY_SIGNUP_LIMIT} 組，目前 {contestants.length} 組{contestants.length >= RUNWAY_SIGNUP_LIMIT ? '・已額滿' : `・剩 ${RUNWAY_SIGNUP_LIMIT - contestants.length} 組`}）</div>
          <div className="flex gap-2">
            <div className="flex-1 px-3 py-2 rounded-lg text-xs font-mono truncate" style={{ background: '#F9FAFB', color: '#6B7280' }}>
              {typeof window !== 'undefined' ? getSignupUrl() : ''}
            </div>
            <button onClick={copySignupUrl} className="px-3 py-2 rounded-lg text-xs font-medium text-white active:scale-95" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              複製
            </button>
          </div>
          {showSignupQR && typeof window !== 'undefined' && (
            <div className="mt-3 flex justify-center">
              <div className="p-3 rounded-xl" style={{ background: 'white', border: '2px solid #F5B800' }}>
                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(getSignupUrl())}`} alt="報名 QR Code" style={{ width: 180, height: 180 }} onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }} />
                <div style={{ display: 'none' }} className="text-xs text-center text-gray-500 w-[180px]">無法生成 QR Code<br/>請使用上方連結</div>
                <div className="text-center text-[10px] mt-2" style={{ color: '#92400E' }}>會員掃碼即可自助報名</div>
              </div>
            </div>
          )}

          {/* 截止報名開關 */}
          <button onClick={() => setSignupClosed(!signupClosed)}
            className="w-full mt-3 py-3 rounded-xl font-bold text-white shadow-sm active:scale-95 transition flex items-center justify-center gap-2"
            style={{ background: signupClosed ? 'linear-gradient(135deg, #DC2626, #991B1B)' : 'linear-gradient(135deg, #10B981, #059669)' }}>
            {signupClosed ? '🔒 報名已截止（點此重新開放）' : '🟢 報名開放中（點此截止報名）'}
          </button>
          {signupClosed && <div className="text-xs text-center mt-2" style={{ color: '#DC2626' }}>參加者已無法再報名，名單鎖定中</div>}
        </div>
      </section>

      {/* 參賽者列表 */}
      <section className="bg-white rounded-2xl shadow-sm border overflow-hidden" style={{ borderColor: '#FCD34D' }}>
        <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: '#FEF3C7', background: '#FFFBEA' }}>
          <h3 className="font-bold text-sm flex items-center gap-2">
            <Users className="w-4 h-4" style={{ color: '#F5B800' }} />
            參賽者 ({contestants.length})
          </h3>
          <div className="flex items-center gap-2">
            {contestants.length > 0 && (
              <button onClick={clearContestants} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-50" style={{ color: '#DC2626', border: '1px solid #FCA5A5' }}>
                🗑 清空名單
              </button>
            )}
            <button onClick={addContestant} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-yellow-100" style={{ color: '#92400E' }}>
              <Plus className="w-3.5 h-3.5" />新增
            </button>
          </div>
        </div>

        {contestants.length === 0 ? (
          <div className="p-8 text-center">
            <Users className="w-12 h-12 mx-auto mb-2 opacity-30" style={{ color: '#92400E' }} />
            <div className="text-sm text-gray-500 mb-3">尚未有參賽者</div>
            <button onClick={addContestant} className="px-4 py-2 rounded-lg text-white font-medium text-sm" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              <Plus className="w-4 h-4 inline mr-1" />登錄第一位參賽者
            </button>
          </div>
        ) : (
          <div className="divide-y" style={{ borderColor: '#FEF3C7' }}>
            {voteStats.stats.map((c, rank) => (
              <ContestantCard key={c.id} contestant={c} rank={rank} totalVotes={voteStats.total} onUpdate={updateContestant} onRemove={removeContestant} />
            ))}
          </div>
        )}

        {voteStats.total > 0 && (
          <div className="p-3 border-t text-center text-xs font-bold" style={{ borderColor: '#FEF3C7', background: '#FEF3C7', color: '#92400E' }}>
            目前總票數：{voteStats.total} 票　|　第 1 名：{voteStats.stats[0]?.name || '—'}
          </div>
        )}
      </section>
    </div>
  );
}

function ContestantCard({ contestant: c, rank, totalVotes, onUpdate, onRemove }) {
  const [expanded, setExpanded] = useState(false);
  const pct = totalVotes > 0 ? (c.votes / totalVotes * 100) : 0;
  const isTop = rank === 0 && c.votes > 0;

  return (
    <div className="p-3" style={{ background: isTop ? 'linear-gradient(90deg, #FFFBEA, white)' : 'white' }}>
      <div className="flex items-start gap-2">
        {/* 號碼牌（可直接點選編輯） */}
        <div className="shrink-0 w-12 flex flex-col items-center">
          <input
            type="number"
            value={c.number ?? ''}
            onChange={e => onUpdate(c.id, 'number', e.target.value)}
            title="點此設定號碼牌"
            className="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-xl text-center outline-none focus:ring-2 focus:ring-yellow-400"
            style={{ background: isTop ? 'linear-gradient(135deg, #F5B800, #FF9F1C)' : 'linear-gradient(135deg, #FEF3C7, #FDE68A)', color: isTop ? 'white' : '#92400E', border: 'none' }}
          />
          <div className="text-[9px] mt-0.5" style={{ color: '#92400E', opacity: 0.6 }}>號碼牌</div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-0.5">
            {isTop && <Trophy className="w-4 h-4" style={{ color: '#F5B800' }} />}
            <input value={c.name} onChange={e => onUpdate(c.id, 'name', e.target.value)} placeholder="參賽者姓名" className="flex-1 font-bold text-sm bg-transparent outline-none border-b border-transparent focus:border-yellow-400" style={{ color: '#1F2937' }} />
            <div className="shrink-0 text-lg font-bold" style={{ color: c.votes > 0 ? '#92400E' : '#9CA3AF' }}>{c.votes}</div>
            <div className="shrink-0 text-xs" style={{ color: '#6B7280' }}>票</div>
          </div>
          {c.style && !expanded && <div className="text-xs text-gray-500 mb-1.5 line-clamp-1">{c.style}</div>}
          {totalVotes > 0 && (
            <div className="h-1.5 rounded-full overflow-hidden" style={{ background: '#FEF3C7' }}>
              <div className="h-full transition-all duration-500" style={{ width: `${pct}%`, background: isTop ? 'linear-gradient(90deg, #F5B800, #FF9F1C)' : 'linear-gradient(90deg, #FCD34D, #F5B800)' }}></div>
            </div>
          )}
          {expanded && (
            <div className="mt-2 space-y-2" style={{ background: '#FFFBEA', padding: '8px', borderRadius: '8px' }}>
              <div>

// ============== 搶答系統控制（後台） ==============
function BuzzerSection({ buzzer, setBuzzer }) {
  const [showQR, setShowQR] = useState(false);

  // 快速 polling：每 1 秒拉一次最新 buzzer 狀態（搶答需要即時）
  useEffect(() => {
    const t = setInterval(async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) {
          const fresh = JSON.parse(r.value);
          if (fresh.buzzer) {
            // 用 setBuzzer 觸發更新（會經由 saveData 重新寫回但其實沒變化）
            // 為避免循環，比對 JSON 字串
            const currentStr = JSON.stringify(buzzer);
            const freshStr = JSON.stringify(fresh.buzzer);
            if (currentStr !== freshStr) {
              // 有新搶答者時播音效
              const oldCount = (buzzer?.buzzes || []).length;
              const newCount = (fresh.buzzer?.buzzes || []).length;
              if (newCount > oldCount) _sfx.buzz();
              setBuzzer(fresh.buzzer);
            }
          }
        }
      } catch (e) {}
    }, 1000);
    return () => clearInterval(t);
  }, [buzzer, setBuzzer]);

  const buzzes = buzzer?.buzzes || [];

  // 主持人按鈕 → 直接寫回 storage 並更新 state
  const writeBuzzer = async (next) => {
    setBuzzer(next);
    try {
      const r = await window.storage.get('fule_yellow_party_v7', true);
      const fresh = r?.value ? JSON.parse(r.value) : {};
      fresh.buzzer = next;
      await window.storage.set('fule_yellow_party_v7', JSON.stringify(fresh), true);
    } catch (e) {}
  };

  const startRound = () => writeBuzzer({ open: true, locked: false, buzzes: [], roundId: Date.now() });
  const lockRound = () => writeBuzzer({ ...buzzer, open: false, locked: true });
  const resumeRound = () => writeBuzzer({ ...buzzer, open: true, locked: false });
  const newRound = () => writeBuzzer({ open: false, locked: false, buzzes: [], roundId: Date.now() });

  const getBuzzerUrl = () => {
    if (typeof window === 'undefined') return '';
    return window.location.origin + window.location.pathname + '#buzzer';
  };

  // 狀態判定
  let statusText, statusBg;
  if (!buzzer.open && !buzzer.locked) {
    statusText = '⏸️ 待機中（按「開始本回合」讓會員可以搶答）';
    statusBg = '#6B7280';
  } else if (buzzer.open && !buzzer.locked) {
    statusText = '🟢 開放搶答中';
    statusBg = '#10B981';
  } else if (buzzer.locked) {
    statusText = '🔒 已鎖定（按「下一回合」開新題）';
    statusBg = '#DC2626';
  }

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl p-5 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
        <div className="flex items-center gap-2 mb-3">
          <Zap className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h3 className="font-bold">搶答系統控制台</h3>
        </div>
        <div className="text-xs text-gray-600 mb-4">
          會員手機掃 QR Code → 輸入姓名 → 等主持人開放搶答 → 比手速！
        </div>

        {/* 狀態 */}
        <div className="rounded-xl p-3 mb-4 text-white text-center font-bold text-sm" style={{ background: statusBg }}>
          {statusText}
        </div>

        {/* 控制按鈕 */}
        <div className="space-y-2 mb-3">
          {/* 主按鈕：依狀態變化 */}
          {!buzzer.open && !buzzer.locked && (
            <button onClick={startRound} className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              🎯 開放搶答
            </button>
          )}
          {buzzer.open && !buzzer.locked && (
            <button onClick={lockRound} className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #DC2626, #991B1B)' }}>
              🔒 鎖定（停止搶答）
            </button>
          )}

          {/* 一鍵重新開放 — 隨時可按，清空後立刻重開新一輪 */}
          <button onClick={startRound} className="w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg active:scale-95 transition flex items-center justify-center gap-2" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            🔄 重新開放搶答（清空再搶）
          </button>

          {/* 鎖定後可繼續本回合（不清空） */}
          {buzzer.locked && (
            <button onClick={resumeRound} className="w-full py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #3B82F6, #2563EB)' }}>
              ↻ 繼續本回合（不清空名單）
            </button>
          )}
        </div>

        <div className="text-[11px] text-center mb-2" style={{ color: '#92400E' }}>
          💡 連續搶答：每搶完一輪，按「🔄 重新開放搶答」就能讓大家再搶一次
        </div>

        {/* 重置 */}
        {buzzes.length > 0 && (
          <button onClick={() => { if (confirm('清空所有搶答紀錄並回到待機？')) newRound(); }}
            className="w-full text-xs py-2 rounded-lg border" style={{ borderColor: '#FCA5A5', color: '#DC2626' }}>
            🗑 清空並回到待機
          </button>
        )}
      </div>

      {/* 排行榜 */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
        <div className="flex items-center justify-between mb-3">
          <div className="font-bold flex items-center gap-2">
            <span>🏆 搶答排行</span>
            <span className="text-xs font-normal" style={{ color: '#92400E' }}>已 {buzzes.length} 人搶答</span>
          </div>
        </div>
        {buzzes.length === 0 ? (
          <div className="text-center py-6 text-sm text-gray-400">尚無搶答記錄</div>
        ) : (
          <div className="space-y-1.5">
            {buzzes.slice(0, 3).map((b, i) => {
              const firstTs = buzzes[0].ts;
              const diff = b.ts - firstTs;
              return (
                <div key={i} className="flex items-center justify-between px-3 py-3 rounded-xl" style={{ background: i === 0 ? 'linear-gradient(135deg, #FEF3C7, #FDE68A)' : '#FFFBEA', border: i === 0 ? '2px solid #F5B800' : '1px solid #FCD34D', animation: i === 0 ? 'flashPop 0.5s ease' : 'slideUpBounce 0.4s ease' }}>
                  <div className="flex items-center gap-3">
                    <div className="text-3xl" style={{ animation: i === 0 ? 'bigZoom 0.6s ease' : 'none' }}>{i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</div>
                    <div>
                      <div className="font-bold text-lg" style={{ color: i === 0 ? '#92400E' : '#1F2937' }}>{b.name}</div>
                      <div className="text-[10px] text-gray-500">
                        {i === 0 ? '最快' : `+${diff} ms`}
                      </div>
                    </div>
                  </div>
                  {i === 0 && <div className="text-xs px-2 py-1 rounded-full font-bold text-white" style={{ background: '#F5B800' }}>WINNER</div>}
                </div>
              );
            })}
            {buzzes.length > 3 && (
              <details className="mt-2">
                <summary className="text-xs text-gray-500 cursor-pointer pl-2">第 4 名以後（{buzzes.length - 3} 人）</summary>
                <div className="space-y-1 mt-2">
                  {buzzes.slice(3).map((b, i) => {
                    const firstTs = buzzes[0].ts;
                    const diff = b.ts - firstTs;
                    return (
                      <div key={i + 3} className="flex items-center justify-between px-3 py-2 rounded-lg text-sm" style={{ background: '#F9FAFB' }}>
                        <div>{i + 4}. {b.name}</div>
                        <div className="text-[10px] text-gray-500">+{diff} ms</div>
                      </div>
                    );
                  })}
                </div>
              </details>
            )}
          </div>
        )}
      </div>

      {/* 會員入口 QR Code */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
        <div className="flex items-center justify-between mb-3">
          <div className="font-bold">📱 會員入口 QR Code</div>
          <button onClick={() => setShowQR(!showQR)} className="text-xs px-3 py-1 rounded-lg" style={{ background: '#FFFBEA', color: '#92400E' }}>
            {showQR ? '隱藏' : '顯示'}
          </button>
        </div>
        {showQR && (
          <div className="text-center">
            <div className="inline-block p-3 rounded-xl mb-2" style={{ background: 'white', border: '1px solid #FCD34D' }}>
              <img alt="QR" src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(getBuzzerUrl())}`} />
            </div>
            <div className="text-xs break-all px-2" style={{ color: '#92400E' }}>{getBuzzerUrl()}</div>
            <button onClick={() => { navigator.clipboard?.writeText(getBuzzerUrl()); alert('連結已複製'); }} className="mt-2 text-xs px-3 py-1 rounded" style={{ background: '#FEF3C7', color: '#92400E' }}>📋 複製連結</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ============== 總覽（活動全貌） ==============
function OverviewTab({ flow, calc, registrations, awards, staff, todos, contestants, sponsorships = [], budget, onNavigate, settings }) {
  const duration = useMemo(() => {
    if (flow.length === 0) return '—';
    const f = flow[0].time?.split('-')[0] || '';
    const l = flow[flow.length - 1].time?.split('-')[1] || '';
    return `${f} - ${l}`;
  }, [flow]);

  const regStats = useMemo(() => {
    const tp = registrations.reduce((s, r) => s + 1 + (Number(r.companions) || 0), 0);
    const td = registrations.reduce((s, r) => s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)), 0);
    const tpd = registrations.reduce((s, r) => r.paid ? s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)) : s, 0);
    return { totalPeople: tp, totalDue: td, totalPaid: tpd };
  }, [registrations]);

  const awardsFilled = awards.filter(a => a.winner.trim()).length;
  const staffFilled = staff.filter(s => s.name.trim()).length;

  // 從 staff 找出可能對應此環節的負責夥伴（與時間軸一致）
  const findRespForRow = (row) => {
    const matched = matchStaffForRow(row, staff);
    return matched.map(s => s.name).join('、');
  };

  // 算每環節分鐘數
  const getDurationMin = (time) => {
    if (!time || !time.includes('-')) return null;
    const [s, e] = time.split('-').map(x => x.trim());
    if (!s || !e) return null;
    const [sh, sm] = s.split(':').map(Number);
    const [eh, em] = e.split(':').map(Number);
    if ([sh, sm, eh, em].some(isNaN)) return null;
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if (d < 0) d += 24 * 60;
    return d;
  };

  // 活動總 Rundown 匯出
  const exportRundown = () => {
    const eventName = (settings?.eventName || '活動').trim();
    const theme = (settings?.eventTheme || '').trim();
    const dateStr = settings?.eventDate || new Date().toISOString().slice(0, 10);
    const filename = `${dateStr}_${eventName}${theme ? '_' + theme : ''}_總Rundown.xlsx`.replace(/\s+/g, '');

    // === Sheet 1: 活動基本資訊 ===
    const infoRows = [
      ['活動名稱', eventName],
      ['活動主題', theme],
      ['日期', settings?.eventDate || ''],
      ['開始時間', settings?.eventStartTime || ''],
      ['結束時間', settings?.eventEndTime || ''],
      ['活動性質', settings?.nature || ''],
      ['地點', settings?.eventLocation || ''],
      ['Dress Code', settings?.dressCode || ''],
      ['主辦', settings?.organizer || ''],
      [],
      ['【統計】'],
      ['報名人數', regStats.totalPeople],
      ['流程環節數', flow.length],
      ['得獎項目', awards.length],
      ['得獎已填', awardsFilled],
      ['工作角色', staff.length],
      ['工作已指派', staffFilled],
      ['贊助禮品項', sponsorships.length],
      ['贊助總價值', sponsorships.reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.value) || 0), 0)],
      [],
      ['匯出時間', new Date().toLocaleString('zh-TW')],
    ];

    // === Sheet 2: 活動流程（含負責夥伴）=== 主表 ===
    const flowRows = flow.map((r, i) => {
      const dur = getDurationMin(r.time);
      const resp = findRespForRow(r);
      return [
        i + 1,
        r.time || '',
        dur !== null ? `${dur} 分` : '',
        r.title || '',
        resp || '—',
        r.detail || '',
        r.music || '',
        r.prize || '',
        (Number(r.prizeQty) || 0) || '',
        r.note || '',
      ];
    });
    const totalMin = flow.reduce((s, r) => s + (getDurationMin(r.time) || 0), 0);
    const totalPrizeQty = flow.reduce((s, r) => s + (Number(r.prizeQty) || 0), 0);
    const prizeItems = flow.filter(r => r.prize && r.prize.trim()).length;
    flowRows.push([], ['', '【總計】'], ['', '環節數', flow.length], ['', '總時長', `${Math.floor(totalMin / 60)} 時 ${totalMin % 60} 分`], ['', '抽獎項目', `${prizeItems} 項`], ['', '抽獎總份數', totalPrizeQty]);

    // === Sheet 3: 工作分工 ===
    const staffRows = staff.map((s, i) => [i + 1, s.role || '', s.name || '', s.phone || '', s.responsibility || '']);
    staffRows.push([], ['', '【統計】'], ['', '總角色', staff.length], ['', '已指派', staffFilled]);

    // === Sheet 4: 得獎名單 ===
    const awardsRows = [];
    const grouped = {};
    awards.forEach(a => { (grouped[a.category] = grouped[a.category] || []).push(a); });
    Object.entries(grouped).forEach(([cat, items]) => {
      items.forEach((a, i) => awardsRows.push([cat, i + 1, a.name, a.winner || '', a.note || '']));
    });

    // === Sheet 5: 贊助禮品 ===
    const spRows = sponsorships.map((s, i) => {
      const qty = Number(s.qty) || 0;
      const val = Number(s.value) || 0;
      return [i + 1, s.name || '', qty, val, qty * val, s.sponsor || '', s.note || ''];
    });
    const spTotalValue = sponsorships.reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.value) || 0), 0);
    spRows.push([], ['', '【統計】'], ['', '總項數', sponsorships.length], ['', '總價值', '', '', spTotalValue]);

    // === Sheet 6: 報名繳費 ===
    const sortedReg = [...registrations].sort((a, b) => {
      const ag = (a.group || '').trim();
      const bg = (b.group || '').trim();
      if (!ag && !bg) return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
      if (!ag) return 1;
      if (!bg) return -1;
      const an = Number(ag), bn = Number(bg);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      const c = ag.localeCompare(bg, 'zh-Hant');
      return c !== 0 ? c : (a.name || '').localeCompare(b.name || '', 'zh-Hant');
    });
    const regRows = sortedReg.map((r, i) => {
      const fee = Number(r.fee) || 0;
      const comp = Number(r.companions) || 0;
      const payMethod = r.payMethod === 'cash' ? '現金' : r.payMethod === 'linepay' ? 'LinePay' : r.payMethod === 'transfer' ? '轉帳' : '';
      return [i + 1, r.group || '', r.name || '', comp, 1 + comp, fee, fee * (1 + comp), r.paid ? '已繳' : '未繳', payMethod, r.note || ''];
    });
    const totalDue = registrations.reduce((s, r) => s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)), 0);
    const totalPaid = registrations.reduce((s, r) => r.paid ? s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)) : s, 0);
    regRows.push([], ['', '【統計】'], ['', '', '總人數', '', regStats.totalPeople], ['', '', '應收', '', '', '', totalDue], ['', '', '已收', '', '', '', totalPaid], ['', '', '未收', '', '', '', totalDue - totalPaid]);

    const sheets = [
      { name: '活動資訊', columns: ['項目', '內容'], rows: infoRows, colWidths: [18, 50] },
      { name: '活動流程', columns: ['序', '時間', '時長', '環節', '負責夥伴', '內容細節', '音樂', '抽獎禮品', '份數', '備註'], rows: flowRows, colWidths: [4, 12, 8, 18, 20, 28, 14, 18, 6, 18] },
      { name: '工作分工', columns: ['序', '角色', '負責人', '電話', '工作內容'], rows: staffRows, colWidths: [4, 20, 14, 14, 40] },
    ];
    if (awards.length > 0) sheets.push({ name: '得獎名單', columns: ['類別', '序', '獎項名稱', '得獎者', '備註'], rows: awardsRows, colWidths: [12, 4, 24, 16, 30] });
    if (sponsorships.length > 0) sheets.push({ name: '贊助禮品', columns: ['序', '禮品名稱', '數量', '單價', '總價值', '贊助人', '備註'], rows: spRows, colWidths: [4, 22, 8, 10, 12, 18, 24] });
    if (registrations.length > 0) sheets.push({ name: '報名繳費', columns: ['序', '小組', '姓名', '攜伴', '總人', '單價', '應繳', '狀態', '繳費方式', '備註'], rows: regRows, colWidths: [4, 8, 14, 6, 6, 10, 10, 8, 12, 30] });

    exportToXlsx(filename, sheets);
  };

  return (
    <div className="space-y-4">
      {/* Hero：活動卡片 */}
      <section className="rounded-2xl p-5 text-white shadow-lg" style={{ background: `linear-gradient(135deg, ${settings?.primaryColor || '#F5B800'} 0%, ${settings?.secondaryColor || '#FF9F1C'} 100%)` }}>
        <div className="flex items-center gap-1.5 mb-1 opacity-90 text-xs">
          <Sparkles className="w-3.5 h-3.5" />{settings?.eventName || 'BNI 富樂 11 週年'}
        </div>
        <h2 className="text-2xl font-bold mb-1 leading-tight">{settings?.eventTheme || '黃色派對'}</h2>
        <p className="text-sm opacity-95">{settings ? formatEventDate(settings) : '2025/06/12 (六)'} {duration}</p>
        <p className="text-sm opacity-90">{settings?.eventLocation || '高雄林皇宮'}{settings?.nature ? ` · ${settings.nature}` : ''}{settings?.dressCode ? ` · ${settings.dressCode}` : ''}</p>

        <div className="grid grid-cols-3 gap-2 mt-4">
          <div className="bg-white/20 backdrop-blur rounded-lg p-2.5 text-center">
            <div className="text-xs opacity-80">環節</div>
            <div className="text-lg font-bold">{flow.length}</div>
          </div>
          <div className="bg-white/20 backdrop-blur rounded-lg p-2.5 text-center">
            <div className="text-xs opacity-80">報名</div>
            <div className="text-lg font-bold">{regStats.totalPeople}</div>
          </div>
          <div className="bg-white/20 backdrop-blur rounded-lg p-2.5 text-center">
            <div className="text-xs opacity-80">預估支出</div>
            <div className="text-lg font-bold">${fmt(calc.expTotal).replace(/\d{3}$/, 'k')}</div>
          </div>
        </div>
      </section>

      {/* 活動總 Rundown 下載 */}
      <button onClick={exportRundown}
        className="w-full rounded-2xl p-4 shadow-lg active:scale-95 transition flex items-center gap-3"
        style={{ background: 'linear-gradient(135deg, #1E40AF, #2563EB)', color: 'white' }}>
        <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0" style={{ background: 'rgba(255,255,255,0.2)' }}>📋</div>
        <div className="flex-1 text-left">
          <div className="font-bold">下載活動總 Rundown</div>
          <div className="text-xs opacity-90 mt-0.5">完整 Excel：流程＋負責夥伴＋分工＋得獎＋贊助＋報名</div>
        </div>
        <Download className="w-5 h-5 shrink-0" />
      </button>

      {/* 待辦提醒（如果有） */}
      {todos.length > 0 && (
        <button onClick={() => onNavigate('todos')} className="w-full bg-white rounded-2xl p-4 shadow-sm border-2 text-left active:scale-[0.98] transition" style={{ borderColor: '#F59E0B' }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: '#FEF3C7' }}>
                <AlertCircle className="w-5 h-5" style={{ color: '#D97706' }} />
              </div>
              <div>
                <div className="font-bold text-sm" style={{ color: '#92400E' }}>還有 {todos.length} 項待辦</div>
                <div className="text-xs" style={{ color: '#B45309' }}>
                  {todos.filter(t => t.priority === 'high').length > 0 && `${todos.filter(t => t.priority === 'high').length} 項高優先　`}
                  點擊查看詳情
                </div>
              </div>
            </div>
            <ChevronRight className="w-5 h-5" style={{ color: '#92400E' }} />
          </div>
        </button>
      )}

      {/* 完整活動流程時間軸 */}
      <section className="bg-white rounded-2xl shadow-sm border overflow-hidden" style={{ borderColor: '#FCD34D' }}>
        <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: '#FEF3C7', background: '#FFFBEA' }}>
          <div className="flex items-center gap-2">
            <Calendar className="w-4 h-4" style={{ color: '#F5B800' }} />
            <h3 className="font-bold text-sm" style={{ color: '#1F2937' }}>活動流程</h3>
            <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: '#F5B800', color: 'white' }}>{flow.length}</span>
          </div>
          <button onClick={() => onNavigate('flow')} className="text-xs font-medium px-2 py-1 rounded-md hover:bg-yellow-100 transition" style={{ color: '#92400E' }}>
            編輯 →
          </button>
        </div>
        <div className="divide-y" style={{ borderColor: '#FEF3C7' }}>
          {flow.map((row, idx) => <TimelineRow key={row.id} row={row} idx={idx} awards={awards} staff={staff} />)}
        </div>
      </section>

      {/* 彙整資訊卡片群 */}

// 時間軸單項
function TimelineRow({ row, idx, awards, staff = [] }) {
  const [expanded, setExpanded] = useState(false);
  // 計算此環節分鐘數
  const durationMin = useMemo(() => {
    if (typeof row.duration === 'number' && !isNaN(row.duration)) return row.duration;
    if (!row.time || !row.time.includes('-')) return null;
    const [s, e] = row.time.split('-').map(x => x.trim());
    if (!s || !e) return null;
    const [sh, sm] = s.split(':').map(Number);
    const [eh, em] = e.split(':').map(Number);
    if ([sh, sm, eh, em].some(isNaN)) return null;
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if (d < 0) d += 24 * 60;
    return d;
  }, [row.time, row.duration]);

  // 嘗試從 awards 找到對應此環節的得獎者
  const relatedAwards = useMemo(() => {
    if (row.title.includes('業績')) return awards.filter(a => a.category === '業績類' && a.winner.trim());
    if (row.title.includes('全勤')) return awards.filter(a => a.category === '全勤獎' && a.winner.trim());
    if (row.title.includes('金拖鞋')) return awards.filter(a => a.category === '金拖鞋獎' && a.winner.trim());
    if (row.title.includes('走秀')) return awards.filter(a => a.category === '造型走秀' && a.winner.trim());
    return [];
  }, [row, awards]);

  // 依共用配對函式比對分工（與總覽、匯出一致）
  const relatedStaff = useMemo(() => matchStaffForRow(row, staff), [row, staff]);

  return (
    <div className="active:bg-yellow-50/50 transition">
      <button onClick={() => setExpanded(!expanded)} className="w-full flex items-start gap-3 p-3 text-left">
        {/* 時間 + 編號 */}
        <div className="shrink-0 w-16 text-center">
          <div className="text-[10px] text-gray-400 font-bold">#{idx + 1}</div>
          <div className="text-xs font-mono font-bold leading-tight" style={{ color: '#92400E' }}>{(row.time || '').split('-')[0] || '—'}</div>
          <div className="text-[10px] font-mono text-gray-400 leading-tight">{(row.time || '').split('-')[1] || ''}</div>
          {durationMin !== null && (
            <div className="text-[10px] mt-1 px-1 rounded font-bold" style={{ background: '#FEF3C7', color: '#92400E' }}>{durationMin}分</div>
          )}
        </div>
        {/* 內容 */}
        <div className="flex-1 min-w-0">
          <div className="font-bold text-sm mb-0.5" style={{ color: '#1F2937' }}>{row.title}</div>
          {/* 分工標籤（永遠顯示） */}
          {relatedStaff.length > 0 && (
            <div className="flex flex-wrap gap-1 mt-1 mb-1">
              {relatedStaff.map((s, i) => (
                <span key={i} className="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full"
                  style={{ background: '#FEF3C7', color: '#92400E', border: '1px solid #FCD34D' }}>
                  <UserCheck className="w-2.5 h-2.5" />
                  <span className="font-bold">{s.name}</span>
                  <span className="opacity-70">· {s.role}</span>
                </span>
              ))}
            </div>
          )}
          {row.detail && !expanded && (
            <div className="text-xs text-gray-500 line-clamp-1">{row.detail.split('\n')[0]}</div>
          )}
          {row.music && !expanded && (
            <div className="flex items-center gap-1 mt-1">
              <Volume2 className="w-3 h-3 text-purple-400" />
              <span className="text-[10px] text-purple-500">{row.music}</span>
            </div>
          )}
          {expanded && (
            <div className="mt-2 space-y-2">
              {row.detail && (
                <div className="text-xs text-gray-600 whitespace-pre-wrap leading-relaxed p-2 rounded bg-gray-50">{row.detail}</div>
              )}
              {row.music && (
                <div className="flex items-center gap-1.5 text-xs" style={{ color: '#7C3AED' }}>
                  <Volume2 className="w-3.5 h-3.5" />{row.music}
                </div>
              )}
              {row.note && (
                <div className="text-xs text-green-700 bg-green-50 rounded p-2">
                  <span className="font-medium">備註：</span>{row.note}
                </div>
              )}
              {relatedStaff.length > 0 && (
                <div className="mt-2 pt-2 border-t" style={{ borderColor: '#FEF3C7' }}>
                  <div className="text-[10px] font-bold mb-1" style={{ color: '#92400E' }}>本環節分工</div>
                  <div className="space-y-1">
                    {relatedStaff.map((s, i) => (
                      <div key={i} className="flex items-start gap-2 text-xs">
                        <UserCheck className="w-3 h-3 shrink-0 mt-0.5" style={{ color: '#F5B800' }} />
                        <div className="flex-1 min-w-0">
                          <span className="font-bold" style={{ color: '#92400E' }}>{s.name}</span>
                          <span className="text-gray-500"> · {s.role}</span>
                          {s.responsibility && <div className="text-gray-500 text-[11px] mt-0.5">📋 {s.responsibility}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {relatedAwards.length > 0 && (
                <div className="mt-2 pt-2 border-t" style={{ borderColor: '#FEF3C7' }}>
                  <div className="text-[10px] font-bold mb-1" style={{ color: '#92400E' }}>本環節頒獎</div>
                  <div className="space-y-1">
                    {relatedAwards.map((a, i) => (
                      <div key={i} className="flex items-center gap-2 text-xs">
                        <Award className="w-3 h-3 shrink-0" style={{ color: '#F5B800' }} />
                        <span className="text-gray-600">{a.name}：</span>
                        <span className="font-bold" style={{ color: '#92400E' }}>{a.winner}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        {/* 展開指示 */}
        <ChevronRight className="w-4 h-4 shrink-0 text-gray-400 mt-1 transition-transform" style={{ transform: expanded ? 'rotate(90deg)' : 'none' }} />
      </button>
    </div>
  );
}

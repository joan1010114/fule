function BuzzerPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [myName, setMyName] = useState(() => {
    try { return localStorage.getItem('fule_buzzer_name') || ''; } catch (e) { return ''; }
  });
  const [entered, setEntered] = useState(() => {
    try { return !!localStorage.getItem('fule_buzzer_name'); } catch (e) { return false; }
  });
  const [pressedThisRound, setPressedThisRound] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [countdown, setCountdown] = useState(null); // 3,2,1,'搶!',null
  const lastRoundRef = useRef(null);
  const wasOpenRef = useRef(false);
  const rankedRef = useRef(false);

  // 載入資料 + polling
  useEffect(() => {
    const load = async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) setData(JSON.parse(r.value));
      } catch (e) {}
    };
    load().then(() => setLoading(false));
    const t = setInterval(load, 1000); // 1 秒輪詢，搶答需要快
    return () => clearInterval(t);
  }, []);

  const buzzer = data?.buzzer || { open: false, locked: false, buzzes: [], roundId: 0 };

  // 偵測新一輪：roundId 變了就重置 + 若開放則跑倒數
  useEffect(() => {
    if (lastRoundRef.current !== buzzer.roundId) {
      lastRoundRef.current = buzzer.roundId;
      setPressedThisRound(false);
      rankedRef.current = false;
      // 新一輪且為開放狀態 → 跑 3-2-1 倒數
      if (buzzer.open && !buzzer.locked && buzzer.roundId) {
        let n = 3;
        setCountdown(3);
        _sfx.tick();
        if (navigator.vibrate) navigator.vibrate(50);
        const iv = setInterval(() => {
          n -= 1;
          if (n > 0) {
            setCountdown(n);
            _sfx.tick();
            if (navigator.vibrate) navigator.vibrate(50);
          } else {
            setCountdown('搶!');
            _sfx.go();
            if (navigator.vibrate) navigator.vibrate(150);
            clearInterval(iv);
            setTimeout(() => setCountdown(null), 700);
          }
        }, 800);
        return () => clearInterval(iv);
      }
    }
  }, [buzzer.roundId, buzzer.open, buzzer.locked]);

  // 關閉時清掉倒數
  useEffect(() => {
    if (!buzzer.open) setCountdown(null);
  }, [buzzer.open]);

  // 偵測「我搶到第一名」→ 彩帶 + 勝利音效
  useEffect(() => {
    if (!entered) return;
    const idx = (buzzer.buzzes || []).findIndex(b => b.name === myName.trim());
    if (idx === 0 && !rankedRef.current) {
      rankedRef.current = true;
      setShowConfetti(true);
      _sfx.fanfare();
      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
      setTimeout(() => setShowConfetti(false), 3500);
    }
  }, [buzzer.buzzes]);

  const enter = () => {
    const n = myName.trim();
    if (!n) { alert('請輸入您的姓名'); return; }
    try { localStorage.setItem('fule_buzzer_name', n); } catch (e) {}
    setEntered(true);
  };

  const changeName = () => {
    try { localStorage.removeItem('fule_buzzer_name'); } catch (e) {}
    setEntered(false);
    setMyName('');
  };

  const buzz = async () => {
    if (!buzzer.open || buzzer.locked || pressedThisRound) return;
    if (countdown !== null && countdown !== '搶!') return; // 倒數中不能按
    setPressedThisRound(true); // 樂觀鎖
    _sfx.buzz();
    if (navigator.vibrate) navigator.vibrate([50, 30, 80]); // 手機震動回饋
    const ts = Date.now();
    try {
      const r = await window.storage.get('fule_yellow_party_v7', true);
      if (!r?.value) return;
      const fresh = JSON.parse(r.value);
      const fb = fresh.buzzer || { open: false, locked: false, buzzes: [], roundId: 0 };
      // 檢查最新狀態
      if (!fb.open || fb.locked) return;
      // 同名不重複
      if (fb.buzzes.some(b => b.name === myName.trim())) return;
      fb.buzzes = [...fb.buzzes, { name: myName.trim(), ts }];
      fresh.buzzer = fb;
      await window.storage.set('fule_yellow_party_v7', JSON.stringify(fresh), true);
      setData(fresh);
    } catch (e) {
      setPressedThisRound(false); // 失敗解鎖
    }
  };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: '#FFFBEA' }}>
      <div className="animate-spin w-12 h-12 rounded-full border-4" style={{ borderColor: '#F5B800', borderTopColor: 'transparent' }}></div>
    </div>;
  }

  // 名字輸入頁
  if (!entered) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{ background: 'linear-gradient(135deg, #FFFBEA 0%, #FEF3C7 100%)' }}>
        <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full" style={{ border: '2px solid #F5B800' }}>
          <div className="text-center mb-5">
            <div className="text-6xl mb-3">🔔</div>
            <div className="text-xl font-bold" style={{ color: '#1F2937' }}>搶答系統</div>
            <div className="text-xs mt-1" style={{ color: '#92400E' }}>輸入姓名後即可參加搶答</div>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-xs font-bold block mb-1" style={{ color: '#92400E' }}>您的姓名</label>
              <input value={myName} onChange={e => setMyName(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') enter(); }}
                placeholder="請輸入姓名"
                autoFocus
                className="w-full px-4 py-3 rounded-xl border text-base outline-none focus:border-yellow-400"
                style={{ borderColor: '#FCD34D' }} />
            </div>
            <button onClick={enter}
              className="w-full py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 transition"
              style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              進入搶答
            </button>
          </div>
        </div>
        <HomeFAB />
      </div>
    );
  }

  // 搶答頁
  const myBuzzIdx = buzzer.buzzes?.findIndex(b => b.name === myName.trim()) ?? -1;
  const myRank = myBuzzIdx >= 0 ? myBuzzIdx + 1 : null;
  const top3 = (buzzer.buzzes || []).slice(0, 3);

  // 狀態判定
  let statusBg, statusText, statusEmoji, btnDisabled, btnText, btnBg;
  if (!buzzer.open) {
    statusBg = 'linear-gradient(135deg, #6B7280, #4B5563)';
    statusText = '請等待主持人開放搶答';
    statusEmoji = '⏸️';
    btnDisabled = true;
    btnText = '尚未開始';
    btnBg = '#9CA3AF';
  } else if (buzzer.locked) {
    statusBg = 'linear-gradient(135deg, #DC2626, #991B1B)';
    statusText = '本回合已結束';
    statusEmoji = '🔒';
    btnDisabled = true;
    btnText = '已鎖定';
    btnBg = '#9CA3AF';
  } else if (myRank) {
    statusBg = myRank === 1
      ? 'linear-gradient(135deg, #F59E0B, #D97706)'
      : 'linear-gradient(135deg, #3B82F6, #2563EB)';
    statusText = myRank === 1 ? '🏆 您搶答最快！' : `您是第 ${myRank} 名搶答`;
    statusEmoji = myRank === 1 ? '🥇' : (myRank === 2 ? '🥈' : (myRank === 3 ? '🥉' : '✓'));
    btnDisabled = true;
    btnText = '已搶答';
    btnBg = '#9CA3AF';
  } else {
    statusBg = 'linear-gradient(135deg, #10B981, #059669)';
    statusText = '🎯 開放搶答中！';
    statusEmoji = '🚀';
    btnDisabled = false;
    btnText = '搶答！';
    btnBg = 'linear-gradient(135deg, #DC2626, #991B1B)';
  }

  // 倒數中（3/2/1）鎖住按鈕避免搶跑，顯示「搶!」或結束後才可按
  const counting = countdown !== null && countdown !== '搶!';
  if (counting) {
    btnDisabled = true;
    btnText = '準備…';
  }

  return (
    <div className="min-h-screen flex flex-col" style={{ background: 'linear-gradient(180deg, #FFFBEA 0%, #FEF3C7 100%)' }}>
      {/* Header */}
      <header className="px-4 py-3 shadow-sm" style={{ background: 'white', borderBottom: '1px solid #FCD34D' }}>
        <div className="max-w-3xl mx-auto flex items-center gap-2">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>🔔</div>
          <div className="flex-1">
            <div className="font-bold text-base" style={{ color: '#1F2937' }}>搶答系統</div>
            <div className="text-xs" style={{ color: '#92400E' }}>玩家：{myName} · <button onClick={changeName} className="underline">換名字</button></div>
          </div>
          <button onClick={() => {
            const el = document.documentElement;
            if (!document.fullscreenElement) el.requestFullscreen?.().catch(() => {});
            else document.exitFullscreen?.();
          }} className="px-3 py-1.5 rounded-lg text-xs font-medium" style={{ color: '#92400E', border: '1px solid #FCD34D' }}>
            ⛶ 全螢幕
          </button>
        </div>
      </header>

      <div className="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col">
        {/* 狀態橫幅 */}
        <div className="rounded-2xl p-6 md:p-8 text-center text-white shadow-xl mb-6" style={{ background: statusBg, animation: myRank === 1 ? 'flashPop 0.6s ease' : (buzzer.open && !buzzer.locked && !myRank ? 'glowPulse 1s ease-in-out infinite' : 'none') }}>
          <div className="text-7xl md:text-8xl mb-3" style={{ animation: myRank === 1 ? 'bigZoom 0.7s ease' : 'none' }}>{statusEmoji}</div>
          <div className="text-2xl md:text-4xl font-bold">{statusText}</div>
        </div>

        {/* 大按鈕 */}
        <div className="flex-1 flex items-center justify-center py-6">
          <button onClick={buzz} disabled={btnDisabled}
            className="rounded-full text-white font-bold shadow-2xl active:scale-90 transition"
            style={{
              background: btnBg,
              width: 'min(90vw, 420px)',
              height: 'min(90vw, 420px)',
              fontSize: 'clamp(2.5rem, 10vw, 5rem)',
              opacity: btnDisabled ? 0.6 : 1,
              cursor: btnDisabled ? 'not-allowed' : 'pointer',
              boxShadow: btnDisabled ? 'none' : '0 0 80px rgba(220, 38, 38, 0.6), 0 20px 40px rgba(0,0,0,0.3)',
              animation: !btnDisabled ? 'pulse 0.9s ease-in-out infinite' : 'none',
            }}>
            {btnText}
          </button>
        </div>

        {/* 前 3 名 */}
        {top3.length > 0 && (
          <div className="rounded-2xl p-5 shadow-sm" style={{ background: 'white', border: '2px solid #FCD34D' }}>
            <div className="text-lg md:text-xl font-bold mb-3" style={{ color: '#92400E' }}>🏆 前 3 名快手</div>
            <div className="space-y-2">
              {top3.map((b, i) => (
                <div key={i} className="flex items-center justify-between px-4 py-3 rounded-xl" style={{ background: i === 0 ? '#FEF3C7' : '#FFFBEA' }}>
                  <div className="flex items-center gap-3">
                    <div className="text-3xl md:text-4xl">{i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'}</div>
                    <div className="font-bold text-xl md:text-2xl" style={{ color: '#1F2937' }}>{b.name}</div>
                    {b.name === myName.trim() && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500 text-white">您</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <style>{`
        @keyframes pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.08); }
        }
      `}</style>
      <Confetti show={showConfetti} count={80} />
      {/* 3-2-1 倒數全螢幕遮罩 */}
      {countdown !== null && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 70, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.75)' }}>
          <div key={countdown} style={{
            fontSize: countdown === '搶!' ? 'clamp(5rem, 30vw, 18rem)' : 'clamp(8rem, 40vw, 22rem)',
            fontWeight: 900,
            color: countdown === '搶!' ? '#10B981' : '#F5B800',
            textShadow: '0 0 60px rgba(245,184,0,0.8)',
            animation: 'countPulse 0.8s ease',
          }}>
            {countdown}
          </div>
        </div>
      )}
      <HomeFAB />
    </div>
  );
}

// ============== 現場模式（V6 升級版） ==============
function LiveMode({ flow, awards, staff, contestants, contestantVotes, votingOpen, showVoteResults, setVotingOpen, setShowVoteResults, songs, setSongs, quizQuestions, setQuizQuestions, settings, onExit }) {
  const [now, setNow] = useState(Date.now());
  const [gameMode, setGameMode] = useState(null); // null | 'runway' | 'song' | 'quiz'

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const timeNow = new Date(now).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

  // ===== 遊戲模式（全螢幕） =====
  if (gameMode === 'runway') {
    return <RunwayGame contestants={contestants} contestantVotes={contestantVotes} votingOpen={votingOpen} showVoteResults={showVoteResults} setVotingOpen={setVotingOpen} setShowVoteResults={setShowVoteResults} onExit={() => setGameMode(null)} />;
  }
  if (gameMode === 'song') {
    return <SongGame songs={songs} setSongs={setSongs} onExit={() => setGameMode(null)} />;
  }
  if (gameMode === 'quiz') {
    return <QuizGame quizQuestions={quizQuestions} setQuizQuestions={setQuizQuestions} onExit={() => setGameMode(null)} />;
  }

  const games = [
    { id: 'runway', emoji: '🗳️', label: '走秀即時票數', desc: '參賽者得票即時顯示', grad: 'linear-gradient(135deg, #EC4899, #BE185D)' },
    { id: 'song', emoji: '🎵', label: '百萬大歌星', desc: '聽前奏猜歌名', grad: 'linear-gradient(135deg, #8B5CF6, #6D28D9)' },
    { id: 'quiz', emoji: '❓', label: '趣味競答', desc: '快問快答比反應', grad: 'linear-gradient(135deg, #10B981, #059669)' },
  ];

  return (
    <div className="min-h-screen flex flex-col" style={{ background: 'linear-gradient(135deg, #0F0F0F 0%, #1F1509 100%)', fontFamily: '"Noto Sans TC", sans-serif' }}>
      <header className="flex items-center justify-between px-4 md:px-6 py-3 border-b" style={{ borderColor: '#F5B800' }}>
        <div className="flex items-center gap-2">
          <div className="w-10 h-10 rounded-lg flex items-center justify-center animate-pulse" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            <Radio className="w-5 h-5 text-white" />
          </div>
          <div>
            <div className="text-[10px]" style={{ color: '#F5B800' }}>現場模式</div>
            <div className="text-white font-bold text-base">{settings?.eventTheme || settings?.eventName || '活動'}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="text-right">
            <div className="text-[10px] leading-none" style={{ color: '#94A3B8' }}>🕒 現在時間</div>
            <div className="text-xl md:text-2xl font-mono font-bold tabular-nums leading-tight" style={{ color: '#F5B800' }}>{timeNow}</div>
          </div>
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>離開</button>
        </div>
      </header>

      <main className="flex-1 flex flex-col items-center justify-center p-6 gap-6">
        <div className="text-center mb-2">
          <div className="text-4xl md:text-5xl font-bold text-white mb-2" style={{ textShadow: '0 0 30px rgba(245,184,0,0.5)' }}>🎉 現場互動 🎉</div>
          <div className="text-base md:text-lg" style={{ color: '#FCD34D' }}>選擇要進行的環節</div>
        </div>

        <div className="w-full max-w-md flex flex-col gap-4">
          {games.map((g, i) => (
            <button key={g.id}
              onClick={() => { _sfx.click(); setGameMode(g.id); }}
              className="w-full rounded-3xl p-6 shadow-2xl active:scale-95 transition flex items-center gap-5 group"
              style={{ background: g.grad, color: 'white', animation: `floatIn 0.5s ease ${i * 0.12}s both` }}>
              <div className="text-6xl md:text-7xl group-hover:scale-110 transition" style={{ filter: 'drop-shadow(0 4px 8px rgba(0,0,0,0.3))' }}>{g.emoji}</div>
              <div className="flex-1 text-left">
                <div className="font-bold text-2xl md:text-3xl">{g.label}</div>
                <div className="text-sm md:text-base opacity-90 mt-1">{g.desc}</div>
              </div>
              <div className="text-3xl opacity-70 group-hover:translate-x-1 transition">→</div>
            </button>
          ))}
        </div>
      </main>

      <style>{`
        @keyframes floatIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
      `}</style>
    </div>
  );
}

// ============== 走秀投票遊戲（全螢幕） ==============
function RunwayGame({ contestants, contestantVotes, votingOpen, showVoteResults, setVotingOpen, setShowVoteResults, onExit }) {
  const [highlight, setHighlight] = useState(null); // 聚焦的參賽者
  const [refresh, setRefresh] = useState(Date.now());
  const lastTotalRef = useRef(null);

  // 每秒刷新顯示
  useEffect(() => {
    const t = setInterval(() => setRefresh(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const sorted = useMemo(() => {
    const list = contestants.map(c => ({ ...c, votes: (contestantVotes[c.id] || []).length }));
    list.sort((a, b) => b.votes - a.votes);
    return list;
  }, [contestants, contestantVotes, refresh]);

  const total = sorted.reduce((s, c) => s + c.votes, 0);

  // 偵測新票進來播音效
  useEffect(() => {
    if (lastTotalRef.current !== null && total > lastTotalRef.current) {
      _sfx.pop();
    }
    lastTotalRef.current = total;
  }, [total]);

  return (
    <div className="min-h-screen" style={{ background: 'linear-gradient(135deg, #4C1D95 0%, #831843 100%)' }}>
      <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
        <div className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #EC4899, #F5B800)' }}>
            <Vote className="w-5 h-5 text-white" />
          </div>
          <div>
            <div className="text-[10px] text-pink-200">走秀投票 · 即時</div>
            <div className="text-white font-bold">造型走秀 票選</div>
          </div>
        </div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場主畫面
          </button>
        </div>
      </header>

      <div className="max-w-5xl mx-auto p-4 md:p-6">
        {/* 控制列 */}
        <div className="grid grid-cols-2 gap-2 mb-4">
          <button onClick={() => setVotingOpen(!votingOpen)} className="py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 transition flex items-center justify-center gap-2"
            style={{ background: votingOpen ? 'linear-gradient(135deg, #DC2626, #EA580C)' : 'linear-gradient(135deg, #10B981, #059669)' }}>
            {votingOpen ? <><Lock className="w-4 h-4" />關閉投票</> : <><Unlock className="w-4 h-4" />開放投票</>}
          </button>
          <button onClick={() => setShowVoteResults(!showVoteResults)} className="py-3 rounded-xl font-bold shadow-lg active:scale-95 transition flex items-center justify-center gap-2"
            style={{ background: showVoteResults ? 'rgba(245, 184, 0, 0.9)' : 'rgba(255,255,255,0.15)', color: showVoteResults ? '#1F2937' : 'white', border: '2px solid #F5B800' }}>
            {showVoteResults ? <><Eye className="w-4 h-4" />觀眾可見結果</> : <><EyeOff className="w-4 h-4" />結果隱藏中</>}
          </button>
        </div>

        {/* 狀態 */}
        <div className="flex items-center justify-center gap-2 mb-4 flex-wrap">
          <div className="px-3 py-1.5 rounded-full text-xs font-bold" style={{ background: votingOpen ? 'rgba(16, 185, 129, 0.3)' : 'rgba(107, 114, 128, 0.3)', color: 'white' }}>
            {votingOpen ? '🟢 開放投票中' : '🔴 投票已關閉'}
          </div>
          <div className="px-3 py-1.5 rounded-full text-xs font-bold text-white" style={{ background: 'rgba(245, 184, 0, 0.3)' }}>
            總票數：{total}
          </div>
          <div className="px-3 py-1.5 rounded-full text-xs font-bold text-white" style={{ background: 'rgba(236, 72, 153, 0.3)' }}>
            參賽：{contestants.length} 位
          </div>
        </div>

        {/* 排名列表 */}
        {contestants.length === 0 ? (
          <div className="rounded-2xl p-12 text-center" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }}>
            <Users className="w-16 h-16 mx-auto mb-3 opacity-40" />
            <div className="text-xl font-bold mb-2">尚未有參賽者</div>
            <div className="text-sm opacity-70">請到「現場活動」登錄走秀參賽者</div>
          </div>
        ) : (
          <div className="space-y-3">
            {sorted.map((c, rank) => {
              const pct = total > 0 ? (c.votes / total * 100) : 0;
              const isTop = rank === 0 && c.votes > 0;
              const isSecond = rank === 1 && c.votes > 0;
              const isThird = rank === 2 && c.votes > 0;
              const medal = isTop ? '🥇' : isSecond ? '🥈' : isThird ? '🥉' : '';

              return (
                <div key={c.id} className="rounded-2xl p-4 shadow-lg transition" style={{
                  background: isTop ? 'linear-gradient(135deg, rgba(245, 184, 0, 0.3), rgba(255, 159, 28, 0.2))' :
                              isSecond ? 'linear-gradient(135deg, rgba(203, 213, 225, 0.2), rgba(148, 163, 184, 0.15))' :
                              isThird ? 'linear-gradient(135deg, rgba(251, 146, 60, 0.2), rgba(234, 88, 12, 0.15))' :
                              'rgba(255,255,255,0.08)',
                  border: isTop ? '2px solid #F5B800' : '1px solid rgba(255,255,255,0.15)',
                  transform: isTop ? 'scale(1.02)' : 'scale(1)'
                }}>
                  <div className="flex items-center gap-3 md:gap-4">
                    {/* 號碼 + 名次 */}
                    <div className="shrink-0 relative">
                      <div className="w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center font-bold text-3xl md:text-4xl" style={{
                        background: isTop ? 'linear-gradient(135deg, #F5B800, #FF9F1C)' : 'linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1))',
                        color: 'white'
                      }}>
                        {c.number}
                      </div>
                      {medal && <div className="absolute -top-2 -right-2 text-2xl">{medal}</div>}
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="text-xl md:text-2xl font-bold text-white truncate">{c.name || '(未命名)'}</div>
                      </div>
                      {c.style && <div className="text-xs md:text-sm text-pink-100 mb-2 opacity-80 line-clamp-1">{c.style}</div>}

                      {/* 得票數顯示 */}
                      <div className="flex items-center justify-between mb-1.5">
                        <div className="text-xs text-pink-100 opacity-70">第 {rank + 1} 名</div>
                        <div className="flex items-baseline gap-1">
                          <span className="text-2xl md:text-3xl font-bold text-white">{c.votes}</span>
                          <span className="text-xs text-pink-100 opacity-70">票</span>
                          <span className="text-xs text-pink-100 opacity-70 ml-2">{pct.toFixed(1)}%</span>
                        </div>
                      </div>

                      {/* 進度條 */}
                      <div className="h-3 rounded-full overflow-hidden" style={{ background: 'rgba(0,0,0,0.3)' }}>
                        <div className="h-full transition-all duration-500" style={{
                          width: `${pct}%`,
                          background: isTop ? 'linear-gradient(90deg, #F5B800, #FF9F1C)' :
                                      isSecond ? 'linear-gradient(90deg, #CBD5E1, #94A3B8)' :
                                      isThird ? 'linear-gradient(90deg, #FB923C, #EA580C)' :
                                      'linear-gradient(90deg, #EC4899, #F5B800)'
                        }}></div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* 投票連結提示 */}
        {votingOpen && (
          <div className="mt-4 rounded-xl p-3 text-center text-xs" style={{ background: 'rgba(255,255,255,0.1)', color: 'white' }}>
            📱 伙伴掃描 QR Code 即可投票（頁面 3 秒自動刷新）
          </div>
        )}
      </div>
    </div>
  );
}

// ============== 百萬大歌星遊戲 ==============
function SongGame({ songs, setSongs, onExit }) {
  const [selectedId, setSelectedId] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [playMode, setPlayMode] = useState('hint'); // hint | audio | list
  const audioRef = useRef(null);
  const ytIframeRef = useRef(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const [ytPlaying, setYtPlaying] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);

  const current = songs.find(s => s.id === selectedId);
  const unplayed = songs.filter(s => !s.played);

  const selectSong = (s) => {
    _sfx.click();
    setSelectedId(s.id);
    setRevealed(false);
    setIsPlaying(false);
    setYtPlaying(false);
  };

  // YouTube iframe API 控制（透過 postMessage）
  const sendYtCommand = (command) => {
    if (!ytIframeRef.current || !ytIframeRef.current.contentWindow) return;
    ytIframeRef.current.contentWindow.postMessage(
      JSON.stringify({ event: 'command', func: command, args: [] }),
      '*'
    );
  };
  const playYoutube = () => { _sfx.click(); sendYtCommand('playVideo'); setYtPlaying(true); };
  const pauseYoutube = () => { sendYtCommand('pauseVideo'); setYtPlaying(false); };

  const reveal = () => {
    _sfx.reveal();
    setRevealed(true);
    setShowConfetti(true);
    setTimeout(() => _sfx.fanfare(), 400);
    setTimeout(() => setShowConfetti(false), 3000);
  };

  const markPlayed = () => {
    if (!current) return;
    setSongs(songs.map(s => s.id === current.id ? { ...s, played: true } : s));
    setSelectedId(null);
    setRevealed(false);
  };

  const playAudio = () => {
    if (audioRef.current) {
      audioRef.current.currentTime = current.startAt || 0;
      audioRef.current.play().catch(err => {
        alert('音檔播放失敗：' + err.message + '\n\n請確認網址是直接的音檔連結（.mp3/.wav），或改用 YouTube 連結。');
        setIsPlaying(false);
      });
      setIsPlaying(true);
    }
  };

  const stopAudio = () => {
    if (audioRef.current) {
      audioRef.current.pause();
      setIsPlaying(false);
    }
  };

  // #5 判斷音樂連結類型
  const getMusicType = (url) => {
    if (!url) return null;
    if (/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
    if (/\.(mp3|wav|ogg|m4a|aac)(\?|$)/i.test(url)) return 'audio';
    return 'link'; // 其他連結就顯示為超連結
  };

  // 轉 YouTube URL 為 embed 格式（手動觸發播放，支援 JS API 控制）
  const getYoutubeEmbed = (url) => {
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    if (!match) return null;
    const videoId = match[1];
    const startAt = current.startAt || 0;
    // enablejsapi=1 讓 postMessage 控制生效
    // 不自動播放（iOS 需使用者手動觸發）
    return `https://www.youtube.com/embed/${videoId}?enablejsapi=1&start=${startAt}&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&playsinline=1`;
  };

  // 選擇清單畫面
  if (!selectedId) {
    return (
      <div className="min-h-screen" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)' }}>
        <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #8B5CF6, #EC4899)' }}>
              <Music2 className="w-5 h-5 text-white" />
            </div>
            <div>
              <div className="text-[10px] text-purple-200">百萬大歌星</div>
              <div className="text-white font-bold">選擇題目</div>
            </div>
          </div>
          <button onClick={onExit} className="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場主畫面
          </button>
        </header>

        <div className="max-w-4xl mx-auto p-4 md:p-6">
          <div className="text-center text-white mb-4">
            <div className="text-sm opacity-80">剩餘 {unplayed.length} / {songs.length} 首可選</div>
          </div>

          {/* 歌曲格 */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            {songs.map((s, idx) => (
              <button key={s.id} onClick={() => !s.played && selectSong(s)} disabled={s.played} className="rounded-xl p-4 text-center transition active:scale-95"
                style={{ background: s.played ? 'rgba(107, 114, 128, 0.3)' : 'linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2))', border: `2px solid ${s.played ? 'rgba(107, 114, 128, 0.4)' : '#F5B800'}`, opacity: s.played ? 0.5 : 1, cursor: s.played ? 'not-allowed' : 'pointer' }}>
                <div className="text-2xl md:text-3xl font-bold mb-1" style={{ color: '#F5B800' }}>#{idx + 1}</div>
                {s.played && <div className="text-[10px] text-gray-300">已播過</div>}
                {!s.played && <div className="text-[10px] text-purple-200">未開始</div>}
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // 題目進行畫面
  return (
    <div className="min-h-screen flex flex-col" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)' }}>
      <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
        <button onClick={() => { stopAudio(); setSelectedId(null); setRevealed(false); }} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
          📋 題目列表
        </button>
        <div className="text-white font-bold text-lg">百萬大歌星</div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場
          </button>
        </div>
      </header>

      <main className="flex-1 flex flex-col items-center p-4 md:p-6 text-white text-center overflow-y-auto" style={{ minHeight: 0, justifyContent: "safe center" }}>
        {!revealed ? (
          <>
            <div key={`q-${current.id}`} className="text-xl md:text-2xl opacity-70 mb-3 font-bold" style={{ animation: 'bigZoom 0.5s ease' }}>第 {songs.findIndex(s => s.id === current.id) + 1} 題</div>

            {/* 提示詞區（如果有） */}
            {current.hint && (
              <div key={`h-${current.id}`} className="rounded-2xl p-4 md:p-6 max-w-4xl mb-4 w-full" style={{ background: 'rgba(245, 184, 0, 0.2)', border: '3px solid #F5B800', animation: 'slideUpBounce 0.6s ease' }}>
                <div className="text-base md:text-lg font-bold mb-2" style={{ color: '#F5B800' }}>💡 提示</div>
                <div className="text-4xl md:text-5xl font-bold leading-tight">{current.hint}</div>
                {current.lyrics && (
                  <div className="mt-4 text-lg md:text-xl opacity-80 pt-3 border-t font-medium" style={{ borderColor: 'rgba(245, 184, 0, 0.3)', animation: 'slideUpBounce 0.6s ease 0.2s both' }}>
                    歌詞開頭：「{current.lyrics}」
                  </div>
                )}
              </div>
            )}

            {/* 音檔播放區 */}
            {current.audioUrl ? (
              (() => {
                const musicType = getMusicType(current.audioUrl);
                if (musicType === 'youtube') {
                  const embedUrl = getYoutubeEmbed(current.audioUrl);
                  return embedUrl ? (
                    <div className="w-full max-w-2xl flex flex-col items-center gap-4">
                      <button
                        onClick={ytPlaying ? pauseYoutube : playYoutube}
                        className="rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition"
                        style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', width: 'min(40vw, 22vh, 224px)', height: 'min(40vw, 22vh, 224px)', animation: ytPlaying ? 'glowPulse 1.2s ease-in-out infinite' : 'none' }}>
                        {ytPlaying
                          ? <Pause style={{ width: '45%', height: '45%' }} className="text-white" />
                          : <Play style={{ width: '45%', height: '45%' }} className="text-white ml-2" />
                        }
                      </button>
                      {/* 播放中聲波動畫 */}
                      {ytPlaying && (
                        <div className="flex items-end gap-1.5 h-12">
                          {[0,1,2,3,4,5,6].map(i => (
                            <div key={i} style={{
                              width: 6, height: '100%',
                              background: 'linear-gradient(to top, #F5B800, #FF9F1C)',
                              borderRadius: 3,
                              transformOrigin: 'bottom',
                              animation: `soundBar ${0.4 + (i % 3) * 0.2}s ease-in-out ${i * 0.1}s infinite`,
                            }} />
                          ))}
                        </div>
                      )}
                      <div className="text-xl md:text-2xl font-bold opacity-90">
                        {ytPlaying ? '🎵 前奏播放中...' : `點按播放（從 ${current.startAt || 0} 秒開始）`}
                      </div>
                      <iframe
                        ref={ytIframeRef}
                        src={embedUrl}
                        style={{ position: 'fixed', left: '-9999px', top: '-9999px', width: '1px', height: '1px', border: 0, opacity: 0 }}
                        allow="autoplay; encrypted-media"
                        title="music player"
                      />
                    </div>
                  ) : (
                    <div className="text-red-400">無法解析 YouTube 網址</div>
                  );
                } else if (musicType === 'audio') {
                  return (
                    <div className="flex flex-col items-center gap-3">
                      <audio ref={audioRef} src={current.audioUrl} onEnded={() => setIsPlaying(false)} />
                      <button onClick={isPlaying ? stopAudio : playAudio} className="w-32 h-32 rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition"
                        style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
                        {isPlaying ? <Pause className="w-16 h-16 text-white" /> : <Play className="w-16 h-16 text-white ml-2" />}
                      </button>
                      <div className="text-sm opacity-70">
                        {isPlaying ? '🎵 播放中' : `點按播放（從 ${current.startAt || 0} 秒開始）`}
                      </div>
                    </div>
                  );
                } else {
                  return (
                    <div className="flex flex-col items-center gap-3">
                      <a href={current.audioUrl} target="_blank" rel="noopener noreferrer"
                        className="px-6 py-4 rounded-xl text-white font-bold shadow-2xl active:scale-95 transition"
                        style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
                        🔗 點此開啟音樂連結
                      </a>
                      <div className="text-xs opacity-70 max-w-md break-all">{current.audioUrl}</div>
                    </div>
                  );
                }
              })()
            ) : (
              !current.hint && (
                <div className="rounded-2xl p-6 max-w-2xl" style={{ background: 'rgba(239, 68, 68, 0.2)', border: '2px solid #EF4444' }}>
                  <div className="text-lg mb-2">⚠ 此題尚未設定音檔或提示</div>
                  <div className="text-sm opacity-70">請回到「現場活動 → 百萬大歌星」填入資料</div>
                </div>
              )
            )}

            <button onClick={reveal} className="mt-6 mb-2 px-10 md:px-16 py-4 md:py-5 rounded-2xl text-2xl md:text-3xl font-bold text-white shadow-2xl active:scale-95 transition shrink-0"
              style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              ✓ 揭曉答案
            </button>
          </>
        ) : (
          // 揭曉答案
          <div className="max-w-4xl w-full">
            <div className="text-xl md:text-2xl opacity-70 mb-3 font-bold" style={{ animation: 'slideUpBounce 0.5s ease' }}>答案揭曉</div>
            <div className="text-7xl md:text-9xl mb-8" style={{ animation: 'bigZoom 0.6s ease' }}>🎉</div>
            <div className="rounded-3xl p-10 md:p-14 shadow-2xl mb-8" style={{ background: 'linear-gradient(135deg, rgba(245, 184, 0, 0.3), rgba(236, 72, 153, 0.2))', border: '4px solid #F5B800', animation: 'bigZoom 0.6s ease 0.1s both, glowPulse 2s ease-in-out 0.7s infinite' }}>
              <div className="text-lg md:text-xl font-bold mb-3" style={{ color: '#F5B800' }}>🎵 歌曲名稱</div>
              <div className="text-6xl md:text-8xl font-bold mb-4 leading-tight">{current.title}</div>
              {current.artist && <div className="text-3xl md:text-4xl opacity-80">— {current.artist}</div>}
            </div>
            <div className="flex gap-3" style={{ animation: 'slideUpBounce 0.5s ease 0.3s both' }}>
              <button onClick={() => setRevealed(false)} className="flex-1 py-4 md:py-5 rounded-xl text-white hover:bg-white/10 font-bold text-xl md:text-2xl" style={{ border: '2px solid rgba(255,255,255,0.3)' }}>
                重看題目
              </button>
              <button onClick={markPlayed} className="flex-1 py-4 md:py-5 rounded-xl text-white font-bold text-xl md:text-2xl shadow-lg active:scale-95" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 下一題
              </button>
            </div>
          </div>
        )}
      </main>
      <Confetti show={showConfetti} />
    </div>
  );
}

// ============== 趣味競答遊戲 ==============
function QuizGame({ quizQuestions, setQuizQuestions, onExit }) {
  const [selectedId, setSelectedId] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [filterCat, setFilterCat] = useState('all');

  const current = quizQuestions.find(q => q.id === selectedId);
  const unused = quizQuestions.filter(q => !q.used);

  const categories = useMemo(() => ['all', ...new Set(quizQuestions.map(q => q.category))], [quizQuestions]);

  const filtered = useMemo(() => {
    if (filterCat === 'all') return quizQuestions;
    return quizQuestions.filter(q => q.category === filterCat);
  }, [quizQuestions, filterCat]);

  const categoryColors = {
    '黃色主題': '#F5B800',
    '富樂知識': '#3B82F6',
    '一般常識': '#10B981',
  };

  const selectQ = (q) => {
    setSelectedId(q.id);
    setRevealed(false);
  };

  const markUsed = () => {
    if (!current) return;
    setQuizQuestions(quizQuestions.map(q => q.id === current.id ? { ...q, used: true } : q));
    setSelectedId(null);
    setRevealed(false);
  };

  // #6 隨機跳題：根據當前類別從未使用題目中隨機抽一題
  const randomPick = () => {
    const pool = quizQuestions.filter(q => !q.used && (filterCat === 'all' || q.category === filterCat));
    if (pool.length === 0) {
      alert(filterCat === 'all' ? '沒有剩餘題目了' : `「${filterCat}」類沒有剩餘題目`);
      return;
    }
    const random = pool[Math.floor(Math.random() * pool.length)];
    selectQ(random);
  };

  // 選擇畫面
  if (!selectedId) {
    return (
      <div className="min-h-screen" style={{ background: 'linear-gradient(135deg, #064E3B 0%, #065F46 100%)' }}>
        <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              <HelpCircle className="w-5 h-5 text-white" />
            </div>
            <div>
              <div className="text-[10px] text-green-200">趣味競答</div>
              <div className="text-white font-bold">選擇題目</div>
            </div>
          </div>
          <button onClick={onExit} className="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10" style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場主畫面
          </button>
        </header>

        <div className="max-w-4xl mx-auto p-4 md:p-6">
          <div className="text-center text-white mb-4 flex items-center justify-center gap-3">
            <div className="text-sm opacity-80">剩餘 {unused.length} / {quizQuestions.length} 題可選</div>
            {unused.length < quizQuestions.length && (
              <button onClick={() => {
                if (confirm('重新開始？所有題目會變回可選狀態')) {
                  setQuizQuestions(quizQuestions.map(q => ({ ...q, used: false })));
                }
              }} className="text-xs px-2 py-1 rounded" style={{ background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.3)', color: 'white' }}>
                🔄 重新開始
              </button>
            )}
          </div>

          {/* 類別過濾 + 隨機跳題 */}
          <div className="flex gap-1.5 mb-2 overflow-x-auto">
            {categories.map(cat => {
              const count = cat === 'all' ? quizQuestions.length : quizQuestions.filter(q => q.category === cat).length;
              return (
                <button key={cat} onClick={() => setFilterCat(cat)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition"
                  style={{ background: filterCat === cat ? '#F5B800' : 'rgba(255,255,255,0.1)', color: filterCat === cat ? '#1F2937' : 'white' }}>
                  {cat === 'all' ? '全部' : cat} ({count})
                </button>
              );
            })}
          </div>

          {/* #6 大類隨機跳題 */}
          <button onClick={randomPick}
            className="w-full py-3 mb-4 rounded-xl text-white font-bold shadow-2xl active:scale-95 transition flex items-center justify-center gap-2"
            style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            🎲 從「{filterCat === 'all' ? '全部類別' : filterCat}」隨機抽一題
          </button>

          {/* 題目列表 */}
          <div className="space-y-2">
            {filtered.map((q, idx) => {
              const color = categoryColors[q.category] || '#9CA3AF';
              return (
                <button key={q.id} onClick={() => !q.used && selectQ(q)} disabled={q.used} className="w-full rounded-xl p-3 text-left transition active:scale-[0.98]"
                  style={{ background: q.used ? 'rgba(107, 114, 128, 0.2)' : 'rgba(255,255,255,0.1)', border: `1px solid ${q.used ? 'rgba(107, 114, 128, 0.3)' : 'rgba(255,255,255,0.2)'}`, opacity: q.used ? 0.5 : 1, cursor: q.used ? 'not-allowed' : 'pointer' }}>
                  <div className="flex items-start gap-2">
                    <div className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm text-white" style={{ background: color }}>
                      {quizQuestions.findIndex(x => x.id === q.id) + 1}
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{ background: color }}>{q.category}</div>
                        <div className="text-[10px] text-white opacity-70">{q.difficulty === 'easy' ? '簡單' : q.difficulty === 'medium' ? '中等' : '困難'}</div>
                      </div>
                      <div className="text-white text-sm line-clamp-2" style={{ textDecoration: q.used ? 'line-through' : 'none' }}>{q.question}</div>
                    </div>
                    {q.used && <CheckCircle2 className="w-4 h-4 shrink-0 text-gray-400" />}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // 題目進行畫面
  const catColor = categoryColors[current.category] || '#9CA3AF';
  return (
    <div className="min-h-screen flex flex-col" style={{ background: 'linear-gradient(135deg, #064E3B 0%, #065F46 100%)' }}>
      <header className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: 'rgba(255,255,255,0.2)' }}>
        <button onClick={() => { setSelectedId(null); setRevealed(false); }} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
          📋 題目列表
        </button>
        <div className="text-white font-bold text-lg">趣味競答</div>
        <div className="flex gap-2">
          <FullscreenButton />
          <button onClick={onExit} className="px-3 py-1.5 rounded-lg text-sm text-white hover:bg-white/10" style={{ border: '1px solid rgba(255,255,255,0.3)' }}>
            🏠 現場
          </button>
        </div>
      </header>

      <main className="flex-1 flex flex-col items-center p-4 md:p-6 text-white text-center overflow-y-auto" style={{ minHeight: 0, justifyContent: "safe center" }}>
        {!revealed ? (
          <div className="max-w-5xl w-full">
            <div className="flex items-center justify-center gap-3 mb-4">
              <div className="px-4 py-1.5 rounded-full text-base md:text-lg font-bold text-white" style={{ background: catColor }}>{current.category}</div>
              <div className="px-4 py-1.5 rounded-full text-base md:text-lg" style={{ background: 'rgba(255,255,255,0.15)', color: 'white' }}>
                {current.difficulty === 'easy' ? '🟢 簡單' : current.difficulty === 'medium' ? '🟡 中等' : '🔴 困難'}
              </div>
            </div>
            <div className="text-xl md:text-2xl opacity-70 mb-2 font-bold">第 {quizQuestions.findIndex(q => q.id === current.id) + 1} 題</div>
            <div key={`qe-${current.id}`} className="text-6xl md:text-7xl mb-3" style={{ animation: 'bigZoom 0.5s ease' }}>❓</div>
            <div key={`qq-${current.id}`} className="rounded-2xl p-6 md:p-8 mb-5 shadow-2xl" style={{ background: 'rgba(255,255,255,0.1)', border: '3px solid rgba(255,255,255,0.2)', animation: 'slideUpBounce 0.6s ease' }}>
              <div className="text-4xl md:text-5xl font-bold leading-snug">{current.question}</div>
            </div>

            {current.options && current.options.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
                {current.options.map((opt, i) => (
                  <div key={i} className="rounded-xl p-4 md:p-5 text-xl md:text-2xl text-left" style={{ background: 'rgba(255,255,255,0.1)', border: '2px solid rgba(255,255,255,0.2)' }}>
                    <span className="font-bold mr-3" style={{ color: '#F5B800' }}>{String.fromCharCode(65 + i)}.</span>
                    {opt}
                  </div>
                ))}
              </div>
            )}

            <button onClick={() => { _sfx.reveal(); setRevealed(true); }} className="px-10 md:px-16 py-4 md:py-5 rounded-2xl text-2xl md:text-3xl font-bold text-white shadow-2xl active:scale-95 transition shrink-0 mb-2"
              style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
              ✓ 揭曉答案
            </button>
          </div>
        ) : (
          <div className="max-w-4xl w-full">
            <div className="text-xl md:text-2xl opacity-70 mb-3 font-bold">答案揭曉</div>
            <div className="text-7xl md:text-9xl mb-8">🎉</div>
            <div className="rounded-3xl p-10 md:p-14 shadow-2xl mb-8" style={{ background: 'linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.2))', border: '4px solid #10B981' }}>
              <div className="text-lg md:text-xl font-bold mb-3" style={{ color: '#86EFAC' }}>✓ 正確答案</div>
              <div className="text-6xl md:text-8xl font-bold leading-tight">{current.answer}</div>
            </div>

            <div className="flex gap-3">
              <button onClick={() => setRevealed(false)} className="flex-1 py-4 md:py-5 rounded-xl text-white hover:bg-white/10 font-bold text-xl md:text-2xl" style={{ border: '2px solid rgba(255,255,255,0.3)' }}>
                重看題目
              </button>
              <button onClick={markUsed} className="flex-1 py-4 md:py-5 rounded-xl text-white font-bold text-xl md:text-2xl shadow-lg active:scale-95" style={{ background: 'linear-gradient(135deg, #10B981, #059669)' }}>
                ✓ 下一題
              </button>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}


  // ========================================
  // 掛載到 DOM
  // ========================================
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));

  // 移除 loading 畫面
  setTimeout(() => {
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';
  }, 100);
</script>

</body>
</html>

              <input value={settings.primaryColor} onChange={e => update('primaryColor', e.target.value)} className="flex-1 px-2 py-1.5 rounded-lg border text-sm font-mono outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
            </div>
          </div>
          <div>
            <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>副色</label>
            <div className="flex items-center gap-2 mt-0.5">
              <input type="color" value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="w-10 h-10 rounded cursor-pointer" style={{ border: '1px solid #FCD34D' }} />
              <input value={settings.secondaryColor} onChange={e => update('secondaryColor', e.target.value)} className="flex-1 px-2 py-1.5 rounded-lg border text-sm font-mono outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
            </div>
          </div>
        </div>

        {/* 預覽 */}
        <div className="mt-3 rounded-xl p-4 text-white text-center shadow" style={{ background: `linear-gradient(135deg, ${settings.primaryColor}, ${settings.secondaryColor})` }}>
          <div className="text-xs opacity-90 mb-1">預覽</div>
          <div className="text-lg font-bold">{settings.eventName}</div>
          <div className="text-sm opacity-90">{settings.eventTheme}</div>
        </div>
      </section>

      {/* 設定預覽卡 */}
      <section className="rounded-2xl p-5 text-white shadow-lg" style={{ background: `linear-gradient(135deg, ${settings.primaryColor} 0%, ${settings.secondaryColor} 100%)` }}>
        <div className="flex items-center gap-1.5 mb-1 opacity-90 text-xs">
          <Sparkles className="w-3.5 h-3.5" />活動卡片預覽
        </div>
        <h2 className="text-2xl font-bold mb-1 leading-tight">{settings.eventName}</h2>
        <p className="text-lg opacity-95 mb-2">{settings.eventTheme}</p>
        <div className="space-y-1 text-sm opacity-90">
          <div className="flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5" />{formatEventDate(settings)} {settings.eventStartTime}</div>
          <div className="flex items-center gap-1.5"><MapPin className="w-3.5 h-3.5" />{settings.eventLocation}</div>
          {settings.dressCode && <div className="flex items-center gap-1.5"><Shirt className="w-3.5 h-3.5" />Dress Code：{settings.dressCode}</div>}
          {settings.nature && <div className="flex items-center gap-1.5"><Info className="w-3.5 h-3.5" />{settings.nature}</div>}
        </div>
      </section>
    </div>
  );
}

// ============== 流程分頁（卡片式） ==============
function FlowTab({ flow, setFlow, settings, staff = [] }) {
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const [editingId, setEditingId] = useState(null);

  // 取得環節分鐘數（優先用 duration 欄位，否則從 time 字串推算）
  const rowDuration = (r) => {
    if (typeof r.duration === 'number' && !isNaN(r.duration)) return r.duration;
    if (r.time && r.time.includes('-')) {
      const [s, e] = r.time.split('-').map(x => x.trim());
      const [sh, sm] = (s || '').split(':').map(Number);
      const [eh, em] = (e || '').split(':').map(Number);
      if (![sh, sm, eh, em].some(isNaN)) {
        let d = (eh * 60 + em) - (sh * 60 + sm);
        if (d < 0) d += 24 * 60;
        return d;
      }
    }
    return 5;
  };

  // 活動起始時間：取第一個環節的開始時間
  const startTime = (flow[0]?.time || '').split('-')[0]?.trim() || '18:00';

  const minToTime = (totalMin) => {
    const nh = Math.floor(totalMin / 60) % 24;
    const nm = totalMin % 60;
    return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
  };

  // 串接重算：從 startTime 開始，依每個環節 duration 算出 time
  const recalcChain = (flowArr, start) => {
    const [h, m] = (start || '18:00').split(':').map(Number);
    let cursor = (isNaN(h) ? 18 : h) * 60 + (isNaN(m) ? 0 : m);
    return flowArr.map(r => {
      const dur = rowDuration(r);
      const s = minToTime(cursor);
      const e = minToTime(cursor + dur);
      cursor += dur;
      return { ...r, duration: dur, time: `${s}-${e}` };
    });
  };

  // 設定活動起始時間 → 全部重算
  const setStartTime = (t) => {
    setFlow(recalcChain(flow, t));
  };

  // 設定某環節分鐘數 → 重算後續
  const setDuration = (id, min) => {
    const d = Math.max(0, Number(min) || 0);
    const next = flow.map(r => r.id === id ? { ...r, duration: d } : r);
    setFlow(recalcChain(next, startTime));
  };

  const updateRow = (id, f, v) => setFlow(flow.map(r => r.id === id ? { ...r, [f]: v } : r));
  // 時間相減（分鐘）
  const timeDiffMin = (start, end) => {
    if (!start || !end) return null;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    if ([sh, sm, eh, em].some(isNaN)) return null;
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if (d < 0) d += 24 * 60;
    return d;
  };
  // 時間加上分鐘
  const addMinutesToTime = (time, addMin) => {
    if (!time) return '';
    const [h, m] = time.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return '';
    const total = h * 60 + m + addMin;
    const nh = Math.floor(total / 60) % 24;
    const nm = total % 60;
    return `${String(nh).padStart(2, '0')}:${String(nm).padStart(2, '0')}`;
  };

  const addRow = (id) => {
    const i = flow.findIndex(r => r.id === id);
    const newRow = { id: Date.now(), duration: 5, time: '', title: "新環節", detail: "", music: "", note: "" };
    const next = [...flow.slice(0, i + 1), newRow, ...flow.slice(i + 1)];
    setFlow(recalcChain(next, startTime));
    setEditingId(newRow.id);
  };

  const removeRow = (id) => {
    if (flow.length <= 1) return;
    const i = flow.findIndex(r => r.id === id);
    const next = [...flow.slice(0, i), ...flow.slice(i + 1)];
    setFlow(recalcChain(next, startTime));
  };
  const moveUp = (id) => { const i = flow.findIndex(r => r.id === id); if (i > 0) { const n = [...flow]; [n[i-1], n[i]] = [n[i], n[i-1]]; setFlow(recalcChain(n, startTime)); } };
  const moveDown = (id) => { const i = flow.findIndex(r => r.id === id); if (i < flow.length - 1) { const n = [...flow]; [n[i], n[i+1]] = [n[i+1], n[i]]; setFlow(recalcChain(n, startTime)); } };

  // #9 計算總分鐘數
  const totalMinutes = useMemo(() => {
    let total = 0;
    flow.forEach(r => {
      if (!r.time || !r.time.includes('-')) return;
      const [start, end] = r.time.split('-').map(s => s.trim());
      if (!start || !end) return;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) return;
      let diff = (eh * 60 + em) - (sh * 60 + sm);
      if (diff < 0) diff += 24 * 60; // 跨天處理
      total += diff;
    });
    return total;
  }, [flow]);

  // 抽獎禮品總份數
  const totalPrizeQty = useMemo(() => flow.reduce((s, r) => s + (Number(r.prizeQty) || 0), 0), [flow]);
  const prizeItemCount = useMemo(() => flow.filter(r => r.prize && r.prize.trim()).length, [flow]);

  // 從 staff 找出可能對應此環節的負責人（與總覽、時間軸一致）
  const findRespForRow = (row) => {
    const matched = matchStaffForRow(row, staff);
    return matched.map(s => s.name).join('、');
  };

  const exportWord = () => {
    const title = `${settings?.eventDate || ''} ${settings?.eventName || ''}${settings?.eventTheme || ''} 流程`.trim();
    const filename = `${(settings?.eventName || '活動')}_${(settings?.eventTheme || '流程')}.doc`.replace(/\s+/g, '');
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>流程</title><style>body{font-family:"微軟正黑體",sans-serif;padding:20px}h1{color:${settings?.primaryColor || '#F5B800'};text-align:center}.info{text-align:center;color:#6B7280;margin-bottom:20px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:${settings?.primaryColor || '#F5B800'};color:white;padding:8px;border:1px solid #ccc}td{padding:8px;border:1px solid #ccc;vertical-align:top;white-space:pre-wrap}tr:nth-child(even){background:#FFFBEA}.resp{color:#92400E;font-weight:bold}</style></head><body><h1>${title}</h1><p class="info">${settings?.eventLocation ? '地點：' + settings.eventLocation : ''}${settings?.nature ? '　' + settings.nature : ''}${settings?.dressCode ? '　Dress Code：' + settings.dressCode : ''}</p><table><thead><tr><th>時間</th><th>環節</th><th>負責夥伴</th><th>內容細節</th><th>音樂</th><th>抽獎禮品</th><th>份數</th><th>備註</th></tr></thead><tbody>${flow.map(r => {
      const resp = findRespForRow(r);
      return `<tr><td>${r.time || ''}</td><td><b>【${r.title || ''}】</b></td><td class="resp">${resp || '—'}</td><td>${r.detail || ''}</td><td>${r.music || ''}</td><td>${r.prize || ''}</td><td>${(Number(r.prizeQty) || 0) || ''}</td><td>${r.note || ''}</td></tr>`;
    }).join('')}</tbody></table></body></html>`;
    const b = new Blob(['\ufeff', html], { type: 'application/msword' });
    const u = URL.createObjectURL(b); const a = document.createElement('a');
    a.href = u; a.download = filename; a.click();
    URL.revokeObjectURL(u);
  };

  const exportXlsx = () => {
    const eventName = (settings?.eventName || '活動').trim();
    const theme = (settings?.eventTheme || '').trim();
    const filename = `${eventName}${theme ? '_' + theme : ''}_流程.xlsx`.replace(/\s+/g, '');
    const rows = flow.map((r, i) => {
      // 算每環節分鐘數
      let duration = '';
      if (r.time && r.time.includes('-')) {
        const [s, e] = r.time.split('-').map(x => x.trim());
        const [sh, sm] = s.split(':').map(Number);
        const [eh, em] = e.split(':').map(Number);
        if (![sh, sm, eh, em].some(isNaN)) {
          let d = (eh * 60 + em) - (sh * 60 + sm);
          if (d < 0) d += 24 * 60;
          duration = d + ' 分';
        }
      }
      return [i + 1, r.time || '', duration, r.title || '', findRespForRow(r) || '—', r.detail || '', r.music || '', r.prize || '', (Number(r.prizeQty) || 0) || '', r.note || ''];
    });
    rows.push([], ['', '總時長', `${Math.floor(totalMinutes / 60)} 時 ${totalMinutes % 60} 分`], ['', '抽獎合計', '', '', '', '', '', `${prizeItemCount} 項`, totalPrizeQty]);
    exportToXlsx(filename, [{
      name: '流程',
      columns: ['序', '時間', '時長', '環節', '負責夥伴', '內容細節', '音樂', '抽獎禮品', '份數', '備註'],
      rows,
      colWidths: [4, 12, 8, 18, 18, 30, 16, 18, 6, 20],
    }]);
  };

  return (
    <div>
      {/* 頂部工具列 */}
      <div className="flex items-center justify-between mb-3 gap-2">
        <div className="flex items-center gap-2 flex-wrap">
          <Calendar className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h2 className="text-lg font-bold">晚宴流程</h2>
          <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: '#FEF3C7', color: '#92400E' }}>{flow.length} 環節</span>
          <span className="text-xs px-2 py-0.5 rounded-full font-bold" style={{ background: '#DBEAFE', color: '#1E40AF' }}>
            共 {Math.floor(totalMinutes / 60)}時 {totalMinutes % 60}分（{totalMinutes} 分鐘）
          </span>
          {totalPrizeQty > 0 && (
            <span className="text-xs px-2 py-0.5 rounded-full font-bold text-white" style={{ background: 'linear-gradient(135deg, #F5B800, #DC2626)' }}>
              🎁 抽獎 {prizeItemCount} 項 / 共 {totalPrizeQty} 份
            </span>
          )}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportXlsx} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-yellow-50 transition" style={{ color: '#92400E', border: '1px solid #FCD34D' }}>
            <Download className="w-3.5 h-3.5" />Excel
          </button>
          <button onClick={exportWord} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-white text-xs font-medium shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            <Download className="w-3.5 h-3.5" />Word
          </button>
        </div>
      </div>
      {/* 活動起始時間設定 */}
      <div className="mb-3 p-3 rounded-xl flex items-center gap-3" style={{ background: '#FEF3C7', border: '1px solid #FCD34D' }}>
        <label className="text-sm font-bold flex items-center gap-1 shrink-0" style={{ color: '#92400E' }}>
          <Clock className="w-4 h-4" />活動起始時間
        </label>
        <input
          type="time"
          value={startTime}
          onChange={e => setStartTime(e.target.value)}
          className="px-3 py-1.5 rounded-lg border text-base font-mono outline-none focus:border-yellow-400"
          style={{ borderColor: '#FCD34D', colorScheme: 'light' }}
        />
        <span className="text-xs" style={{ color: '#92400E' }}>每環節只填分鐘數，時間自動串接</span>
      </div>
      <div className="text-xs mb-3 px-3 py-2 rounded-lg" style={{ background: '#DBEAFE', color: '#1E40AF' }}>
        💡 點卡片展開 → 只要改「分鐘數」，後面所有環節時間會自動順延重算
      </div>

      <div className="space-y-2">
        {flow.map((row, idx) => (
          <FlowCard key={row.id} row={row} idx={idx} total={flow.length}
            isEditing={editingId === row.id}
            isDragging={draggedId === row.id}
            isDragOver={dragOverId === row.id}
            onToggleEdit={() => setEditingId(editingId === row.id ? null : row.id)}
            onUpdate={updateRow} onSetDuration={setDuration} onAdd={addRow} onRemove={removeRow} onMoveUp={moveUp} onMoveDown={moveDown}
            onDragStart={(e) => { setDraggedId(row.id); e.dataTransfer.effectAllowed = 'move'; }}
            onDragOver={(e) => { e.preventDefault(); if (row.id !== draggedId) setDragOverId(row.id); }}
            onDragLeave={() => setDragOverId(null)}
            onDrop={(e) => {
              e.preventDefault();
              if (!draggedId || draggedId === row.id) { setDraggedId(null); setDragOverId(null); return; }
              const di = flow.findIndex(r => r.id === draggedId);
              const ti = flow.findIndex(r => r.id === row.id);
              const n = [...flow]; const [m] = n.splice(di, 1); n.splice(ti, 0, m);
              setFlow(n); setDraggedId(null); setDragOverId(null);
            }}
            onDragEnd={() => { setDraggedId(null); setDragOverId(null); }}
          />
        ))}
      </div>
    </div>
  );
}

function FlowCard({ row, idx, total, isEditing, isDragging, isDragOver, onToggleEdit, onUpdate, onSetDuration, onAdd, onRemove, onMoveUp, onMoveDown, onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd }) {
  // 計算此環節花幾分鐘
  const getDurationMin = () => {
    if (!row.time || !row.time.includes('-')) return null;
    const [s, e] = row.time.split('-').map(x => x.trim());
    if (!s || !e) return null;
    const [sh, sm] = s.split(':').map(Number);
    const [eh, em] = e.split(':').map(Number);
    if ([sh, sm, eh, em].some(isNaN)) return null;
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if (d < 0) d += 24 * 60;
    return d;
  };
  const durationMin = getDurationMin();

  return (
    <div draggable
      onDragStart={onDragStart} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop} onDragEnd={onDragEnd}
      className="bg-white rounded-xl shadow-sm border transition"
      style={{ borderColor: isDragOver ? '#F5B800' : '#FCD34D', borderWidth: isDragOver ? 2 : 1, opacity: isDragging ? 0.4 : 1, boxShadow: isDragOver ? '0 8px 16px -4px rgba(245, 184, 0, 0.3)' : undefined }}>
      {/* 摘要列 */}
      <button onClick={onToggleEdit} className="w-full flex items-start gap-2 p-3 text-left active:bg-yellow-50/50 transition">
        <div className="flex flex-col items-center cursor-grab active:cursor-grabbing pt-0.5 shrink-0">
          <GripVertical className="w-4 h-4" style={{ color: '#92400E' }} />
          <div className="text-[10px] mt-0.5 font-bold" style={{ color: '#92400E' }}>{idx + 1}</div>
        </div>
        <div className="shrink-0 w-14 text-center">
          <div className="text-[11px] font-mono text-gray-500 leading-tight">{(row.time || '').split('-')[0] || '—'}</div>
          <div className="text-[11px] font-mono text-gray-400 leading-tight">{(row.time || '').split('-')[1] || ''}</div>
          {durationMin !== null && (
            <div className="text-[10px] mt-0.5 px-1 rounded font-bold" style={{ background: '#FEF3C7', color: '#92400E' }}>{durationMin}分</div>
          )}
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-bold text-sm truncate" style={{ color: '#1F2937' }}>{row.title || '(未命名)'}</div>
          {row.host && row.host.trim() && (
            <div className="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full mt-0.5" style={{ background: '#FEF3C7', color: '#92400E', border: '1px solid #FCD34D' }}>🎤 {row.host}</div>
          )}
          {row.prize && row.prize.trim() && (
            <div className="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full mt-0.5 ml-1 text-white" style={{ background: 'linear-gradient(135deg, #F5B800, #DC2626)' }}>🎁 {row.prize}{row.prizeQty ? ` ×${row.prizeQty}` : ''}</div>
          )}
          {!isEditing && row.detail && <div className="text-xs text-gray-500 line-clamp-1 mt-0.5">{row.detail.split('\n')[0]}</div>}
        </div>
        <ChevronRight className="w-4 h-4 shrink-0 text-gray-400 transition-transform mt-1" style={{ transform: isEditing ? 'rotate(90deg)' : 'none' }} />
      </button>

      {/* 展開編輯區 */}
      {isEditing && (
        <div className="border-t" style={{ borderColor: '#FEF3C7' }}>
          <div className="p-3 space-y-3" style={{ background: '#FFFEF7' }}>
            <div>
              <label className="text-[10px] font-bold uppercase flex items-center gap-1" style={{ color: '#92400E' }}>
                <Clock className="w-3 h-3" />這個環節幾分鐘
              </label>
              <div className="flex items-center gap-2 mt-0.5">
                <input
                  type="number"
                  min="0"
                  value={row.duration ?? durationMin ?? ''}
                  onChange={e => onSetDuration(row.id, e.target.value)}
                  className="w-24 px-3 py-1.5 rounded-lg border text-base text-center font-bold outline-none focus:border-yellow-400"
                  style={{ borderColor: '#FCD34D' }}
                />
                <span className="text-sm" style={{ color: '#92400E' }}>分鐘</span>
                <span className="text-sm font-mono ml-2 px-2 py-1 rounded" style={{ background: '#FEF3C7', color: '#92400E' }}>
                  {row.time || '—'}
                </span>
              </div>
              <div className="text-[10px] mt-1 text-gray-500">⏱ 時間自動計算，改分鐘數後面環節會順延</div>
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>環節名稱</label>
              <input value={row.title} onChange={e => onUpdate(row.id, 'title', e.target.value)} placeholder="環節名稱" className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase flex items-center gap-1" style={{ color: '#92400E' }}>
                🎤 主持／負責人
              </label>
              <input value={row.host || ''} onChange={e => onUpdate(row.id, 'host', e.target.value)} placeholder="例如：芋頭（留空則自動依分工配對）" className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
              <div className="text-[10px] mt-0.5 text-gray-500">填了就以這裡為準，總覽和匯出都會顯示這個</div>
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>細節</label>
              <textarea value={row.detail} onChange={e => onUpdate(row.id, 'detail', e.target.value)} placeholder="細節安排及人員" rows={Math.max(3, row.detail.split('\n').length)} className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400 resize-none" style={{ borderColor: '#FCD34D' }} />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>音樂</label>
                <textarea value={row.music} onChange={e => onUpdate(row.id, 'music', e.target.value)} placeholder="音樂" rows={2} className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400 resize-none" style={{ borderColor: '#FCD34D' }} />
              </div>
              <div>
                <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>備註</label>
                <textarea value={row.note} onChange={e => onUpdate(row.id, 'note', e.target.value)} placeholder="備註 / 負責人" rows={2} className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400 resize-none" style={{ borderColor: '#FCD34D' }} />
              </div>
            </div>
            {/* 抽獎禮品 */}
            <div className="rounded-lg p-2" style={{ background: '#FEF3C7', border: '1px solid #FCD34D' }}>
              <label className="text-[10px] font-bold uppercase flex items-center gap-1" style={{ color: '#92400E' }}>🎁 此環節抽獎禮品</label>
              <div className="flex gap-2 mt-1">
                <input value={row.prize || ''} onChange={e => onUpdate(row.id, 'prize', e.target.value)} placeholder="禮品名稱（留空表示無）" className="flex-1 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
                <div className="flex items-center gap-1 shrink-0">
                  <input type="number" min="0" value={row.prizeQty ?? ''} onChange={e => onUpdate(row.id, 'prizeQty', e.target.value)} placeholder="0" className="w-16 px-2 py-1.5 rounded-lg border text-sm text-center outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
                  <span className="text-xs" style={{ color: '#92400E' }}>份</span>
                </div>
              </div>
            </div>
          </div>
          <div className="flex justify-end gap-1 px-2 py-2 border-t" style={{ borderColor: '#FEF3C7', background: '#FFFBEA' }}>
            <button onClick={() => onMoveUp(row.id)} disabled={idx === 0} className="p-2 rounded-lg hover:bg-yellow-100 active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed transition" aria-label="上移">
              <ChevronUp className="w-4 h-4" style={{ color: '#92400E' }} />
            </button>
            <button onClick={() => onMoveDown(row.id)} disabled={idx === total - 1} className="p-2 rounded-lg hover:bg-yellow-100 active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed transition" aria-label="下移">
              <ChevronDown className="w-4 h-4" style={{ color: '#92400E' }} />
            </button>
            <div className="flex-1"></div>
            <button onClick={() => onAdd(row.id)} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-yellow-100 active:scale-95 transition" style={{ color: '#92400E' }}>
              <Plus className="w-3.5 h-3.5" />新增環節
            </button>
            {total > 1 && (
              <button onClick={() => { if (confirm(`確定刪除「${row.title}」？`)) onRemove(row.id); }} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-50 active:scale-95 transition" style={{ color: '#DC2626' }}>
                <Trash2 className="w-3.5 h-3.5" />刪除
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ============== 報名繳費（卡片式） ==============
function RegistrationTab({ registrations, setRegistrations, budget, calc, settings }) {
  const [bulk, setBulk] = useState('');
  const [showBulk, setShowBulk] = useState(false);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all'); // all | paid | unpaid
  const [sortBy, setSortBy] = useState('group-asc'); // 預設：小組由小到大

  // #12 拖曳排序（只在 manual 模式生效）
  const { getDragProps, draggedId, dragOverId } = useDragSort(registrations, setRegistrations);

  const up = (id, f, v) => setRegistrations(registrations.map(r => r.id === id ? { ...r, [f]: v } : r));
  const add = () => {
    const newReg = { id: Date.now(), name: "", group: "", companions: 0, fee: budget.assumptions.perPerson, paid: false, note: "" };
    setRegistrations([newReg, ...registrations]);
  };
  const rm = (id) => setRegistrations(registrations.filter(r => r.id !== id));
  const togAll = (s) => setRegistrations(registrations.map(r => ({ ...r, paid: s })));

  const handleBulk = () => {
    const names = bulk.split(/[\n,，、]/).map(n => n.trim()).filter(Boolean);
    const news = names.map((name, i) => ({ id: Date.now() + i, name, group: "", companions: 0, fee: budget.assumptions.perPerson, paid: false, note: "" }));
    setRegistrations([...news, ...registrations]);
    setBulk(''); setShowBulk(false);
  };

  const stats = useMemo(() => {
    const tp = registrations.reduce((s, r) => s + 1 + (Number(r.companions) || 0), 0);
    const td = registrations.reduce((s, r) => s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)), 0);
    const tpd = registrations.reduce((s, r) => r.paid ? s + (Number(r.fee) || 0) * (1 + (Number(r.companions) || 0)) : s, 0);
    const pc = registrations.filter(r => r.paid).length;
    return { totalPeople: tp, totalDue: td, totalPaid: tpd, unpaid: td - tpd, paidCount: pc, unpaidCount: registrations.length - pc };
  }, [registrations]);

  const splitCalc = useMemo(() => {
    const c = budget.assumptions;
    const supposed = stats.totalDue + c.subsidyCap;
    const shortfall = Math.max(0, calc.expTotal - supposed);
    const extra = stats.totalPeople > 0 ? Math.ceil(shortfall / stats.totalPeople / 100) * 100 : 0;
    return { shortfall, extra };
  }, [stats, budget.assumptions, calc.expTotal]);

  const filtered = useMemo(() => {
    let list = registrations.filter(r => {
      if (filter === 'paid' && !r.paid) return false;
      if (filter === 'unpaid' && r.paid) return false;
      if (search && !r.name.includes(search) && !r.note.includes(search)) return false;
      return true;
    });
    // 排序
    if (sortBy !== 'manual') {
      list = [...list].sort((a, b) => {
        const aTotal = (Number(a.fee) || 0) * (1 + (Number(a.companions) || 0));
        const bTotal = (Number(b.fee) || 0) * (1 + (Number(b.companions) || 0));
        // 小組排序：把空小組排到最後
        const aGroup = (a.group || '').trim();
        const bGroup = (b.group || '').trim();
        const groupCmp = (asc) => {
          if (!aGroup && !bGroup) return 0;
          if (!aGroup) return 1; // 空的在後
          if (!bGroup) return -1;
          // 嘗試數字排序，若不是純數字則用字串
          const aNum = Number(aGroup);
          const bNum = Number(bGroup);
          if (!isNaN(aNum) && !isNaN(bNum)) return asc ? aNum - bNum : bNum - aNum;
          return asc ? aGroup.localeCompare(bGroup, 'zh-Hant') : bGroup.localeCompare(aGroup, 'zh-Hant');
        };
        switch (sortBy) {
          case 'group-asc': {
            const c = groupCmp(true);
            // 同組內按姓名
            return c !== 0 ? c : (a.name || '').localeCompare(b.name || '', 'zh-Hant');
          }
          case 'group-desc': {
            const c = groupCmp(false);
            return c !== 0 ? c : (a.name || '').localeCompare(b.name || '', 'zh-Hant');
          }
          case 'name-asc': return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
          case 'name-desc': return (b.name || '').localeCompare(a.name || '', 'zh-Hant');
          case 'total-desc': return bTotal - aTotal;
          case 'total-asc': return aTotal - bTotal;
          case 'paid-first': return (b.paid ? 1 : 0) - (a.paid ? 1 : 0);
          case 'unpaid-first': return (a.paid ? 1 : 0) - (b.paid ? 1 : 0);
          case 'newest': return (b.id || 0) - (a.id || 0);
          case 'oldest': return (a.id || 0) - (b.id || 0);
          default: return 0;
        }
      });
    }
    return list;
  }, [registrations, filter, search, sortBy]);

  const exportExcel = () => {
    const eventName = (settings?.eventName || '活動').trim();
    const theme = (settings?.eventTheme || '').trim();
    const filename = `${eventName}${theme ? '_' + theme : ''}_報名繳費.xlsx`.replace(/\s+/g, '');
    // 依小組由小到大排序（空小組排最後，同組內依姓名）
    const sorted = [...registrations].sort((a, b) => {
      const ag = (a.group || '').trim();
      const bg = (b.group || '').trim();
      if (!ag && !bg) return (a.name || '').localeCompare(b.name || '', 'zh-Hant');
      if (!ag) return 1;
      if (!bg) return -1;
      const an = Number(ag), bn = Number(bg);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      const c = ag.localeCompare(bg, 'zh-Hant');
      return c !== 0 ? c : (a.name || '').localeCompare(b.name || '', 'zh-Hant');
    });
    const rows = sorted.map((r, i) => {
      const fee = Number(r.fee) || 0;
      const comp = Number(r.companions) || 0;
      const total = fee * (1 + comp);
      const payMethodLabel = r.payMethod === 'cash' ? '現金' : r.payMethod === 'linepay' ? 'LinePay' : r.payMethod === 'transfer' ? '轉帳' : '';
      return [i + 1, r.group || '', r.name || '', comp, 1 + comp, fee, total, r.paid ? '已繳' : '未繳', payMethodLabel, r.note || ''];
    });
    rows.push([], ['', '【統計】'], ['', '', '總人數', '', stats.totalPeople], ['', '', '應收', '', '', '', stats.totalDue], ['', '', '已收', '', '', '', stats.totalPaid], ['', '', '未收', '', '', '', stats.unpaid]);
    exportToXlsx(filename, [{
      name: '報名繳費',
      columns: ['序', '小組', '姓名', '攜伴數', '總人數', '單價', '應繳金額', '繳費狀態', '繳費方式', '備註'],
      rows,
      colWidths: [5, 8, 14, 8, 8, 10, 12, 10, 12, 30],
    }]);
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2">
          <ClipboardList className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h2 className="text-lg font-bold">報名繳費</h2>
          <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: '#FEF3C7', color: '#92400E' }}>{registrations.length}</span>
        </div>
        <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-white text-xs font-medium shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
          <Download className="w-3.5 h-3.5" />Excel
        </button>
      </div>

      {/* 統計卡（2x2） */}
      <div className="grid grid-cols-2 gap-2">
        <div className="bg-white rounded-xl p-3 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
          <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase" style={{ color: '#0891B2' }}>
            <Users className="w-3 h-3" />報名人數
          </div>
          <div className="text-2xl font-bold mt-0.5" style={{ color: '#0891B2' }}>{stats.totalPeople}</div>
          <div className="text-[10px] text-gray-500">含 {stats.totalPeople - registrations.length} 攜伴</div>
        </div>
        <div className="bg-white rounded-xl p-3 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
          <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase" style={{ color: '#F5B800' }}>
            <CircleDollarSign className="w-3 h-3" />應收
          </div>
          <div className="text-2xl font-bold mt-0.5" style={{ color: '#F5B800' }}>${fmt(stats.totalDue)}</div>
        </div>
        <div className="bg-white rounded-xl p-3 shadow-sm border-2" style={{ borderColor: '#10B981' }}>
          <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase" style={{ color: '#059669' }}>
            <CheckCircle2 className="w-3 h-3" />已收
          </div>
          <div className="text-2xl font-bold mt-0.5" style={{ color: '#059669' }}>${fmt(stats.totalPaid)}</div>
          <div className="text-[10px] text-gray-500">{stats.paidCount} 位</div>
        </div>
        <div className="bg-white rounded-xl p-3 shadow-sm border-2" style={{ borderColor: '#DC2626' }}>
          <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase" style={{ color: '#DC2626' }}>
            <Circle className="w-3 h-3" />未收
          </div>
          <div className="text-2xl font-bold mt-0.5" style={{ color: '#DC2626' }}>${fmt(stats.unpaid)}</div>
          <div className="text-[10px] text-gray-500">{stats.unpaidCount} 位待催</div>
        </div>
      </div>

      {/* 分攤警示 */}
      {splitCalc.shortfall > 0 && (
        <div className="rounded-xl p-3 border-2" style={{ borderColor: '#F59E0B', background: 'linear-gradient(135deg, #FEF3C7, #FDE68A)' }}>
          <div className="flex items-start gap-2">
            <AlertCircle className="w-4 h-4 shrink-0 mt-0.5" style={{ color: '#D97706' }} />
            <div className="flex-1 text-xs">
              <div className="font-bold mb-1" style={{ color: '#92400E' }}>經費尚缺 ${fmt(splitCalc.shortfall)}</div>
              <div style={{ color: '#78350F' }}>建議每人加收 <b style={{ color: '#DC2626' }}>+${fmt(splitCalc.extra)}</b></div>
            </div>
          </div>
        </div>
      )}

      {/* 操作列 */}
      <div className="flex gap-2 flex-wrap">
        <button onClick={add} className="flex-1 flex items-center justify-center gap-1 px-3 py-2.5 rounded-xl text-sm font-bold text-white shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
          <Plus className="w-4 h-4" />新增報名
        </button>
        <button onClick={() => setShowBulk(!showBulk)} className="px-3 py-2.5 rounded-xl text-sm font-medium border active:scale-95 transition" style={{ borderColor: '#F5B800', color: '#92400E' }}>
          批次
        </button>
      </div>

      {showBulk && (
        <div className="bg-white rounded-xl p-3 border" style={{ borderColor: '#FCD34D' }}>
          <textarea value={bulk} onChange={e => setBulk(e.target.value)} placeholder="一行一個名字，或用逗號分隔" rows={3} className="w-full px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
          <div className="flex gap-2 mt-2">
            <button onClick={handleBulk} disabled={!bulk.trim()} className="flex-1 px-3 py-2 rounded-lg text-white text-sm font-bold disabled:opacity-40 active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>加入</button>
            <button onClick={() => { setShowBulk(false); setBulk(''); }} className="px-3 py-2 rounded-lg text-sm border" style={{ borderColor: '#E5E7EB' }}>取消</button>
          </div>
        </div>
      )}

      {/* 搜尋 + 過濾 */}
      {registrations.length > 0 && (
        <>
          <div className="relative">
            <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="搜尋姓名或備註" className="w-full pl-9 pr-3 py-2 rounded-xl border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D', background: 'white' }} />
          </div>
          <div className="flex gap-1 overflow-x-auto">
            {[
              { id: 'all', label: `全部 (${registrations.length})` },
              { id: 'paid', label: `✓ 已繳 (${stats.paidCount})` },
              { id: 'unpaid', label: `⏳ 未繳 (${stats.unpaidCount})` },
            ].map(f => (
              <button key={f.id} onClick={() => setFilter(f.id)} className="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium transition"
                style={{ background: filter === f.id ? '#F5B800' : 'white', color: filter === f.id ? 'white' : '#92400E', border: `1px solid ${filter === f.id ? '#F5B800' : '#FCD34D'}` }}>
                {f.label}
              </button>
            ))}
          </div>
          {/* 排序選單 */}
          <div className="flex items-center gap-2">
            <span className="text-xs shrink-0" style={{ color: '#92400E' }}>排序：</span>
            <select value={sortBy} onChange={e => setSortBy(e.target.value)}
              className="flex-1 px-3 py-1.5 rounded-lg border text-xs outline-none focus:border-yellow-400"
              style={{ borderColor: '#FCD34D', background: 'white', color: '#92400E' }}>
              <option value="group-asc">小組由小到大</option>
              <option value="group-desc">小組由大到小</option>
              <option value="manual">手動排序（可拖曳）</option>
              <option value="name-asc">姓名 A → Z</option>
              <option value="name-desc">姓名 Z → A</option>
              <option value="total-desc">金額由高到低</option>
              <option value="total-asc">金額由低到高</option>
              <option value="unpaid-first">未繳優先</option>
              <option value="paid-first">已繳優先</option>
              <option value="newest">最新加入優先</option>
              <option value="oldest">最早加入優先</option>
            </select>
          </div>
        </>
      )}

      {/* 報名卡片列表 */}
      {registrations.length === 0 ? (
        <div className="bg-white rounded-2xl p-8 text-center border" style={{ borderColor: '#FCD34D' }}>
          <ClipboardList className="w-12 h-12 mx-auto mb-2 opacity-30" style={{ color: '#92400E' }} />
          <div className="text-sm text-gray-500 mb-3">尚未有報名記錄</div>
        </div>
      ) : filtered.length === 0 ? (
        <div className="bg-white rounded-xl p-6 text-center border" style={{ borderColor: '#FCD34D' }}>
          <div className="text-sm text-gray-500">沒有符合條件的項目</div>
        </div>
      ) : (
        <div className="space-y-2">
          {filtered.map((r, idx) => <RegCard key={r.id} reg={r} onUpdate={up} onRemove={rm}
            dragProps={sortBy === 'manual' ? getDragProps(r.id) : {}}
            isDragging={sortBy === 'manual' && draggedId === r.id}
            isDragOver={sortBy === 'manual' && dragOverId === r.id} />)}
        </div>
      )}
    </div>
  );
}

function RegCard({ reg, onUpdate, onRemove, dragProps = {}, isDragging = false, isDragOver = false }) {
  const [expanded, setExpanded] = useState(false);
  const fee = Number(reg.fee) || 0;
  const comp = Number(reg.companions) || 0;
  const total = fee * (1 + comp);

  return (
    <div {...dragProps} className="bg-white rounded-xl shadow-sm border transition" style={{ borderColor: isDragOver ? '#F5B800' : (reg.paid ? '#10B981' : '#FCD34D'), borderWidth: isDragOver ? 2 : (reg.paid ? 2 : 1), opacity: isDragging ? 0.4 : 1 }}>
      <div className="flex items-center gap-2 p-3">
        <GripVertical className="w-4 h-4 cursor-grab shrink-0" style={{ color: '#D1D5DB' }} />
        {/* 繳費勾選（大按鈕） */}
        <button onClick={() => onUpdate(reg.id, 'paid', !reg.paid)} className="shrink-0 p-1 active:scale-90 transition" aria-label={reg.paid ? '已繳' : '未繳'}>
          {reg.paid
            ? <CheckCircle2 className="w-8 h-8" style={{ color: '#059669' }} />
            : <Circle className="w-8 h-8" style={{ color: '#D1D5DB' }} />
          }
        </button>
        <button onClick={() => setExpanded(!expanded)} className="flex-1 text-left min-w-0 active:bg-gray-50/50 rounded-lg p-1 -m-1 transition">
          <div className="flex items-center gap-1.5">
            {reg.group && (
              <span className="shrink-0 px-1.5 py-0.5 rounded text-[10px] font-bold" style={{ background: '#3B82F6', color: 'white' }}>
                {reg.group}組
              </span>
            )}
            <input value={reg.name} onChange={e => onUpdate(reg.id, 'name', e.target.value)} onClick={e => e.stopPropagation()} placeholder="姓名" className="flex-1 min-w-0 font-bold bg-transparent outline-none border-b border-transparent focus:border-yellow-400 transition" style={{ color: '#1F2937' }} />
          </div>
          <div className="flex items-center gap-2 text-xs mt-0.5 flex-wrap">
            <span className="text-gray-500">{1 + comp} 人</span>
            <span className="font-bold" style={{ color: reg.paid ? '#059669' : '#92400E' }}>${fmt(total)}</span>
            {reg.payMethod && (
              <span className="px-1.5 py-0.5 rounded-full text-[10px] font-medium" style={{ background: '#FEF3C7', color: '#92400E' }}>
                {reg.payMethod === 'cash' ? '💵 現金' : reg.payMethod === 'linepay' ? '📱 LinePay' : '🏦 轉帳'}
              </span>
            )}
            {reg.note && <span className="text-gray-400 truncate">· {reg.note}</span>}
          </div>
        </button>
        <button onClick={() => setExpanded(!expanded)} className="shrink-0 p-1">
          <ChevronRight className="w-4 h-4 text-gray-400 transition-transform" style={{ transform: expanded ? 'rotate(90deg)' : 'none' }} />
        </button>
      </div>

      {expanded && (
        <div className="border-t p-3 space-y-2" style={{ borderColor: '#FEF3C7', background: '#FFFEF7' }}>
          <div>
            <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>小組組別</label>
            <input value={reg.group || ''} onChange={e => onUpdate(reg.id, 'group', e.target.value)} placeholder="例：1、2、A、B" className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
          </div>
          <div className="grid grid-cols-3 gap-2">
            <div>
              <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>攜伴</label>
              <input type="number" min="0" value={reg.companions} onChange={e => onUpdate(reg.id, 'companions', e.target.value)} className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm text-center outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>單價</label>
              <input type="number" value={reg.fee} onChange={e => onUpdate(reg.id, 'fee', e.target.value)} className="w-full mt-0.5 px-2 py-1.5 rounded-lg border text-sm text-right outline-none focus:border-yellow-400" style={{ borderColor: '#FCD34D' }} />
            </div>
            <div>
              <label className="text-[10px] font-bold uppercase" style={{ color: '#92400E' }}>總計</label>
              <div className="mt-0.5 px-2 py-1.5 rounded-lg text-sm text-right font-bold" style={{ background: '#FEF3C7', color: '#92400E' }}>{fmt(total)}</div>

// ============== 得獎名單（卡片式） ==============
function AwardsTab({ awards, setAwards }) {
  const up = (i, f, v) => setAwards(awards.map((a, x) => x === i ? { ...a, [f]: v } : a));
  const add = (cat) => setAwards([...awards, { category: cat, name: "新獎項", winner: "", note: "" }]);
  const rm = (i) => setAwards(awards.filter((_, x) => x !== i));

  // #12 拖曳：在組內調整順序，直接操作 awards 陣列
  const [draggedIdx, setDraggedIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);
  const getDragProps = (idx) => ({
    draggable: true,
    onDragStart: () => setDraggedIdx(idx),
    onDragOver: (e) => { e.preventDefault(); if (draggedIdx !== idx) setDragOverIdx(idx); },
    onDragLeave: () => setDragOverIdx(null),
    onDrop: (e) => {
      e.preventDefault();
      if (draggedIdx == null || draggedIdx === idx) { setDraggedIdx(null); setDragOverIdx(null); return; }
      // 只允許同類別內拖曳
      if (awards[draggedIdx]?.category !== awards[idx]?.category) {
        setDraggedIdx(null); setDragOverIdx(null); return;
      }
      const next = [...awards];
      const [moved] = next.splice(draggedIdx, 1);
      next.splice(idx, 0, moved);
      setAwards(next);
      setDraggedIdx(null); setDragOverIdx(null);
    },
    onDragEnd: () => { setDraggedIdx(null); setDragOverIdx(null); },
  });

  const grouped = useMemo(() => {
    const m = {};
    awards.forEach((a, i) => { if (!m[a.category]) m[a.category] = []; m[a.category].push({ ...a, _idx: i }); });
    const o = {};
    AWARD_CATEGORY_ORDER.forEach(c => { if (m[c]) o[c] = m[c]; });
    Object.keys(m).forEach(c => { if (!o[c]) o[c] = m[c]; });
    return o;
  }, [awards]);

  const colors = {
    '造型走秀': { bg: '#FEF3C7', border: '#F59E0B', text: '#92400E' },
    '業績類': { bg: '#DBEAFE', border: '#3B82F6', text: '#1E40AF' },
    '全勤獎': { bg: '#D1FAE5', border: '#10B981', text: '#065F46' },
    '金拖鞋獎': { bg: '#FCE7F3', border: '#EC4899', text: '#9F1239' },
    '其他獎項': { bg: '#F3F4F6', border: '#9CA3AF', text: '#374151' },
  };

  const filled = awards.filter(a => a.winner.trim()).length;
  const pct = awards.length > 0 ? Math.round((filled / awards.length) * 100) : 0;

  const exportExcel = () => {
    const filename = `得獎名單_${new Date().toISOString().slice(0, 10)}.xlsx`;
    const rows = [];
    Object.entries(grouped).forEach(([cat, items]) => {
      items.forEach((it, i) => rows.push([cat, i + 1, it.name, it.winner, it.note]));
    });
    exportToXlsx(filename, [{
      name: '得獎名單',
      columns: ['類別', '序', '獎項名稱', '得獎者', '備註'],
      rows,
      colWidths: [12, 5, 24, 16, 30],
    }]);
  };

  // 重新命名整個類別（同步更新該類別所有獎項的 category）
  const renameCategory = (oldName, newName) => {
    const n = (newName || '').trim();
    if (!n) return;
    if (n === oldName) return;
    setAwards(awards.map(a => a.category === oldName ? { ...a, category: n } : a));
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Trophy className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h2 className="text-lg font-bold">得獎名單</h2>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-yellow-50 transition" style={{ color: '#92400E', border: '1px solid #FCD34D' }}>
            <Download className="w-3.5 h-3.5" />匯出 Excel
          </button>
          <div className="text-xs font-bold" style={{ color: '#92400E' }}>{filled}/{awards.length}</div>
          <div className="w-20 h-2 rounded-full overflow-hidden" style={{ background: '#FEF3C7' }}>
            <div className="h-full" style={{ width: `${pct}%`, background: 'linear-gradient(90deg, #F5B800, #FF9F1C)' }}></div>
          </div>
        </div>
      </div>

      <div className="text-xs px-3 py-2 rounded-lg" style={{ background: '#DBEAFE', color: '#1E40AF' }}>
        💡 點擊類別名稱可以修改（會同步更新該類別所有獎項）
      </div>

      {Object.entries(grouped).map(([cat, items]) => {
        const c = colors[cat] || colors['其他獎項'];
        return (
          <section key={cat} className="bg-white rounded-2xl shadow-sm border overflow-hidden" style={{ borderColor: c.border }}>
            <div className="px-3 py-2 flex items-center justify-between" style={{ background: c.bg }}>
              <div className="flex items-center gap-2 flex-1 min-w-0">
                <Award className="w-4 h-4 shrink-0" style={{ color: c.text }} />
                <input
                  defaultValue={cat}
                  onBlur={e => renameCategory(cat, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                  className="font-bold text-sm bg-transparent outline-none border-b min-w-0 flex-1 px-1 py-0.5 rounded transition"
                  style={{ color: c.text, borderColor: 'rgba(0,0,0,0.15)', cursor: 'text' }}
                  onMouseEnter={e => e.target.style.background = 'rgba(255,255,255,0.5)'}
                  onMouseLeave={e => e.target.style.background = 'transparent'}
                  title="點擊可修改類別名稱"
                />
                <span className="text-[10px] shrink-0 opacity-60" style={{ color: c.text }}>✏️</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full shrink-0" style={{ background: 'white', color: c.text }}>{items.length}</span>
              </div>
              <button onClick={() => add(cat)} className="flex items-center gap-1 px-2 py-0.5 rounded text-xs hover:bg-white/50 transition shrink-0" style={{ color: c.text }}>
                <Plus className="w-3 h-3" />新增
              </button>
            </div>
            <div className="divide-y" style={{ borderColor: c.bg }}>
              {items.map(item => <AwardCard key={item._idx} item={item} onUpdate={up} onRemove={rm} dragProps={getDragProps(item._idx)} isDragging={draggedIdx === item._idx} isDragOver={dragOverIdx === item._idx} />)}
            </div>
          </section>
        );
      })}

      <button onClick={() => add('新類別')} className="w-full py-3 rounded-xl border-2 border-dashed text-sm hover:bg-yellow-50 transition" style={{ borderColor: '#FCD34D', color: '#92400E' }}>
        <Plus className="w-4 h-4 inline mr-1" />新增獎項類別
      </button>
    </div>
  );
}

function SponsorshipsTab({ sponsorships, setSponsorships }) {
  const add = () => setSponsorships([...sponsorships, { id: Date.now(), name: '', qty: 1, value: 0, sponsor: '', note: '' }]);
  const up = (id, f, v) => setSponsorships(sponsorships.map(s => s.id === id ? { ...s, [f]: v } : s));
  const rm = (id) => setSponsorships(sponsorships.filter(s => s.id !== id));

  // 拖曳
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const getDragProps = (id) => ({
    draggable: true,
    onDragStart: () => setDraggedId(id),
    onDragOver: (e) => { e.preventDefault(); if (draggedId !== id) setDragOverId(id); },
    onDragLeave: () => setDragOverId(null),
    onDrop: (e) => {
      e.preventDefault();
      if (draggedId == null || draggedId === id) { setDraggedId(null); setDragOverId(null); return; }
      const from = sponsorships.findIndex(x => x.id === draggedId);
      const to = sponsorships.findIndex(x => x.id === id);
      if (from === -1 || to === -1) return;
      const next = [...sponsorships];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      setSponsorships(next);
      setDraggedId(null); setDragOverId(null);
    },
    onDragEnd: () => { setDraggedId(null); setDragOverId(null); },
  });

  // 統計
  const totalQty = sponsorships.reduce((s, x) => s + (Number(x.qty) || 0), 0);
  const totalValue = sponsorships.reduce((s, x) => s + (Number(x.qty) || 0) * (Number(x.value) || 0), 0);
  const totalSponsors = new Set(sponsorships.filter(s => s.sponsor?.trim()).map(s => s.sponsor.trim())).size;

  const exportExcel = () => {
    const filename = `贊助禮品名單_${new Date().toISOString().slice(0, 10)}.xlsx`;
    const rows = sponsorships.map((s, i) => {
      const qty = Number(s.qty) || 0;
      const value = Number(s.value) || 0;
      return [i + 1, s.name || '', qty, value, qty * value, s.sponsor || '', s.note || ''];
    });
    rows.push([], ['', '【統計】'], ['', '總項數', sponsorships.length], ['', '總數量', totalQty], ['', '總價值', '', '', totalValue], ['', '贊助人數', totalSponsors]);
    exportToXlsx(filename, [{
      name: '贊助禮品',
      columns: ['序', '禮品名稱', '數量', '單價', '總價值', '贊助人', '備註'],
      rows,
      colWidths: [5, 22, 8, 10, 12, 18, 24],
    }]);
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Gift className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h2 className="text-lg font-bold">贊助禮品</h2>
        </div>
        {sponsorships.length > 0 && (
          <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-yellow-50 transition" style={{ color: '#92400E', border: '1px solid #FCD34D' }}>
            <Download className="w-3.5 h-3.5" />匯出 Excel
          </button>
        )}
      </div>

      {/* 統計卡 */}
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-white rounded-xl p-3 border text-center" style={{ borderColor: '#FCD34D' }}>
          <div className="text-[10px] text-gray-500">總項數</div>
          <div className="text-xl font-bold" style={{ color: '#92400E' }}>{sponsorships.length}</div>
        </div>
        <div className="bg-white rounded-xl p-3 border text-center" style={{ borderColor: '#FCD34D' }}>
          <div className="text-[10px] text-gray-500">總數量</div>
          <div className="text-xl font-bold" style={{ color: '#92400E' }}>{totalQty}</div>
        </div>
        <div className="bg-white rounded-xl p-3 border text-center" style={{ borderColor: '#FCD34D' }}>
          <div className="text-[10px] text-gray-500">總價值</div>
          <div className="text-xl font-bold" style={{ color: '#F5B800' }}>${fmt(totalValue)}</div>
        </div>
      </div>
      <div className="text-xs text-gray-500 text-center">
        共 {totalSponsors} 位贊助人
      </div>

      {/* 列表 */}
      {sponsorships.length === 0 ? (
        <div className="bg-white rounded-2xl p-8 text-center border" style={{ borderColor: '#FCD34D' }}>
          <Gift className="w-12 h-12 mx-auto mb-2 opacity-30" style={{ color: '#92400E' }} />
          <div className="text-sm text-gray-500 mb-3">尚未登錄任何贊助禮品</div>
          <button onClick={add} className="px-4 py-2 rounded-lg text-white font-medium text-sm" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
            <Plus className="w-4 h-4 inline mr-1" />新增第一筆
          </button>
        </div>
      ) : (
        <div className="space-y-2">
          {sponsorships.map(s => (
            <SponsorshipCard key={s.id} item={s} onUpdate={up} onRemove={rm}
              dragProps={getDragProps(s.id)}
              isDragging={draggedId === s.id}
              isDragOver={dragOverId === s.id} />
          ))}
        </div>
      )}

      <button onClick={add} className="w-full py-3 rounded-xl border-2 border-dashed text-sm hover:bg-yellow-50 transition" style={{ borderColor: '#FCD34D', color: '#92400E' }}>
        <Plus className="w-4 h-4 inline mr-1" />新增贊助禮品
      </button>
    </div>
  );
}

    onDragOver: (e) => { e.preventDefault(); if (draggedIdx !== idx) setDragOverIdx(idx); },
    onDragLeave: () => setDragOverIdx(null),
    onDrop: (e) => {
      e.preventDefault();
      if (draggedIdx == null || draggedIdx === idx) { setDraggedIdx(null); setDragOverIdx(null); return; }
      const next = [...staff];
      const [moved] = next.splice(draggedIdx, 1);
      next.splice(idx, 0, moved);
      setStaff(next);
      setDraggedIdx(null); setDragOverIdx(null);
    },
    onDragEnd: () => { setDraggedIdx(null); setDragOverIdx(null); },
  });

  const exportExcel = () => {
    const filename = `工作分工_${new Date().toISOString().slice(0, 10)}.xlsx`;
    const rows = staff.map((s, i) => [i + 1, s.role || '', s.name || '', s.phone || '', s.responsibility || '']);
    rows.push([], ['', '【統計】'], ['', '總角色數', staff.length], ['', '已指派', filled], ['', '未指派', staff.length - filled]);
    exportToXlsx(filename, [{
      name: '工作分工',
      columns: ['序', '角色', '負責人', '電話', '工作內容'],
      rows,
      colWidths: [5, 20, 14, 14, 40],
    }]);
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <UserCheck className="w-5 h-5" style={{ color: '#F5B800' }} />

        </div>
        <div className="flex items-center gap-2">
          <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-yellow-50 transition" style={{ color: '#92400E', border: '1px solid #FCD34D' }}>
            <Download className="w-3.5 h-3.5" />匯出 Excel
          </button>
          <div className="text-xs font-bold" style={{ color: '#92400E' }}>{filled}/{staff.length}</div>
          <div className="w-20 h-2 rounded-full overflow-hidden" style={{ background: '#FEF3C7' }}>

          </div>

      <div className="space-y-2">

function BudgetTab({ budget, setBudget, calc, settings }) {
  const ua = (k, v) => setBudget({ ...budget, assumptions: { ...budget.assumptions, [k]: Number(v) || 0 } });
  const ue = (idx, f, v) => {
    const n = budget.expenses.map((e, i) => {
      if (i !== idx) return e;
      if (f === 'qty' || f === 'price') {
        const nv = Number(v);
        return { ...e, [f]: !isNaN(nv) && v !== '' && !v.startsWith?.('=') ? nv : v };
      }
      return { ...e, [f]: v };
    });
    setBudget({ ...budget, expenses: n });
  };
  const addE = () => setBudget({ ...budget, expenses: [...budget.expenses, { name: "新項目", qty: 1, unit: "式", price: 0, lastYear: 0, note: "" }] });
  const rmE = (i) => setBudget({ ...budget, expenses: budget.expenses.filter((_, x) => x !== i) });

  const exportExcel = () => {
    const c = budget.assumptions;
    const title = `${settings?.eventName || ''}${settings?.eventTheme || ''} 收支預算表`.trim();
    const filename = `${(settings?.eventName || '活動')}_${(settings?.eventTheme || '')}_預算表.xls`.replace(/\s+/g, '');
    const rows = [
      [title],
      [`日期：${settings?.eventDate || ''}　${c.tables} 桌 ${c.tables * c.perTable} 人`], [],
      ['【關鍵假設】'],
      ['桌數', c.tables], ['每桌人數', c.perTable], ['每人收費', c.perPerson], ['每桌餐費', c.tableCost], ['補貼上限', c.subsidyCap], [],
      ['【支出明細】'],
      ['項目', '數量', '單位', '單價', '總價', '歷史對照', '備註'],
      ...calc.expensesWithTotal.map(e => [e.name, e._qty, e.unit, e._price, e._total, e.lastYear, e.note]),
      ['', '', '', '總計', calc.expTotal], [],
      ['【結算】'], ['報名費收入', calc.income], ['支出總計', calc.expTotal], ['缺口', calc.gap], ['結餘', calc.balance],
    ];
    const t = rows.map(r => r.map(x => x ?? '').join('\t')).join('\n');
    const b = new Blob(['\ufeff' + t], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const u = URL.createObjectURL(b); const a = document.createElement('a');
    a.href = u; a.download = filename; a.click();
    URL.revokeObjectURL(u);
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <DollarSign className="w-5 h-5" style={{ color: '#F5B800' }} />
          <h2 className="text-lg font-bold">預算</h2>
        </div>
        <button onClick={exportExcel} className="flex items-center gap-1 px-3 py-1.5 rounded-lg text-white text-xs font-medium shadow-sm active:scale-95 transition" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
          <Download className="w-3.5 h-3.5" />Excel
        </button>
      </div>

      {/* 關鍵假設 - 可摺疊 */}
      <details className="bg-white rounded-2xl shadow-sm border" style={{ borderColor: '#FCD34D' }} open>
        <summary className="px-3 py-2.5 font-bold text-sm cursor-pointer flex items-center justify-between" style={{ color: '#1F2937' }}>
          <span className="flex items-center gap-2"><Users className="w-4 h-4" style={{ color: '#F5B800' }} />關鍵假設</span>
          <span className="text-[10px] font-normal px-2 py-0.5 rounded-full" style={{ background: '#DBEAFE', color: '#1E40AF' }}>改數字即時更新</span>
        </summary>
        <div className="px-3 pb-3 pt-1 grid grid-cols-2 gap-2">
          <AC label="桌數" value={budget.assumptions.tables} unit="桌" onChange={v => ua('tables', v)} />
          <AC label="每桌人數" value={budget.assumptions.perTable} unit="人" onChange={v => ua('perTable', v)} />
          <AC label="每人收費" value={budget.assumptions.perPerson} unit="元" onChange={v => ua('perPerson', v)} />
          <AC label="每桌餐費" value={budget.assumptions.tableCost} unit="元" onChange={v => ua('tableCost', v)} />
          <AC label="補貼上限" value={budget.assumptions.subsidyCap} unit="元" onChange={v => ua('subsidyCap', v)} highlight span2 />
        </div>
      </details>

      {/* 結算摘要（2x2） */}
      <div className="grid grid-cols-2 gap-2">
        <SC label="支出" value={calc.expTotal} color="#DC2626" />
        <SC label="收入" value={calc.income} color="#0891B2" />
        <SC label="缺口" value={calc.gap} color="#D97706" />
        <SC label="結餘" value={calc.balance} color={calc.balance >= 0 ? "#059669" : "#DC2626"} highlight />
      </div>

      {/* 支出明細（卡片式） */}
      <section className="bg-white rounded-2xl shadow-sm border overflow-hidden" style={{ borderColor: '#FCD34D' }}>
        <div className="px-3 py-2.5 border-b flex items-center justify-between" style={{ borderColor: '#FEF3C7', background: '#FFFBEA' }}>
          <h3 className="font-bold text-sm">支出明細（{budget.expenses.length}）</h3>
          <button onClick={addE} className="flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-medium hover:bg-yellow-100" style={{ color: '#92400E' }}>
            <Plus className="w-3.5 h-3.5" />新增
          </button>
        </div>
        <div className="divide-y" style={{ borderColor: '#FEF3C7' }}>
          {calc.expensesWithTotal.map((e, i) => <BudgetCard key={i} expense={e} idx={i} onUpdate={ue} onRemove={rmE} />)}
        </div>
        <div className="p-3 border-t text-right" style={{ borderColor: '#FEF3C7', background: '#FEF3C7' }}>
          <div className="text-xs mb-0.5" style={{ color: '#92400E' }}>支出總計</div>
          <div className="text-xl font-bold" style={{ color: '#DC2626' }}>${fmt(calc.expTotal)}</div>
        </div>
      </section>

      <div className="text-[10px] text-gray-500 px-2">
        💡 公式範例：<code className="px-1 rounded" style={{ background: '#FEF3C7' }}>{'={tables}'}</code>
        <code className="px-1 rounded ml-1" style={{ background: '#FEF3C7' }}>{'=CEIL({tables}*0.8)'}</code>
      </div>
    </div>
  );
}

// ============== #3 走秀自助報名頁（公開，無需登入） ==============
function SignupPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [myName, setMyName] = useState('');
  const [myStyle, setMyStyle] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [justSubmitted, setJustSubmitted] = useState(false);

  // 載入資料
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) setData(JSON.parse(r.value));
      } catch (e) {}
      setLoading(false);
    })();
    // 每 3 秒更新一次
    const t = setInterval(async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) setData(JSON.parse(r.value));
      } catch (e) {}
    }, 3000);
    return () => clearInterval(t);
  }, []);

  const submit = async () => {
    if (!myName.trim()) { alert('請輸入您的姓名'); return; }
    if (!data) return;
    if (data.signupClosed) { alert('報名已截止，無法再報名'); return; }
    const contestants = data.contestants || [];
    if (contestants.length >= RUNWAY_SIGNUP_LIMIT) { alert(`報名已額滿（限 ${RUNWAY_SIGNUP_LIMIT} 組）`); return; }
    // 檢查姓名是否已報名（避免重複）
    if (contestants.some(c => c.name === myName.trim())) {
      alert(`「${myName.trim()}」已經報名了`);
      return;
    }
    // 自動分配號碼
    const maxNum = contestants.reduce((m, c) => Math.max(m, Number(c.number) || 0), 0);
    const newContestant = {
      id: Date.now(),
      number: maxNum + 1,
      name: myName.trim(),
      style: myStyle.trim(),
    };
    const newData = { ...data, contestants: [...contestants, newContestant] };
    await window.storage.set('fule_yellow_party_v7', JSON.stringify(newData), true);
    setData(newData);
    setSubmitted(true);
    setJustSubmitted(true);
    setTimeout(() => setJustSubmitted(false), 2000);
  };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: '#FFFBEA' }}>
      <Loader2 className="w-8 h-8 animate-spin" style={{ color: '#F5B800' }} />
    </div>;
  }

  const settings = data?.settings || {};
  const contestants = data?.contestants || [];

  return (
    <div className="min-h-screen pb-8" style={{ background: 'linear-gradient(180deg, #FFFBEA 0%, #FEF3C7 100%)' }}>
      {/* Header */}
      <header className="px-4 py-3 shadow-sm" style={{ background: 'white', borderBottom: '1px solid #FCD34D' }}>
        <div className="max-w-xl mx-auto flex items-center gap-2">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>走</div>
          <div className="flex-1">
            <div className="font-bold text-sm" style={{ color: '#1F2937' }}>{settings?.eventName || '活動'}</div>
            <div className="text-xs" style={{ color: '#92400E' }}>走秀自助報名</div>
          </div>
        </div>
      </header>

      <div className="max-w-xl mx-auto p-4 space-y-4">
        {submitted ? (
          <div className="rounded-2xl p-6 text-center shadow-lg" style={{ background: 'linear-gradient(135deg, #10B981, #059669)', color: 'white' }}>
            {justSubmitted && <div className="text-5xl mb-2 animate-bounce">🎉</div>}
            <CheckCircle2 className="w-12 h-12 mx-auto mb-3" />
            <div className="text-xl font-bold mb-1">報名成功！</div>
            <div className="text-sm opacity-90">您的參賽號碼是</div>
            <div className="text-5xl font-bold my-2">#{contestants[contestants.length - 1]?.number}</div>
            <div className="text-sm opacity-90">期待您的精彩表現 💛</div>
            <button onClick={() => { setSubmitted(false); setMyName(''); setMyStyle(''); }}
              className="mt-4 px-4 py-2 rounded-lg text-sm font-medium"
              style={{ background: 'rgba(255,255,255,0.2)', border: '1px solid rgba(255,255,255,0.3)' }}>
              幫其他人報名
            </button>
          </div>
        ) : data?.signupClosed ? (
          <div className="rounded-2xl p-6 text-center shadow-lg" style={{ background: 'linear-gradient(135deg, #6B7280, #4B5563)', color: 'white' }}>
            <Lock className="w-12 h-12 mx-auto mb-3" />
            <div className="text-xl font-bold mb-1">報名已截止</div>
            <div className="text-sm opacity-90">本次走秀報名已結束，感謝您的參與 💛</div>
          </div>
        ) : (data?.contestants?.length || 0) >= RUNWAY_SIGNUP_LIMIT ? (
          <div className="rounded-2xl p-6 text-center shadow-lg" style={{ background: 'linear-gradient(135deg, #DC2626, #991B1B)', color: 'white' }}>
            <div className="text-5xl mb-2">🈵</div>
            <div className="text-xl font-bold mb-1">報名已額滿</div>
            <div className="text-sm opacity-90">造型走秀限定 {RUNWAY_SIGNUP_LIMIT} 組，已額滿，感謝您的踴躍報名 💛</div>
          </div>
        ) : (
          <>
            <div className="rounded-2xl p-5 shadow-sm" style={{ background: 'white', border: '1px solid #FCD34D' }}>
              <div className="text-center mb-4">
                <Shirt className="w-12 h-12 mx-auto mb-2" style={{ color: '#F5B800' }} />
                <div className="text-lg font-bold" style={{ color: '#92400E' }}>黃色派對走秀報名</div>
                <div className="text-xs text-gray-500 mt-1">填寫資料後即自動取得號碼牌</div>
                <div className="inline-block mt-2 text-xs px-3 py-1 rounded-full font-bold" style={{ background: '#FEF3C7', color: '#92400E' }}>
                  名額 {data?.contestants?.length || 0} / {RUNWAY_SIGNUP_LIMIT} 組 · 剩 {Math.max(0, RUNWAY_SIGNUP_LIMIT - (data?.contestants?.length || 0))} 組
                </div>
              </div>
              <div className="space-y-3">
                <div>
                  <label className="text-xs font-bold mb-1 block" style={{ color: '#92400E' }}>您的姓名 *</label>
                  <input value={myName} onChange={e => setMyName(e.target.value)} placeholder="請輸入姓名"
                    className="w-full px-3 py-3 rounded-xl border text-base outline-none focus:border-yellow-400"
                    style={{ borderColor: '#FCD34D' }} />
                </div>
                <div>
                  <label className="text-xs font-bold mb-1 block" style={{ color: '#92400E' }}>造型介紹（選填）</label>
                  <textarea value={myStyle} onChange={e => setMyStyle(e.target.value)} placeholder="簡短描述您的造型主題、亮點"
                    rows={3}
                    className="w-full px-3 py-2 rounded-xl border text-sm outline-none focus:border-yellow-400 resize-none"
                    style={{ borderColor: '#FCD34D' }} />
                </div>
                <button onClick={submit}
                  className="w-full py-3 rounded-xl text-white font-bold shadow-lg active:scale-95 transition"
                  style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
                  送出報名
                </button>
              </div>
            </div>

            {/* 已報名清單 */}
            <div className="rounded-2xl p-4 shadow-sm" style={{ background: 'white', border: '1px solid #FCD34D' }}>
              <div className="flex items-center justify-between mb-2">
                <div className="font-bold text-sm" style={{ color: '#1F2937' }}>已報名 {contestants.length} 位</div>
              </div>
              {contestants.length === 0 ? (
                <div className="text-sm text-gray-400 text-center py-4">還沒有人報名，您可以當第一個！</div>
              ) : (
                <div className="space-y-1.5">
                  {contestants.map(c => (
                    <div key={c.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: '#FFFBEA' }}>
                      <div className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm" style={{ background: 'linear-gradient(135deg, #FEF3C7, #FDE68A)', color: '#92400E' }}>

                      <div className="flex-1 text-sm font-medium" style={{ color: '#1F2937' }}>{c.name}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </>
        )}
      </div>
      <HomeFAB />
    </div>
  );
}

// ============== 搶答前台（會員手機） ==============
function BuzzerPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [myName, setMyName] = useState(() => {
    try { return localStorage.getItem('fule_buzzer_name') || ''; } catch (e) { return ''; }
  });
  const [entered, setEntered] = useState(() => {
    try { return !!localStorage.getItem('fule_buzzer_name'); } catch (e) { return false; }
  });
  const [pressedThisRound, setPressedThisRound] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const lastRoundRef = useRef(null);
  const wasOpenRef = useRef(false);
  const rankedRef = useRef(false);

  // 載入資料 + polling
  useEffect(() => {
    const load = async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) setData(JSON.parse(r.value));
      } catch (e) {}
    };
    load().then(() => setLoading(false));
    const t = setInterval(load, 1000); // 1 秒輪詢，搶答需要快
    return () => clearInterval(t);
  }, []);

  const buzzer = data?.buzzer || { open: false, locked: false, buzzes: [], roundId: 0 };

  // 偵測新一輪：roundId 變了就重置（不倒數，直接可搶）
  useEffect(() => {
    if (lastRoundRef.current !== buzzer.roundId) {
      lastRoundRef.current = buzzer.roundId;
      setPressedThisRound(false);
      rankedRef.current = false;
      // 新一輪且開放 → 播提示音 + 震動，直接可搶
      if (buzzer.open && !buzzer.locked && buzzer.roundId) {
        _sfx.go();
        if (navigator.vibrate) navigator.vibrate(120);
      }
    }
  }, [buzzer.roundId, buzzer.open, buzzer.locked]);

  // 偵測「我搶到第一名」→ 彩帶 + 勝利音效
  useEffect(() => {
    if (!entered) return;
    const idx = (buzzer.buzzes || []).findIndex(b => b.name === myName.trim());
    if (idx === 0 && !rankedRef.current) {
      rankedRef.current = true;
      setShowConfetti(true);
      _sfx.fanfare();
      if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
      setTimeout(() => setShowConfetti(false), 3500);
    }
  }, [buzzer.buzzes]);

  const enter = () => {

const SLIDES_KEY = 'fule_slides';
let __slideSeq = 0;
function slideUid() { __slideSeq = (__slideSeq + 1) % 100000; return Date.now() * 100000 + __slideSeq; } // 保證唯一，避免同毫秒撞號
// 修正舊資料中重複的 id（會造成編輯互相影響、播放疊頁），回傳 {arr, changed}
function dedupeSlideIds(arr) {
  const seen = new Set(); let changed = false;
  const out = (arr || []).map(s => {
    let id = s.id;
    if (id == null || seen.has(id)) { id = slideUid(); changed = true; }
    seen.add(id);
    return id === s.id ? s : { ...s, id };
  });
  return { arr: out, changed };
}
async function slidesRead() {
  try { const r = await window.storage.get(SLIDES_KEY, true); return r?.value ? JSON.parse(r.value) : null; } catch (e) { return null; }
}
async function slidesWrite(arr) {
  try {
    const json = JSON.stringify(arr);
    if (json.length > 4600000) return false; // 接近 5MB 上限，視為失敗
    const r = await window.storage.set(SLIDES_KEY, json, true);
    return r !== null && r !== undefined;
  } catch (e) { return false; }
}
// 上傳圖片 → 縮到最大邊 1280、轉 JPEG dataURL（避免過大）
function fileToScaledDataURL(file, maxSize = 1100, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width >= height) { height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
const SLIDE_BG_PRESETS = ['#1E1B4B', '#0c0a14', '#15131f', '#7C3AED', '#DB2777', '#F5B800', '#DC2626', '#10B981', '#1F2937', '#ffffff'];

// 動態載入外部 script
function loadExternalScript(src) {
  return new Promise((resolve, reject) => {
    if (window.__loadedScripts && window.__loadedScripts[src]) return resolve();
    const sc = document.createElement('script');
    sc.src = src; sc.onload = () => { window.__loadedScripts = window.__loadedScripts || {}; window.__loadedScripts[src] = true; resolve(); };
    sc.onerror = reject; document.head.appendChild(sc);
  });
}
// 圖片網址轉 dataURL（嵌入 PPT 用），失敗回 null
async function imgToDataUrl(url) {
  if (!url) return null;
  if (url.startsWith('data:')) return url;
  try {
    const r = await fetch(url); const b = await r.blob();
    return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(b); });
  } catch (e) { return null; }
}

// 載入圖片（支援 dataURL 與外部網址；外部圖嘗試 CORS，失敗回 null）
function loadImageEl(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(null); return; }
    const img = new window.Image();
    if (!src.startsWith('data:')) img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}
// canvas 自動換行寫字
function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  const lines = []; const paras = String(text).split('\n');
  for (const para of paras) {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    lines.push(line);
  }
  const use = maxLines ? lines.slice(0, maxLines) : lines;
  use.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineH));
  return use.length * lineH;
}
// 把活動簡報匯出成 PDF（用 canvas 繪製，完整支援中文字）

      if (s.subtitle) { ctx.font = `700 ${Math.round(40 * ts)}px ${CJK}`; y += wrapText(ctx, s.subtitle, cx, y, maxW, Math.round(50 * ts), 2) + 12; }
      if (s.image && !s.imageAsBg) {
        const im = await loadImageEl(s.image);
        if (im) { const maxH = 300, maxIW = W - 320; let w = im.width, h = im.height; const r = Math.min(maxIW / w, maxH / h, 1); w *= r; h *= r; ctx.drawImage(im, (W - w) / 2, y, w, h); y += h + 16; }
      }

    } else if (s.type === 'qr') {
      const qm = QR_SLIDE_META[s.qrKind]; const url = baseUrl + qm.hash;
      const grad = ctx.createLinearGradient(0, 0, W, H); grad.addColorStop(0, '#1E1B4B'); grad.addColorStop(1, '#4C1D95');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center';
      ctx.font = `900 64px ${CJK}`; ctx.fillText(`${qm.emoji} ${s.title || qm.label}`, W / 2, 110);
      const qr = await loadImageEl(`https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(url)}`);
      if (qr) { ctx.fillStyle = '#fff'; ctx.fillRect(W / 2 - 200, 150, 400, 400); ctx.drawImage(qr, W / 2 - 185, 165, 370, 370); }
      ctx.fillStyle = '#F5B800'; ctx.font = `700 32px ${CJK}`; ctx.fillText(qm.desc, W / 2, 600);
      ctx.fillStyle = '#CCCCCC'; ctx.font = `400 22px ${CJK}`; ctx.fillText(url, W / 2, 645);
    } else if (s.type === 'game') {

      ctx.fillStyle = '#15131F'; ctx.fillRect(0, 0, W, H);

      ctx.fillText(`${gm.emoji} ${gm.label}`, W / 2, H / 2);
      ctx.fillStyle = '#FFFFFF'; ctx.font = `400 28px ${CJK}`;
      ctx.fillText('（現場互動環節：播放時請於系統操作此遊戲）', W / 2, H / 2 + 70);
    }
    const jpeg = canvas.toDataURL('image/jpeg', 0.9);
    if (i > 0) pdf.addPage([W, H], 'landscape');
    pdf.addImage(jpeg, 'JPEG', 0, 0, W, H);
  }
  pdf.save('活動簡報.pdf');
}

const QL_KEY = 'fule_quizlive';
const QL_OPT_COLORS = ['#DC2626', '#2563EB', '#F5B800', '#10B981'];
const QL_OPT_SHAPES = ['▲', '◆', '●', '■'];

async function qlRead() {
  try { const r = await window.storage.get(QL_KEY, true); return r?.value ? JSON.parse(r.value) : null; } catch (e) { return null; }
}
async function qlWrite(next) {
  try { await window.storage.set(QL_KEY, JSON.stringify(next), true); } catch (e) {}
}
// 玩家合併寫入（讀最新→改自己那份→寫回，重試一次降低覆蓋）
async function qlMerge(mutator) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await qlRead();
    if (!cur) return null;
    const next = mutator(JSON.parse(JSON.stringify(cur)));
    if (!next) return cur;
    await qlWrite(next);
    return next;
  }
}
function qlScore(elapsedMs, durationMs) {
  const ratio = Math.max(0, Math.min(1, 1 - elapsedMs / durationMs));
  return 500 + Math.floor(500 * ratio); // 答對基本 500 + 速度加成最多 500
}

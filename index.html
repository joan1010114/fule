<!--
  自動版本檢查：伺服器有新版時強制刷新，使用者不用清快取
-->
<script>
  (function() {
    const CURRENT_VERSION = '2026-04-23-6300-v9.78';
    const STORED_VERSION = localStorage.getItem('__app_version__');

    // 第一次使用，記錄當前版本
    if (!STORED_VERSION) {
      localStorage.setItem('__app_version__', CURRENT_VERSION);
    }

    // 定期從 API 檢查最新版本（每 30 秒）
    async function checkVersion() {
      try {
        const res = await fetch('/api/data.php?key=__app_latest_version__', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const latestVersion = data.value;

          // 如果 API 回傳的版本 > 當前這份 HTML 的版本，表示有更新
          if (latestVersion && latestVersion !== CURRENT_VERSION && latestVersion > CURRENT_VERSION) {
            console.log('發現新版，強制刷新:', latestVersion);
            localStorage.setItem('__app_version__', latestVersion);
            // 用時間戳強制刷新，繞過快取
            location.href = location.pathname + '?v=' + Date.now();
          }
        }
      } catch (e) {
        // 離線或 API 失敗就跳過
      }
    }

    // 首次載入時，把自己的版本寫到 API（這樣其他人打開就會知道這是最新版）
    async function reportVersion() {
      try {
        await fetch('/api/data.php?key=__app_latest_version__', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: CURRENT_VERSION }),
        });
      } catch (e) {}
    }

    // 開始流程
    reportVersion();
    checkVersion();
    setInterval(checkVersion, 30000);
  })();
</script>

<!--
  storage：同時存到 Cloudways MySQL 和 localStorage
  因為 HTML 跟 PHP 在同網域（都是 fule.52ec.tw），API 路徑用相對路徑就好
-->
<script>
  (function() {
    window.storage = {
      async get(key, shared) {
        // 1. 優先向 API 取最新（確保多裝置同步）
        try {
          // 加時間戳避開任何層級的快取，並用 no-store 強制直接打伺服器
          const res = await fetch('/api/data.php?key=' + encodeURIComponent(key) + '&_=' + Date.now(), {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache' }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.value) {
              try { localStorage.setItem(key, data.value); } catch {}
              return { key, value: data.value, shared: !!shared };
            } else {
              // API 回傳 null（伺服器上沒資料）
              return null;
            }
          }
        } catch (e) {
          console.warn('API 讀取失敗，退回使用快取:', e.message);
        }

        // 2. API 失敗才用 localStorage 快取（離線情況）
        try {
          const v = localStorage.getItem(key);
          if (v) return { key, value: v, shared: !!shared };
        } catch {}
        return null;
      },
      async set(key, value, shared) {
        // 1. 寫 localStorage
        try { localStorage.setItem(key, value); } catch {}

        // 2. 寫 API
        try {
          await fetch('/api/data.php?key=' + encodeURIComponent(key), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value }),
          });
        } catch (e) {
          console.warn('API 寫入失敗:', e.message);
        }
        return { key, value, shared: !!shared };
      },
    };

    // 3. 每 2 秒從 API 同步主資料（讓其他人的編輯會自動出現）
    const POLL_KEY = 'fule_yellow_party_v7';
    let lastValue = null;
    setInterval(async () => {
      try {
        const res = await fetch('/api/data.php?key=' + encodeURIComponent(POLL_KEY) + '&_=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache' }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.value && data.value !== lastValue) {
          lastValue = data.value;
          const oldValue = localStorage.getItem(POLL_KEY);
          if (oldValue !== data.value) {
            localStorage.setItem(POLL_KEY, data.value);
            // 通知 App 重新載入
            window.dispatchEvent(new CustomEvent('storage-updated', { detail: { key: POLL_KEY, value: data.value } }));
          }
        }
      } catch {}
    }, 2000);
  })();
</script>

<!--
  替身：因為 UMD 版 lucide 是 SVG 產生器，不是 React 元件庫，
  這裡自己寫一個「icon 轉 React 元件」的橋接層。
  把所有 V7 用到的 lucide-react icon 都對應過去。
-->
<script>
  // 等 lucide 載入完
  if (typeof lucide === 'undefined') {
    console.error('Lucide 未載入');
  }

  // 把 lucide 的 icon 資料轉成 React 元件
  function makeLucideIconComponent(iconNode) {
    return function LucideIcon(props = {}) {
      const { size = 24, color = 'currentColor', strokeWidth = 2, className = '', style = {}, ...rest } = props;
      // iconNode 是 [[tagName, attrs], ...] 格式
      const children = (iconNode || []).map((item, idx) => {
        const [tag, attrs] = item;
        return React.createElement(tag, { key: idx, ...attrs });
      });
      return React.createElement('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: size, height: size,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: color,
        strokeWidth,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        className: `lucide ${className}`,
        style,
        ...rest,
      }, children);
    };
  }

  // 建立 icon registry
  window.__lucideIcons = {};
  function getIcon(name) {
    if (window.__lucideIcons[name]) return window.__lucideIcons[name];
    // lucide 的 icon 命名是 kebab-case，但我們要 PascalCase 查詢
    const iconNode = lucide.icons[name] || lucide.icons[name.replace(/([A-Z])/g, '-$1').slice(1).toLowerCase()] || null;
    if (!iconNode) {
      // 找不到 icon 回傳空 svg
      return function FallbackIcon(props) {
        return React.createElement('svg', { width: props.size || 24, height: props.size || 24 });
      };
    }
    const comp = makeLucideIconComponent(iconNode);
    window.__lucideIcons[name] = comp;
    return comp;
  }
</script>

// #12 共用拖曳 hook：提供一組 props 給任何列表的卡片使用
// 用法：const { getDragProps, draggedId, dragOverId } = useDragSort(items, setItems, 'id');
// <div {...getDragProps(item.id)}>...</div>
function useDragSort(items, setItems, keyField = 'id') {
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);

  const getDragProps = (itemId) => ({
    draggable: true,
    onDragStart: () => setDraggedId(itemId),
    onDragOver: (e) => { e.preventDefault(); if (draggedId !== itemId) setDragOverId(itemId); },
    onDragLeave: () => setDragOverId(null),
    onDrop: (e) => {
      e.preventDefault();
      if (draggedId == null || draggedId === itemId) {
        setDraggedId(null); setDragOverId(null);
        return;
      }
      const from = items.findIndex(x => x[keyField] === draggedId);
      const to = items.findIndex(x => x[keyField] === itemId);
      if (from === -1 || to === -1) return;
      const next = [...items];
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      setItems(next);
      setDraggedId(null);
      setDragOverId(null);
    },
    onDragEnd: () => { setDraggedId(null); setDragOverId(null); },
  });

  return { getDragProps, draggedId, dragOverId };
}

const evalFormula = (val, ctx) => {
  if (typeof val === 'number') return val;
  if (typeof val !== 'string' || !val.startsWith('=')) return Number(val) || 0;
  try {
    let expr = val.slice(1);
    expr = expr.replace(/\{(\w+)\}/g, (_, k) => ctx[k] ?? 0);
    expr = expr.replace(/CEIL\(([^)]+)\)/g, 'Math.ceil($1)');
    return Function('"use strict";return (' + expr + ')')() || 0;
  } catch { return 0; }
};

// 共用：找出某流程環節對應的負責夥伴（總覽、時間軸、匯出都用這個，確保一致）
// 優先順序：1) 環節有手動填 host 欄位 2) 內容(title/detail/note)直接出現 staff 名字 3) responsibility 關鍵字比對 title+detail
function matchStaffForRow(row, staff) {
  if (!staff || !staff.length) return [];
  // 1) 手動指定的主持/負責人（以逗號/頓號分隔多人）
  if (row.host && row.host.trim()) {
    const names = row.host.split(/[、,，\/／\s]+/).map(n => n.trim()).filter(Boolean);
    const matched = [];
    names.forEach(nm => {
      const s = staff.find(s => s.name && s.name.trim() === nm);
      matched.push(s || { name: nm, role: '' });
    });
    if (matched.length) return [...new Map(matched.map(h => [h.name + (h.role || ''), h])).values()];
  }
  const title = row.title || '';
  const detail = row.detail || '';
  const note = row.note || '';
  const haystack = `${title} ${detail} ${note}`;
  const hits = [];
  staff.forEach(s => {
    if (!s.name || !s.name.trim()) return;
    // 2) 名字直接出現在內容
    if (haystack.includes(s.name)) { hits.push(s); return; }
    // 3) responsibility 關鍵字比對 title + detail（不只 title，比較容易對上）
    if (s.responsibility) {
      const keywords = s.responsibility.split(/[、,，\s\/／]+/).map(k => k.trim()).filter(k => k.length >= 2);
      if (keywords.some(k => title.includes(k) || detail.includes(k))) hits.push(s);
    }
  });
  return [...new Map(hits.map(h => [h.role + h.name, h])).values()];
}

const parseTimeRange = (timeStr, baseDate) => {
  if (!timeStr) return null;
  const parts = timeStr.split('-');
  if (parts.length !== 2) return null;
  const p = (s) => {
    const [h, m] = s.trim().split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const d = new Date(baseDate); d.setHours(h, m, 0, 0); return d.getTime();
  };
  const start = p(parts[0]), end = p(parts[1]);
  if (start === null || end === null) return null;
  return { start, end };
};

// ============== Excel 匯出 helper ==============
// 用法：exportToXlsx('filename.xlsx', [{ name: '工作表名', columns: ['欄1', '欄2'], rows: [['A', 'B'], ...], colWidths: [15, 30] }])
function exportToXlsx(filename, sheets) {
  if (typeof XLSX === 'undefined') {
    alert('Excel 函式庫尚未載入，請稍候再試');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => {
    const aoa = [s.columns, ...s.rows];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    // 欄寬
    if (s.colWidths) ws['!cols'] = s.colWidths.map(w => ({ wch: w }));
    // 標題列粗體（透過 cellStyles，但純 SheetJS 社群版有限，至少加 freeze pane）
    ws['!freeze'] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws, s.name?.substring(0, 31) || 'Sheet');
  });
  XLSX.writeFile(wb, filename);
}

const _sfx = {
  ctx: null,
  get audioCtx() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return this.ctx;
  },
  tone(freq, dur, type = 'sine', vol = 0.3, delay = 0) {
    const ctx = this.audioCtx;
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur);
  },
  success() { this.tone(523, 0.15, 'sine', 0.3, 0); this.tone(659, 0.15, 'sine', 0.3, 0.1); this.tone(784, 0.3, 'sine', 0.3, 0.2); },
  buzz() { this.tone(880, 0.1, 'square', 0.25, 0); this.tone(1320, 0.2, 'square', 0.25, 0.08); },
  reveal() { this.tone(392, 0.12, 'triangle', 0.3, 0); this.tone(523, 0.12, 'triangle', 0.3, 0.12); this.tone(659, 0.12, 'triangle', 0.3, 0.24); this.tone(880, 0.4, 'triangle', 0.35, 0.36); },
  click() { this.tone(660, 0.06, 'sine', 0.2, 0); },
  fanfare() {
    [523, 659, 784].forEach(f => this.tone(f, 0.6, 'triangle', 0.25, 0));
    this.tone(1047, 0.8, 'sine', 0.3, 0.2);
  },
  pop() { this.tone(440, 0.08, 'sine', 0.2, 0); this.tone(880, 0.12, 'sine', 0.2, 0.05); },
  // 倒數 tick
  tick() { this.tone(660, 0.08, 'square', 0.2, 0); },
  // 開始！
  go() { this.tone(880, 0.3, 'sawtooth', 0.3, 0); this.tone(1320, 0.4, 'sawtooth', 0.25, 0.05); },
  // 緊張鼓聲：在 durationMs 內由慢漸快的低音 tick，最後一記重音
  drumroll(durationMs = 7000) {
    const ctx = this.audioCtx;
    if (!ctx) return;
    let t = 0, gap = 320; // 起始間隔
    while (t < durationMs - 400) {
      this.tone(150, 0.12, 'triangle', 0.28, t / 1000);
      gap = Math.max(70, gap * 0.93); // 越來越快
      t += gap;
    }
    // 收尾重音 + 上揚
    this.tone(110, 0.25, 'triangle', 0.35, (durationMs - 350) / 1000);
    this.tone(220, 0.5, 'sawtooth', 0.3, (durationMs - 120) / 1000);
  },
};

// ============== 彩帶噴發元件 ==============
function Confetti({ show, count = 60 }) {
  const pieces = useMemo(() => {
    if (!show) return [];
    const colors = ['#F5B800', '#FF9F1C', '#EC4899', '#8B5CF6', '#10B981', '#3B82F6', '#FFFFFF'];
    return Array.from({ length: count }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 0.5,
      dur: 1.5 + Math.random() * 1.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 6 + Math.random() * 8,
      rot: Math.random() * 360,
    }));
  }, [show, count]);

  if (!show) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 60, overflow: 'hidden' }}>
      {pieces.map(p => (
        <div key={p.id} style={{
          position: 'absolute', left: `${p.left}%`, top: 0,
          width: p.size, height: p.size * 0.6,
          background: p.color, borderRadius: 2,
          transform: `rotate(${p.rot}deg)`,
          animation: `confettiFall ${p.dur}s ease-in ${p.delay}s forwards`,
        }} />
      ))}
    </div>
  );
}

function useFullscreen() {
  const [isFs, setIsFs] = useState(false);
  useEffect(() => {
    const onChange = () => setIsFs(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onChange);
    document.addEventListener('webkitfullscreenchange', onChange);
    return () => {
      document.removeEventListener('fullscreenchange', onChange);
      document.removeEventListener('webkitfullscreenchange', onChange);
    };
  }, []);

  const toggle = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };
  return { isFs, toggle };
}

function FullscreenButton({ className = '', style = {} }) {
  const { isFs, toggle } = useFullscreen();
  return (
    <button onClick={toggle} className={`px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-white/10 active:scale-95 transition ${className}`}
      style={{ color: 'white', border: '1px solid rgba(255,255,255,0.3)', ...style }}
      title={isFs ? '退出全螢幕' : '進入全螢幕'}>
      {isFs ? '⤢ 退出全螢幕' : '⛶ 全螢幕'}
    </button>
  );
}

// ============== 主元件 ==============
function App() {
  // 檢查 URL hash 判斷入口
  const [route, setRoute] = useState(() => {
    if (typeof window === 'undefined') return 'public';
    const hash = window.location.hash;
    if (hash.startsWith('#quiz-play')) return 'quiz-play';
    if (hash.startsWith('#present')) return 'present';
    if (hash.startsWith('#vote')) return 'vote';
    if (hash.startsWith('#signup')) return 'signup';
    if (hash.startsWith('#buzzer')) return 'buzzer';
    if (hash.startsWith('#game-runway')) return 'game-runway';
    if (hash.startsWith('#game-song')) return 'game-song';
    if (hash.startsWith('#game-quizlive')) return 'game-quizlive';
    if (hash.startsWith('#game-quiz')) return 'game-quiz';
    if (hash.startsWith('#game-lottery')) return 'game-lottery';
    if (hash.startsWith('#live')) return 'live';
    if (hash.startsWith('#admin')) return 'admin';
    return 'public'; // 預設是前台預告頁
  });

  useEffect(() => {
    const onHashChange = () => {
      const hash = window.location.hash;
      if (hash.startsWith('#quiz-play')) setRoute('quiz-play');
      else if (hash.startsWith('#present')) setRoute('present');
      else if (hash.startsWith('#vote')) setRoute('vote');
      else if (hash.startsWith('#signup')) setRoute('signup');
      else if (hash.startsWith('#buzzer')) setRoute('buzzer');
      else if (hash.startsWith('#game-runway')) setRoute('game-runway');
      else if (hash.startsWith('#game-song')) setRoute('game-song');
      else if (hash.startsWith('#game-quizlive')) setRoute('game-quizlive');
      else if (hash.startsWith('#game-quiz')) setRoute('game-quiz');
      else if (hash.startsWith('#game-lottery')) setRoute('game-lottery');
      else if (hash.startsWith('#live')) setRoute('live');
      else if (hash.startsWith('#admin')) setRoute('admin');
      else setRoute('public');
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  // 瀏覽器「上一頁」：本 App 用 hash 路由，上一頁本來就是站內的上一個畫面，
  // 交給瀏覽器自然導覽即可，不另外強制攔截（先前的強制跳轉會干擾正常導覽）。
  // 這裡只保留紀錄，不做任何 redirect。
  useEffect(() => {
    try {
      const recordNav = () => {
        try {
          if (!window.__navStack) window.__navStack = [];
          const h = window.location.hash || '';
          const stack = window.__navStack;
          if (stack[stack.length - 1] !== h) {
            stack.push(h);
            if (stack.length > 50) stack.shift();
          }
        } catch (e) {}
      };
      recordNav();
      window.addEventListener('hashchange', recordNav);
      return () => window.removeEventListener('hashchange', recordNav);
    } catch (e) {
      return undefined;
    }
  }, []);

  if (route === 'vote') return <VoterPage />;
  if (route === 'quiz-play') return <QuizPlayPage />;
  if (route === 'present') return <PresentMode />;
  if (route === 'game-quizlive') return <StandaloneGame kind="quizlive" />;
  if (route === 'signup') return <SignupPage />;
  if (route === 'buzzer') return <BuzzerPage />;
  if (route === 'game-runway') return <StandaloneGame kind="runway" />;
  if (route === 'game-song') return <StandaloneGame kind="song" />;
  if (route === 'game-quiz') return <StandaloneGame kind="quiz" />;
  if (route === 'game-lottery') return <StandaloneGame kind="lottery" />;
  if (route === 'live') return <StandaloneGame kind="live" />;
  if (route === 'admin') return <AdminGate><AdminApp onLogout={() => { window.location.hash = ''; }} /></AdminGate>;

  return <PublicPage />;
}

// ============== 獨立遊戲視窗（從 storage 載入，新視窗投影用） ==============
// ============== 活動簡報播放（#present，簡報筆/鍵盤翻頁）==============
function PresentMode() {
  const [slides, setSlides] = useState(null);
  const [idx, setIdx] = useState(0);
  const [showHint, setShowHint] = useState(true);
  // 音樂
  const audioRef = useRef(null);
  const ytRef = useRef(null);
  const [ytSrc, setYtSrc] = useState('');
  const [track, setTrack] = useState('');   // 目前載入的音樂連結
  const [musicPlaying, setMusicPlaying] = useState(false);
  const rootRef = useRef(null);

  const lastSlidesJson = useRef('');
  useEffect(() => {
    let alive = true;
    const reload = () => slidesRead().then(s => {
      if (!alive) return;
      const arr = dedupeSlideIds(s || []).arr;
      const json = JSON.stringify(arr);
      if (json !== lastSlidesJson.current) { lastSlidesJson.current = json; setSlides(arr); } // 只有真的不同才更新，避免閃爍
    });
    reload();
    const onFocus = () => reload();
    const onVis = () => { if (!document.hidden) reload(); };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onVis);
    return () => { alive = false; window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', onVis); };
  }, []);

  const n = slides ? slides.length : 0;
  const go = (d) => setIdx(i => Math.max(0, Math.min((n || 1) - 1, i + d)));
  useEffect(() => { if (n > 0) setIdx(i => Math.min(i, n - 1)); }, [n]);

  // 音樂 helper
  const ytId = (url) => { const m = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/); return m ? m[1] : null; };
  const isYt = (url) => /youtube\.com|youtu\.be/i.test(url || '');
  const ytCmd = (func) => { try { ytRef.current?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*'); } catch (e) {} };
  const playTrack = (url) => {
    if (!url) return;
    if (isYt(url)) {
      const id = ytId(url);
      if (!id) { alert('YouTube 連結無法解析'); return; }
      // 不加 loop/playlist：播一次就停，不會一直重複或跳下一首
      setYtSrc(`https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=1&controls=0&rel=0&modestbranding=1&playsinline=1`);
      if (audioRef.current) { audioRef.current.pause(); }
    } else {
      setYtSrc('');
      const a = audioRef.current; if (a) { a.loop = false; a.src = url; a.play().catch(() => alert('無法播放此連結，請確認是有效的音訊網址或 YouTube 連結')); }
    }
    setTrack(url); setMusicPlaying(true);
  };
  const stopMusic = () => {
    try { if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; } } catch (e) {}
    setYtSrc('');           // 卸載 YouTube iframe → 確實停止
    setTrack(''); setMusicPlaying(false);
  };
  const pauseMusic = () => { if (isYt(track)) ytCmd('pauseVideo'); else audioRef.current?.pause(); setMusicPlaying(false); };
  const resumeMusic = () => { if (isYt(track)) ytCmd('playVideo'); else audioRef.current?.play().catch(() => {}); setMusicPlaying(true); };
  const toggleMusic = (url) => {
    if (track === url && musicPlaying) { pauseMusic(); return; }
    if (track === url && !musicPlaying) { resumeMusic(); return; }
    playTrack(url);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); }
      else if (e.key === 'f' || e.key === 'F') { toggleFull(); }
      else if (e.key === 'Escape') { /* 交給瀏覽器離開全螢幕 */ }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [n, track, musicPlaying]);

  // 換頁：先停掉上一頁的音樂（不延續），再依新頁的自動播放設定決定要不要放
  useEffect(() => {
    if (!slides) return;
    stopMusic();
    const s = slides[idx];
    if (s && s.musicUrl && s.musicAuto) { const u = s.musicUrl; setTimeout(() => playTrack(u), 60); }
  }, [idx, slides]);

  useEffect(() => { setShowHint(true); const t = setTimeout(() => setShowHint(false), 3500); return () => clearTimeout(t); }, [idx]);
  // 確保鍵盤/簡報筆有作用：載入與每次換頁都把焦點抓回頁面
  useEffect(() => { try { window.focus(); rootRef.current && rootRef.current.focus(); } catch (e) {} }, [idx, slides]);

  const toggleFull = () => {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch (e) {}
  };

  if (!slides) return <div className="min-h-screen flex items-center justify-center" style={{ background: '#000' }}><div className="animate-spin w-12 h-12 rounded-full border-4" style={{ borderColor: '#F5B800', borderTopColor: 'transparent' }} /></div>;
  if (n === 0) return (
    <div className="min-h-screen flex flex-col items-center justify-center text-center p-6" style={{ background: '#1E1B4B', color: 'white' }}>
      <div className="text-6xl mb-4">🎬</div>
      <div className="text-2xl font-bold mb-2">尚未建立簡報內容</div>
      <div className="opacity-70 mb-6">請到後台「活動簡報」新增頁面</div>
      <button onClick={() => { window.location.hash = 'admin'; }} className="px-6 py-3 rounded-xl font-bold" style={{ background: '#F5B800', color: '#1F2937' }}>回後台</button>
    </div>
  );

  const safeIdx = Math.min(idx, n - 1);
  const slide = slides[safeIdx] || slides[0];
  const isGame = slide.type === 'game';
  const isQr = slide.type === 'qr';
  const meta = isGame ? GAME_SLIDE_META[slide.gameKind] : null;
  const ts = slide.textScale ?? 1;
  const baseUrl = window.location.origin + window.location.pathname;

  return (
    <div ref={rootRef} tabIndex={0} onMouseDown={() => { try { rootRef.current && rootRef.current.focus(); } catch (e) {} }} className="fixed inset-0 overflow-hidden select-none flex items-center justify-center" style={{ background: '#000', outline: 'none' }}>
      {/* 16:9 舞台：在任何螢幕都框成 16:9 完整呈現（投影機 16:9 時剛好滿版）*/}
      <div className="relative overflow-hidden" style={{ width: 'min(100vw, 177.78vh)', height: 'min(100vh, 56.25vw)', background: '#000' }}>
      <div key={`slide-${safeIdx}-${slide.id}`} className="w-full h-full">
      {/* 內容頁 */}
      {slide.type === 'content' && (
        <div onClick={() => go(1)}
          className="w-full h-full flex flex-col items-center justify-center cursor-pointer relative"
          style={{ background: slide.bg || '#1E1B4B', color: slide.textColor === 'dark' ? '#1F2937' : '#ffffff', padding: '6vh 8vw', textAlign: slide.align || 'center' }}>
          {slide.imageAsBg && slide.image && <img src={slide.image} alt="" className="absolute inset-0 w-full h-full" style={{ objectFit: 'cover', filter: `brightness(${slide.imgBright ?? 1})` }} />}
          <div className="relative z-10 flex flex-col items-center justify-center gap-4 max-w-6xl" style={{ alignItems: slide.align === 'left' ? 'flex-start' : 'center' }}>
            {slide.title && <div className="font-black leading-tight" style={{ fontSize: `clamp(${2.5 * ts}rem, ${8 * ts}vw, ${7 * ts}rem)`, textShadow: slide.imageAsBg ? '0 2px 20px rgba(0,0,0,0.7)' : 'none' }}>{slide.title}</div>}
            {slide.subtitle && <div className="font-bold opacity-90" style={{ fontSize: `clamp(${1.3 * ts}rem, ${4 * ts}vw, ${3 * ts}rem)`, textShadow: slide.imageAsBg ? '0 2px 14px rgba(0,0,0,0.7)' : 'none' }}>{slide.subtitle}</div>}
            {slide.image && !slide.imageAsBg && <img src={slide.image} alt="" style={{ maxHeight: '45vh', maxWidth: '100%', borderRadius: 16, objectFit: 'contain', margin: '1vh 0', filter: `brightness(${slide.imgBright ?? 1})` }} />}
            {slide.body && <div className="whitespace-pre-wrap leading-relaxed" style={{ fontSize: `clamp(${1.1 * ts}rem, ${2.6 * ts}vw, ${2 * ts}rem)`, opacity: 0.95, textShadow: slide.imageAsBg ? '0 2px 12px rgba(0,0,0,0.7)' : 'none' }}>{slide.body}</div>}
          </div>
        </div>
      )}

      {/* QR 頁（走秀報名 / 走秀投票）*/}
      {isQr && (() => {
        const qm = QR_SLIDE_META[slide.qrKind]; const url = baseUrl + qm.hash;
        return (
          <div onClick={() => go(1)} className="w-full h-full flex flex-col items-center justify-center text-center cursor-pointer" style={{ background: 'linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%)', color: '#fff', padding: '5vh 6vw' }}>
            <div className="font-black mb-4" style={{ fontSize: `clamp(${2.2 * ts}rem, ${6 * ts}vw, ${5 * ts}rem)` }}>{qm.emoji} {slide.title || qm.label}</div>
            <div className="bg-white rounded-3xl p-6 shadow-2xl">
              <img src={`https://api.qrserver.com/v1/create-qr-code/?size=420x420&data=${encodeURIComponent(url)}`} alt="QR" style={{ width: 'min(48vh, 420px)', height: 'min(48vh, 420px)' }} />
            </div>
            <div className="mt-4 font-bold opacity-90" style={{ fontSize: 'clamp(1.1rem, 3vw, 2rem)' }}>{qm.desc}</div>
            <div className="mt-1 opacity-60 break-all" style={{ fontSize: 'clamp(0.9rem, 2vw, 1.3rem)' }}>{url}</div>
          </div>
        );
      })()}

      {/* 遊戲頁：直接嵌入現場遊戲畫面 */}
      {isGame && (
        <div className="present-embed w-full h-full">
          <StandaloneGame kind={meta ? meta.kind : 'runway'} embed />
        </div>
      )}
      </div>{/* /key 包裹 */}
      </div>{/* /16:9 舞台 */}

      {/* 左右大箭頭：所有頁面都可用滑鼠翻頁（含遊戲頁，靠邊不擋中間操作）*/}
      {idx > 0 && (
        <button onClick={() => go(-1)} title="上一頁" className="fixed left-2 top-1/2 z-40 w-14 h-14 rounded-full text-3xl font-bold flex items-center justify-center active:scale-90" style={{ transform: 'translateY(-50%)', background: 'rgba(0,0,0,0.4)', color: 'white' }}>‹</button>
      )}
      {idx < n - 1 && (
        <button onClick={() => go(1)} title="下一頁" className="fixed right-2 top-1/2 z-40 w-14 h-14 rounded-full text-3xl font-bold flex items-center justify-center active:scale-90" style={{ transform: 'translateY(-50%)', background: 'rgba(0,0,0,0.4)', color: 'white' }}>›</button>
      )}

      {/* 隱藏音樂播放器（audio 與 YouTube）*/}
      <audio ref={audioRef} onEnded={() => setMusicPlaying(false)} />
      {ytSrc && <iframe ref={ytRef} src={ytSrc} title="bgm" allow="autoplay; encrypted-media" style={{ position: 'fixed', left: -9999, top: -9999, width: 1, height: 1, border: 0, opacity: 0 }} />}

      {/* 控制列（右下角，簡報筆用不到，滑鼠可用）*/}
      <div className="fixed bottom-3 right-3 z-50 flex items-center gap-2">
        <div className="px-3 py-1.5 rounded-lg text-sm font-bold" style={{ background: 'rgba(0,0,0,0.55)', color: 'white' }}>{safeIdx + 1} / {n}</div>
        <button onClick={() => go(-1)} title="上一頁" className="w-10 h-10 rounded-lg text-xl font-bold flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.55)', color: 'white' }}>‹</button>
        <button onClick={() => go(1)} title="下一頁" className="w-10 h-10 rounded-lg text-xl font-bold flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.55)', color: 'white' }}>›</button>
        {slide.musicUrl && (
          <button onClick={() => toggleMusic(slide.musicUrl)} title={musicPlaying && track === slide.musicUrl ? '暫停音樂' : '播放音樂'}
            className="w-10 h-10 rounded-lg text-lg flex items-center justify-center" style={{ background: musicPlaying && track === slide.musicUrl ? '#10B981' : 'rgba(0,0,0,0.55)', color: 'white' }}>
            {musicPlaying && track === slide.musicUrl ? '⏸' : '🎵'}
          </button>
        )}
        {musicPlaying && (!slide.musicUrl || track !== slide.musicUrl) && (
          <button onClick={pauseMusic} title="暫停目前音樂" className="w-10 h-10 rounded-lg text-lg flex items-center justify-center" style={{ background: '#10B981', color: 'white' }}>⏸</button>
        )}
        <button onClick={toggleFull} title="全螢幕(F)" className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.55)', color: 'white' }}>⛶</button>
        <button onClick={() => { pauseMusic(); window.location.hash = 'admin'; }} title="離開" className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.55)', color: 'white' }}>✕</button>
      </div>

      {/* 操作提示 */}
      {showHint && (
        <div className="fixed bottom-3 left-3 z-50 px-3 py-1.5 rounded-lg text-xs" style={{ background: 'rgba(0,0,0,0.55)', color: 'rgba(255,255,255,0.85)' }}>
          → / 按筆 / 點畫面或右側 › 下一頁　← / 左側 ‹ 上一頁　{isGame ? '· 此頁可直接操作遊戲' : ''}
        </div>
      )}
    </div>
  );
}

function MusicField({ s, update }) {
  return (
    <div className="rounded-lg p-2 mt-1" style={{ background: '#F5F3FF', border: '1px solid #DDD6FE' }}>
      <div className="flex items-center gap-2">
        <span className="text-xs font-bold whitespace-nowrap" style={{ color: '#6D28D9' }}>🎵 音樂連結</span>
        <input value={s.musicUrl || ''} onChange={e => update(s.id, 'musicUrl', e.target.value)} placeholder="貼上 YouTube 或 mp3 連結" className="flex-1 px-2 py-1.5 rounded border text-xs outline-none" style={{ borderColor: '#DDD6FE' }} />
      </div>
      {s.musicUrl && (
        <div className="flex items-center gap-2 mt-2 flex-wrap">
          <span className="text-xs font-bold" style={{ color: '#6D28D9' }}>自動播放</span>
          <button onClick={() => update(s.id, 'musicAuto', !s.musicAuto)} className="px-3 py-1.5 rounded-full text-xs font-bold transition" style={{ background: s.musicAuto ? '#10B981' : '#E5E7EB', color: s.musicAuto ? '#fff' : '#6B7280' }}>
            {s.musicAuto ? '✓ 開：翻到此頁自動播放' : '關：到此頁手動點 🎵 播放'}
          </button>
        </div>
      )}
      <div className="text-[10px] text-gray-400 mt-1">支援 YouTube 連結或直接音訊檔（.mp3／.m4a）。播放鈕在播放畫面右下角，和上下頁在一起。</div>
    </div>
  );
}

function SlidesTab({ readOnly = false }) {
  const [slides, setSlides] = useState(null);
  const saveTimer = useRef(null);
  const pendingRef = useRef(null);          // 尚未寫入的最新版本
  const [saveState, setSaveState] = useState('idle'); // idle | dirty | saving | saved | error
  const [savedAt, setSavedAt] = useState('');

  useEffect(() => { slidesRead().then(s => {
    const { arr, changed } = dedupeSlideIds(s || []);
    setSlides(arr);
    if (changed && !readOnly) slidesWrite(arr); // 修正舊資料的重複 id 並存回
  }); }, []);

  // 實際寫入；成功更新狀態，失敗提示
  const flush = async (arr, { alertOnFail = true } = {}) => {
    setSaveState('saving');
    const ok = await slidesWrite(arr);
    pendingRef.current = null;
    if (ok) {
      setSaveState('saved');
      const t = new Date(); setSavedAt(`${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')}`);
    } else {
      setSaveState('error');
      if (alertOnFail) alert('⚠️ 儲存失敗：簡報內容太大（上傳的圖片太多／太大），超過儲存上限。\n請把幾張「上傳的圖片」改成「圖片網址」，或刪掉部分高解析圖片，再按一次「儲存並發佈」。');
    }
    return ok;
  };

  const commit = (next, immediate) => {
    if (readOnly) { alert('檢視模式無法修改簡報，請用密碼 666 取得修改權限'); return; }
    setSlides(next);
    pendingRef.current = next;
    setSaveState('dirty');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (immediate) { flush(next); }
    else { saveTimer.current = setTimeout(() => flush(next), 600); }
  };

  // 離開分頁／關閉前，把還沒寫入的最後版本補存，避免「回到上一版」
  useEffect(() => () => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (pendingRef.current && !readOnly) { slidesWrite(pendingRef.current); }
  }, [readOnly]);

  // 手動「儲存並發佈」
  const publish = async () => {
    if (readOnly) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    const arr = pendingRef.current || slides || [];
    const ok = await flush(arr);
    if (ok) alert('✅ 已儲存並發佈！現在播放的活動簡報就是目前這個版本。');
  };

  const addContent = () => commit([...(slides || []), { id: slideUid(), type: 'content', title: '新頁面', subtitle: '', body: '', image: '', imageAsBg: false, imgBright: 1, textScale: 1, bg: '#1E1B4B', textColor: 'light', align: 'center', musicUrl: '', musicAuto: false }], true);
  const addGame = (gameKind) => commit([...(slides || []), { id: slideUid(), type: 'game', gameKind, musicUrl: '', musicAuto: false }], true);
  const addQr = (qrKind) => commit([...(slides || []), { id: slideUid(), type: 'qr', qrKind, title: QR_SLIDE_META[qrKind].label, musicUrl: '', musicAuto: false }], true);
  const update = (id, field, val) => commit((slides || []).map(s => s.id === id ? { ...s, [field]: val } : s));
  const move = (idx, dir) => {
    const arr = [...slides]; const j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    commit(arr, true);
  };
  const dup = (idx) => { const arr = [...slides]; arr.splice(idx + 1, 0, { ...arr[idx], id: slideUid() }); commit(arr, true); };
  const del = (id) => { if (confirm('刪除此頁？')) commit(slides.filter(s => s.id !== id), true); };

  const onUpload = async (id, file) => {
    if (!file) return;
    try { const url = await fileToScaledDataURL(file); update(id, 'image', url); }
    catch (e) { alert('圖片處理失敗，請換一張或改用圖片網址'); }
  };

  if (!slides) return <div className="p-8 text-center text-gray-400">載入中…</div>;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl p-4 shadow-sm border" style={{ borderColor: '#FCD34D' }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div>
            <h2 className="text-lg font-bold flex items-center gap-2" style={{ color: '#92400E' }}><Presentation className="w-5 h-5" />活動簡報</h2>
            <div className="text-xs text-gray-500 mt-0.5">自訂頁面（圖片＋文字）並串接現場遊戲，活動時用簡報筆／滑鼠一路播放</div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            {!readOnly && (
              <span className="text-xs font-bold px-2 py-1 rounded-lg" style={{
                background: saveState === 'saved' ? '#DCFCE7' : saveState === 'error' ? '#FEE2E2' : saveState === 'saving' ? '#DBEAFE' : '#FEF3C7',
                color: saveState === 'saved' ? '#166534' : saveState === 'error' ? '#B91C1C' : saveState === 'saving' ? '#1E40AF' : '#92400E'
              }}>
                {saveState === 'saved' ? `✓ 已發佈 ${savedAt}` : saveState === 'saving' ? '儲存中…' : saveState === 'error' ? '⚠ 儲存失敗' : saveState === 'dirty' ? '● 有未發佈變更' : '尚未變更'}
              </span>
            )}
            <button onClick={async () => { try { await exportSlidesToPdf(slides); } catch (e) { alert('PDF 匯出失敗：' + e.message); } }} disabled={slides.length === 0}
              className="px-4 py-2.5 rounded-xl font-bold shadow active:scale-95" style={{ background: slides.length ? '#fff' : '#eee', color: '#B91C1C', border: '1px solid #FCA5A5' }}>
              ⬇ 下載 PDF
            </button>
            <button onClick={async () => { try { await exportSlidesToPptx(slides); } catch (e) { alert('PPT 匯出失敗：' + e.message); } }} disabled={slides.length === 0}
              className="px-4 py-2.5 rounded-xl font-bold shadow active:scale-95" style={{ background: slides.length ? '#fff' : '#eee', color: '#92400E', border: '1px solid #FCD34D' }}>
              ⬇ 下載 PPT
            </button>
            {!readOnly && (
              <button onClick={publish} disabled={slides.length === 0}
                className="px-5 py-2.5 rounded-xl font-bold text-white shadow active:scale-95" style={{ background: slides.length ? 'linear-gradient(135deg, #2563EB, #1D4ED8)' : '#ccc' }}>
                💾 儲存並發佈
              </button>
            )}
            <button onClick={async () => { if (!readOnly && pendingRef.current) { const ok = await flush(pendingRef.current); if (!ok) return; } window.open(window.location.pathname + '#present', '_blank'); }} disabled={slides.length === 0}
              className="px-5 py-2.5 rounded-xl font-bold text-white shadow active:scale-95" style={{ background: slides.length ? 'linear-gradient(135deg, #10B981, #059669)' : '#ccc' }}>
              ▶ 開始播放
            </button>
          </div>
        </div>
        <div className="flex flex-wrap gap-2 mt-3">
          <button onClick={addContent} className="flex items-center gap-1 px-3 py-2 rounded-lg text-sm font-bold text-white" style={{ background: '#F5B800' }}><Plus className="w-4 h-4" />內容頁（圖＋字）</button>
          {Object.entries(GAME_SLIDE_META).map(([k, m]) => (
            <button key={k} onClick={() => addGame(k)} className="flex items-center gap-1 px-3 py-2 rounded-lg text-sm font-medium" style={{ background: '#EEF2FF', color: '#4338CA' }}><Plus className="w-3.5 h-3.5" />{m.emoji} {m.label}</button>
          ))}
          {Object.entries(QR_SLIDE_META).map(([k, m]) => (
            <button key={k} onClick={() => addQr(k)} className="flex items-center gap-1 px-3 py-2 rounded-lg text-sm font-medium" style={{ background: '#FCE7F3', color: '#9D174D' }}><Plus className="w-3.5 h-3.5" />{m.emoji} {m.label} QR</button>
          ))}
        </div>
      </div>

      {slides.length === 0 && <div className="bg-white rounded-xl p-8 text-center text-gray-400 border" style={{ borderColor: '#FCD34D' }}>還沒有任何頁面，點上面按鈕新增第一頁吧！</div>}

      {slides.map((s, idx) => (
        <div key={s.id} className="bg-white rounded-xl shadow-sm border overflow-hidden" style={{ borderColor: '#FCD34D' }}>
          <div className="flex items-center justify-between px-4 py-2" style={{ background: '#FFFBEB' }}>
            <div className="flex items-center gap-2 font-bold text-sm" style={{ color: '#92400E' }}>
              <span className="w-6 h-6 rounded-full flex items-center justify-center text-white text-xs" style={{ background: '#F5B800' }}>{idx + 1}</span>
              {s.type === 'game' ? `${GAME_SLIDE_META[s.gameKind]?.emoji || ''} ${GAME_SLIDE_META[s.gameKind]?.label || '遊戲'}（現場畫面）` : s.type === 'qr' ? `${QR_SLIDE_META[s.qrKind]?.emoji || ''} ${QR_SLIDE_META[s.qrKind]?.label || ''} QR Code` : '內容頁'}
            </div>
            <div className="flex items-center gap-1">
              <button onClick={() => move(idx, -1)} disabled={idx === 0} className="p-1.5 rounded hover:bg-yellow-100 disabled:opacity-30"><ChevronUp className="w-4 h-4" /></button>
              <button onClick={() => move(idx, 1)} disabled={idx === slides.length - 1} className="p-1.5 rounded hover:bg-yellow-100 disabled:opacity-30"><ChevronDown className="w-4 h-4" /></button>
              <button onClick={() => dup(idx)} className="p-1.5 rounded hover:bg-yellow-100"><Copy className="w-4 h-4" /></button>
              <button onClick={() => del(s.id)} className="p-1.5 rounded hover:bg-red-50" style={{ color: '#DC2626' }}><Trash2 className="w-4 h-4" /></button>
            </div>
          </div>

          {s.type === 'game' ? (
            <div className="p-4 space-y-3">
              <div className="flex items-center gap-3 text-sm text-gray-600">
                <div className="text-3xl">{GAME_SLIDE_META[s.gameKind]?.emoji}</div>
                <div>播放到這頁時，會直接顯示「{GAME_SLIDE_META[s.gameKind]?.label}」的現場畫面，可直接操作。<br />用簡報筆下一頁即可離開到下一張。</div>
              </div>
              {s.gameKind === 'song' && <div className="text-[11px] rounded-lg p-2" style={{ background: '#FEF3C7', color: '#92400E' }}>提醒：百萬大歌星本身會播放歌曲音檔，若再加背景音樂可能會疊在一起，建議這頁不放背景音樂。</div>}
              <MusicField s={s} update={update} />
            </div>
          ) : s.type === 'qr' ? (
            <div className="p-4 flex flex-col md:flex-row gap-4 items-start">
              <div className="p-2 bg-white rounded-lg border shrink-0" style={{ borderColor: '#eee' }}>
                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent((window.location.origin + window.location.pathname + QR_SLIDE_META[s.qrKind].hash))}`} alt="QR" style={{ width: 120, height: 120 }} />
              </div>
              <div className="flex-1 space-y-2">
                <div className="text-sm text-gray-600">{QR_SLIDE_META[s.qrKind]?.emoji} 播放到這頁會顯示大張 QR Code，觀眾掃碼進入「{QR_SLIDE_META[s.qrKind]?.label}」頁面。</div>
                <input value={s.title || ''} onChange={e => update(s.id, 'title', e.target.value)} placeholder="這頁標題" className="w-full px-3 py-2 rounded-lg border text-base font-bold outline-none" style={{ borderColor: '#FCD34D' }} />
                <div className="text-xs text-gray-400 break-all">{window.location.origin + window.location.pathname + QR_SLIDE_META[s.qrKind].hash}</div>
                <MusicField s={s} update={update} />
              </div>
            </div>
          ) : (
            <div className="p-4 grid md:grid-cols-2 gap-4">
              <div className="space-y-2">
                <input value={s.title} onChange={e => update(s.id, 'title', e.target.value)} placeholder="大標題" className="w-full px-3 py-2 rounded-lg border text-base font-bold outline-none" style={{ borderColor: '#FCD34D' }} />
                <input value={s.subtitle} onChange={e => update(s.id, 'subtitle', e.target.value)} placeholder="副標題（可留空）" className="w-full px-3 py-2 rounded-lg border text-sm outline-none" style={{ borderColor: '#FCD34D' }} />
                <textarea value={s.body} onChange={e => update(s.id, 'body', e.target.value)} placeholder="內文（可留空，支援換行）" rows={3} className="w-full px-3 py-2 rounded-lg border text-sm outline-none resize-y" style={{ borderColor: '#FCD34D' }} />
                <div className="flex flex-wrap items-center gap-2">
                  <label className="text-xs font-bold" style={{ color: '#92400E' }}>圖片：</label>
                  <label className="px-2.5 py-1.5 rounded-lg text-xs font-bold text-white cursor-pointer flex items-center gap-1" style={{ background: '#8B5CF6' }}>
                    <Upload className="w-3.5 h-3.5" />上傳
                    <input type="file" accept="image/*" className="hidden" onChange={e => onUpload(s.id, e.target.files?.[0])} />
                  </label>
                  {s.image && <button onClick={() => update(s.id, 'image', '')} className="text-xs px-2 py-1.5 rounded-lg hover:bg-red-50" style={{ color: '#DC2626' }}>清除圖片</button>}
                </div>
                <input value={s.image && s.image.startsWith('data:') ? '' : (s.image || '')} onChange={e => update(s.id, 'image', e.target.value)} placeholder="或貼圖片網址 https://…" className="w-full px-3 py-2 rounded-lg border text-xs outline-none" style={{ borderColor: '#FCD34D' }} />
                {s.image && (
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs font-bold" style={{ color: '#92400E' }}>圖片當滿版背景</span>
                    <button onClick={() => update(s.id, 'imageAsBg', !s.imageAsBg)} className="px-3 py-1.5 rounded-full text-xs font-bold" style={{ background: s.imageAsBg ? '#F5B800' : '#E5E7EB', color: s.imageAsBg ? '#fff' : '#6B7280' }}>
                      {s.imageAsBg ? '✓ 滿版背景（文字疊上面）' : '關（圖片放中間）'}
                    </button>
                  </div>
                )}
                {s.image && (
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold whitespace-nowrap" style={{ color: '#92400E' }}>圖片明暗</span>
                    <span className="text-xs">暗</span>
                    <input type="range" min="0.2" max="1.5" step="0.05" value={s.imgBright ?? 1} onChange={e => update(s.id, 'imgBright', parseFloat(e.target.value))} className="flex-1 accent-yellow-500" />
                    <span className="text-xs">亮</span>
                    <span className="text-xs w-8 text-right">{Math.round((s.imgBright ?? 1) * 100)}%</span>
                  </div>
                )}
                <MusicField s={s} update={update} />
              </div>

              <div className="space-y-3">
                {/* 預覽 */}
                <div className="rounded-lg overflow-hidden border" style={{ borderColor: '#eee', aspectRatio: '16/9', background: s.bg, position: 'relative' }}>
                  {s.imageAsBg && s.image && <img src={s.image} alt="" className="absolute inset-0 w-full h-full" style={{ objectFit: 'cover', filter: `brightness(${s.imgBright ?? 1})` }} />}
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-3 gap-1" style={{ color: s.textColor === 'dark' ? '#1F2937' : '#fff', alignItems: s.align === 'left' ? 'flex-start' : 'center', textAlign: s.align || 'center' }}>
                    {s.title && <div className="font-black" style={{ fontSize: 22 * (s.textScale ?? 1) }}>{s.title}</div>}
                    {s.subtitle && <div className="font-bold opacity-90" style={{ fontSize: 14 * (s.textScale ?? 1) }}>{s.subtitle}</div>}
                    {s.image && !s.imageAsBg && <img src={s.image} alt="" style={{ maxHeight: 70, borderRadius: 6, filter: `brightness(${s.imgBright ?? 1})` }} />}
                    {s.body && <div className="opacity-90 whitespace-pre-wrap line-clamp-2" style={{ fontSize: 12 * (s.textScale ?? 1) }}>{s.body}</div>}
                  </div>
                </div>
                <div className="flex items-center gap-1 flex-wrap">
                  <span className="text-xs font-bold mr-1" style={{ color: '#92400E' }}>底色</span>
                  {SLIDE_BG_PRESETS.map(c => (
                    <button key={c} onClick={() => update(s.id, 'bg', c)} className="w-6 h-6 rounded-full border-2" style={{ background: c, borderColor: s.bg === c ? '#F5B800' : '#ddd' }} />
                  ))}
                  <input type="color" value={s.bg} onChange={e => update(s.id, 'bg', e.target.value)} className="w-6 h-6 rounded cursor-pointer" />
                </div>
                <div className="flex items-center gap-2 text-xs flex-wrap">
                  <span className="font-bold" style={{ color: '#92400E' }}>文字大小</span>
                  {[['小', 0.8], ['中', 1], ['大', 1.25], ['特大', 1.55]].map(([lbl, v]) => (
                    <button key={lbl} onClick={() => update(s.id, 'textScale', v)} className="px-2 py-1 rounded" style={{ background: (s.textScale ?? 1) === v ? '#F5B800' : '#eee', color: (s.textScale ?? 1) === v ? '#fff' : '#666' }}>{lbl}</button>
                  ))}
                </div>
                <div className="flex items-center gap-3 text-xs">
                  <span className="font-bold" style={{ color: '#92400E' }}>文字色</span>
                  <button onClick={() => update(s.id, 'textColor', 'light')} className="px-2 py-1 rounded" style={{ background: s.textColor !== 'dark' ? '#1F2937' : '#eee', color: s.textColor !== 'dark' ? '#fff' : '#666' }}>白字</button>
                  <button onClick={() => update(s.id, 'textColor', 'dark')} className="px-2 py-1 rounded" style={{ background: s.textColor === 'dark' ? '#1F2937' : '#eee', color: s.textColor === 'dark' ? '#fff' : '#666' }}>黑字</button>
                  <span className="font-bold ml-1" style={{ color: '#92400E' }}>對齊</span>
                  <button onClick={() => update(s.id, 'align', 'center')} className="px-2 py-1 rounded" style={{ background: s.align !== 'left' ? '#F5B800' : '#eee', color: s.align !== 'left' ? '#fff' : '#666' }}>置中</button>
                  <button onClick={() => update(s.id, 'align', 'left')} className="px-2 py-1 rounded" style={{ background: s.align === 'left' ? '#F5B800' : '#eee', color: s.align === 'left' ? '#fff' : '#666' }}>靠左</button>
                </div>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function StandaloneGame({ kind, embed = false }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  // 載入 + polling
  useEffect(() => {
    const load = async () => {
      try {
        const r = await window.storage.get('fule_yellow_party_v7', true);
        if (r?.value) setData(JSON.parse(r.value));
      } catch (e) {}
    };
    load().then(() => setLoading(false));
    const t = setInterval(load, 2000);
    return () => clearInterval(t);
  }, []);

  // 寫回 storage（合併保護前台名單/投票/搶答）
  const persist = async (patch) => {
    try {
      const r = await window.storage.get('fule_yellow_party_v7', true);
      const cur = r?.value ? JSON.parse(r.value) : {};
      const next = { ...cur, ...patch };
      await window.storage.set('fule_yellow_party_v7', JSON.stringify(next), true);
      setData(next);
    } catch (e) {}
  };

  const closeWin = () => { window.location.hash = 'live'; };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: '#0F0F0F' }}>
      <div className="animate-spin w-12 h-12 rounded-full border-4" style={{ borderColor: '#F5B800', borderTopColor: 'transparent' }}></div>
    </div>;
  }

  if (kind === 'runway') {
    return <RunwayGame
      contestants={data?.contestants || []}
      contestantVotes={data?.contestantVotes || {}}
      votingOpen={!!data?.votingOpen}
      showVoteResults={!!data?.showVoteResults}
      setVotingOpen={(v) => persist({ votingOpen: typeof v === 'function' ? v(!!data?.votingOpen) : v })}
      setShowVoteResults={(v) => persist({ showVoteResults: typeof v === 'function' ? v(!!data?.showVoteResults) : v })}
      signupClosed={!!data?.signupClosed}
      setSignupClosed={(v) => persist({ signupClosed: typeof v === 'function' ? v(!!data?.signupClosed) : v })}
      embed={embed} onExit={closeWin} />;
  }
  if (kind === 'song') {
    return <SongGame
      songs={data?.songs || []}
      setSongs={(v) => persist({ songs: typeof v === 'function' ? v(data?.songs || []) : v })}
      embed={embed} onExit={closeWin} />;
  }
  if (kind === 'quiz' || kind === 'quizlive') {
    return <QuizLiveHost quizQuestions={data?.quizQuestions || []} settings={data?.settings || {}} embed={embed} onExit={closeWin} />;
  }
  if (kind === 'lottery') {
    return <LotteryGame
      registrations={data?.registrations || []}
      sponsorships={data?.sponsorships || []}
      lotteryWinners={data?.lotteryWinners || []}
      setLotteryWinners={(v) => persist({ lotteryWinners: typeof v === 'function' ? v(data?.lotteryWinners || []) : v })}
      settings={data?.settings || {}}
      embed={embed} onExit={closeWin} />;
  }
  if (kind === 'live') {
    return <LiveMode
      flow={data?.flow || []}
      awards={data?.awards || []}
      staff={data?.staff || []}
      contestants={data?.contestants || []}
      contestantVotes={data?.contestantVotes || {}}
      votingOpen={!!data?.votingOpen}
      showVoteResults={!!data?.showVoteResults}
      setVotingOpen={(v) => persist({ votingOpen: typeof v === 'function' ? v(!!data?.votingOpen) : v })}
      setShowVoteResults={(v) => persist({ showVoteResults: typeof v === 'function' ? v(!!data?.showVoteResults) : v })}
      songs={data?.songs || []}

      quizQuestions={data?.quizQuestions || []}

      settings={data?.settings || {}}
      onExit={() => { window.location.hash = 'admin'; }} />;
  }
  return null;
}

function VoterPage() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [voterId] = useState(generateVoterId());
  const [votedFor, setVotedFor] = useState(null);
  const [justVoted, setJustVoted] = useState(false);

  const loadData = useCallback(async () => {
    try {
      const r = await window.storage.get(STORAGE_KEY, true);
      if (r?.value) {
        const d = JSON.parse(r.value);
        setData(d);
        // 檢查自己是否已投過
        const votes = d.contestantVotes || {};
        for (const [cid, voters] of Object.entries(votes)) {
          if (voters.includes(voterId)) {
            setVotedFor(Number(cid));
            break;
          }
        }
      }
    } catch (e) { console.log('Load error:', e); }
    setLoading(false);
  }, [voterId]);

  useEffect(() => { loadData(); }, [loadData]);

  // 每 3 秒刷新一次
  useEffect(() => {
    const t = setInterval(loadData, 3000);
    return () => clearInterval(t);
  }, [loadData]);

  const handleVote = async (contestantId) => {
    if (votedFor !== null) return;
    if (!data?.votingOpen) return;

    const newData = { ...data };
    newData.contestantVotes = newData.contestantVotes || {};
    // 移除此 voter 的其他投票（理論上不會有，但保險）
    Object.keys(newData.contestantVotes).forEach(cid => {
      newData.contestantVotes[cid] = (newData.contestantVotes[cid] || []).filter(v => v !== voterId);
    });
    // 加入新投票
    if (!newData.contestantVotes[contestantId]) newData.contestantVotes[contestantId] = [];
    newData.contestantVotes[contestantId].push(voterId);

    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(newData), true);
      setData(newData);
      setVotedFor(contestantId);
      setJustVoted(true);
      setTimeout(() => setJustVoted(false), 2000);
    } catch (e) {
      alert('投票失敗，請重試');
    }
  };

  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #FFFBEA 0%, #FFF4CC 100%)' }}>
      <Loader2 className="w-10 h-10 animate-spin" style={{ color: '#F5B800' }} />
    </div>;
  }

  const contestants = data?.contestants || [];
  const votes = data?.contestantVotes || {};
  const totalVotes = Object.values(votes).reduce((s, v) => s + v.length, 0);
  const votingOpen = data?.votingOpen;
  const showResults = data?.showVoteResults;

  return (
    <div className="min-h-screen" style={{ background: 'linear-gradient(135deg, #FFFBEA 0%, #FFF4CC 100%)', fontFamily: '"Noto Sans TC", sans-serif' }}>
      {/* 頂部標題 */}
      <div className="sticky top-0 z-10 backdrop-blur-md border-b" style={{ background: 'rgba(255, 251, 234, 0.95)', borderColor: '#F5B800' }}>
        <div className="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center shadow" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)' }}>
              <Vote className="w-5 h-5 text-white" />
            </div>
            <div>
              <div className="text-sm font-bold" style={{ color: '#1F2937' }}>造型走秀投票</div>
              <div className="text-[10px]" style={{ color: '#92400E' }}>{data?.settings?.eventName || 'BNI 富樂 11 週年'} {data?.settings?.eventTheme || '黃色派對'}</div>
            </div>
          </div>
          <button onClick={loadData} className="p-2 rounded-lg active:bg-yellow-100" title="重新整理">
            <RefreshCw className="w-4 h-4" style={{ color: '#92400E' }} />
          </button>
        </div>
      </div>

      <main className="max-w-lg mx-auto px-4 py-4 space-y-3 pb-12">
        {/* 狀態提示 */}
        {!votingOpen ? (
          <div className="rounded-2xl p-6 text-center" style={{ background: 'white', border: '2px solid #FCD34D' }}>
            <Lock className="w-12 h-12 mx-auto mb-2" style={{ color: '#F5B800' }} />
            <div className="text-lg font-bold mb-1" style={{ color: '#92400E' }}>投票尚未開放</div>
            <div className="text-sm text-gray-600">等待主持人宣布開始投票</div>
          </div>
        ) : votedFor !== null ? (
          <div className="rounded-2xl p-5 text-center shadow-lg" style={{ background: 'linear-gradient(135deg, #10B981, #059669)', color: 'white' }}>
            {justVoted && <div className="text-4xl mb-2 animate-bounce">🎉</div>}
            <CheckCircle2 className="w-10 h-10 mx-auto mb-2" />
            <div className="text-lg font-bold mb-1">您已投票</div>
            <div className="text-sm opacity-90">投給了 #{contestants.find(c => c.id === votedFor)?.number} {contestants.find(c => c.id === votedFor)?.name}</div>
            <div className="text-xs opacity-75 mt-2">每人限投一票</div>
          </div>
        ) : (
          <div className="rounded-2xl p-4 text-center" style={{ background: 'linear-gradient(135deg, #F5B800, #FF9F1C)', color: 'white' }}>
            <ThumbsUp className="w-8 h-8 mx-auto mb-1" />
            <div className="font-bold">投票進行中</div>
            <div className="text-xs opacity-90">選擇您最喜愛的參賽者 · 每人限投一票</div>
          </div>
        )}

        {/* 參賽者列表 */}
        {contestants.length === 0 ? (
          <div className="bg-white rounded-2xl p-8 text-center border" style={{ borderColor: '#FCD34D' }}>
            <Users className="w-12 h-12 mx-auto mb-2 opacity-30" style={{ color: '#92400E' }} />
            <div className="text-sm text-gray-500">尚未有參賽者</div>
          </div>
        ) : (
          <div className="space-y-2">
            {contestants.map(c => {
              const voteCount = (votes[c.id] || []).length;
              const pct = totalVotes > 0 ? (voteCount / totalVotes * 100) : 0;
              const isMyVote = votedFor === c.id;
              const canVote = votingOpen && votedFor === null;

              return (
                <button
                  key={c.id}
                  onClick={() => canVote && handleVote(c.id)}
                  disabled={!canVote}
                  className={`w-full bg-white rounded-2xl p-4 shadow-sm text-left transition ${canVote ? 'active:scale-[0.98] hover:shadow-md' : ''}`}
                  style={{ border: isMyVote ? '3px solid #10B981' : '1px solid #FCD34D', cursor: canVote ? 'pointer' : 'default' }}
                >
                  <div className="flex items-start gap-3">
                    {/* 號碼 */}
                    <div className="shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-2xl" style={{ background: isMyVote ? '#D1FAE5' : 'linear-gradient(135deg, #FEF3C7, #FDE68A)', color: isMyVote ? '#059669' : '#92400E' }}>
                      {c.number}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5">
                        <div className="font-bold truncate" style={{ color: '#1F2937' }}>{c.name}</div>
                        {isMyVote && <CheckCircle2 className="w-4 h-4 shrink-0" style={{ color: '#059669' }} />}
                      </div>
                      {c.style && <div className="text-xs text-gray-500 mb-2 line-clamp-2">{c.style}</div>}

                      {/* 結果顯示（如果開啟） */}
                      {showResults && (
                        <div>
                          <div className="flex items-center justify-between text-xs mb-1">
                            <span style={{ color: '#92400E' }}>{voteCount} 票</span>
                            <span className="font-bold" style={{ color: '#92400E' }}>{pct.toFixed(1)}%</span>
                          </div>
                          <div className="h-2 rounded-full overflow-hidden" style={{ background: '#FEF3C7' }}>
                            <div className="h-full transition-all duration-500" style={{ width: `${pct}%`, background: 'linear-gradient(90deg, #F5B800, #FF9F1C)' }}></div>
                          </div>
                        </div>
                      )}

                      {/* 投票按鈕提示 */}
                      {canVote && (
                        <div className="mt-2 text-xs font-medium flex items-center gap-1" style={{ color: '#F5B800' }}>
                          <Heart className="w-3 h-3" />點此投票
                        </div>
                      )}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}

        {/* 即時統計 */}
        {showResults && totalVotes > 0 && (
          <div className="rounded-xl p-3 text-center" style={{ background: '#FEF3C7', color: '#92400E' }}>
            <div className="text-xs font-bold">目前已投 {totalVotes} 票 · 即時更新</div>
          </div>
        )}
      </main>
      <HomeFAB />
    </div>
  );
}
